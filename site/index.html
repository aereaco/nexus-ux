<!DOCTYPE html>
<html lang="en" style="overflow: hidden; scrollbar-width: none;" data-init data-stylesheet
  data-scrollbar_global="{ mode: 'overlay', autohide: 800, fade: '0.4s' }" data-theme="{ default: 'auto' }" data-router="{
        signal: 'router',
        mode: 'hybrid',
        pagesDir: '_pages',
        manifest: '/_pages/manifest.json',
        error: '/_pages/error.html'
      }" data-import="{ 
        'DaisyUI': { 
          adopt: [
            'https://cdn.jsdelivr.net/npm/daisyui@5',
            'https://cdn.jsdelivr.net/npm/daisyui@5/themes.css'
          ] 
        }, 
        'Iconify': { 
          script: { src: 'https://cdn.jsdelivr.net/npm/iconify-icon@3.0.0/dist/iconify-icon.min.js' }
        }
      }"
  data-signal="{ appReady: false, rtl: localStorage.rtl === 'true', zoom: Number(localStorage.zoom) || 1, tempZoom: Number(localStorage.zoom) || 1 }"
  data-effect="if (!appReady && router?.pageTabs?.length && !router?.activePageTab?.isLoading) { appReady = true; }"
  data-bind-dir="rtl ? 'rtl' : 'ltr'"
  data-bind-style="{ fontSize: (zoom || 1) + 'rem' }">

<head>
  <meta charset="UTF-8">
  <title>Nexus-UX</title>
  <!-- Relative base so the SAME document works whether the server is rooted
       at the repo (/site/ is a subdir) or directly at /site/. A relative
       base keeps _components/, _pages/ and _assets/ fetches resolving
       against wherever index.html is actually served from. The router's
       autoDetectBasePath reads this. -->
  <base href="/">
  <script type="module" src="./dist/nexus-ux.js"></script>
  <link rel="icon" type="image/svg+xml" href="./_assets/images/emblem.svg">
  <style data-stylesheet>
    /* Native CSS Custom Highlight API styling for progressive search */
    ::highlight(search-match) {
      background-color: rgba(59, 130, 246, 0.35);
      color: #93c5fd;
      text-decoration: underline;
    }

    /* Suppress overlay scrollbar tracks until content is revealed */
    .nx-main.opacity-0 .scrollbar-track-v,
    .nx-main.opacity-0 .scrollbar-track-h {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* While external stylesheets (DaisyUI/themes) or pageTabs are loading */
    html:not(.nexus-ready) .nx-main,
    html[data-nexus-loading] .nx-main {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    html:not(.nexus-ready) .nexus-loading-screen {
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    .nx-main {
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nexus-progress-mount {
      position: fixed;
      top: 0;
      inset-inline: 0;
      z-index: 9999;
      height: 3px;
      pointer-events: none;
      transition: opacity 0.35s ease-out;
    }

    .nexus-top-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #570df8, #f000b8, #37cdbe, #570df8);
      background-size: 200% 100%;
      animation: nexus-progress-slide 1.5s infinite linear;
    }

    @keyframes nexus-progress-slide {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    .nexus-loading-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f1f5f9 0%, #ffffff 50%, #e2e8f0 100%);
      color: #0f172a;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s;
    }

    @media (prefers-color-scheme: dark) {
      .nexus-loading-screen {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #020617 100%);
        color: #f8fafc;
      }
    }

    html[data-theme='dark'] .nexus-loading-screen,
    html[data-theme='black'] .nexus-loading-screen,
    html[data-theme='night'] .nexus-loading-screen {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #020617 100%);
      color: #f8fafc;
    }

    .nexus-loader-emblem {
      animation: nexus-loader-pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 24px rgba(87, 13, 248, 0.5));
    }

    @keyframes nexus-loader-pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.85;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
        filter: drop-shadow(0 0 32px rgba(240, 0, 184, 0.65));
      }
    }

    tab-content>body {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 100%;
      margin: 0;
      background: transparent;
    }
  </style>
</head>

<body style="overflow: hidden; scrollbar-width: none;"
  class="bg-gradient-to-br from-base-200 via-base-100 to-base-300 h-screen max-h-screen overflow-hidden font-sans antialiased text-base-content">
  <!-- Top Indeterminate Progress Bar (declaratively visible on route load) -->
  <div class="nexus-progress-mount" aria-hidden="true"
    data-class="{ 'opacity-100': router?.activePageTab?.isLoading, 'opacity-0': !router?.activePageTab?.isLoading }">
    <div class="nexus-top-bar"></div>
  </div>

  <!-- Sleek Centered Loading Splash -->
  <div class="nexus-loading-screen" aria-label="Loading application" data-class="{
      'opacity-0 pointer-events-none invisible': appReady,
      'opacity-100 pointer-events-auto visible': !appReady
    }">
    <div class="relative flex flex-col items-center gap-5 select-none">
      <div class="relative w-20 h-20 flex items-center justify-center">
        <div class="absolute inset-0 rounded-full bg-primary/20 blur-2xl animate-pulse"></div>
        <svg class="nexus-loader-emblem w-14 h-14 relative z-10" viewBox="0 0 10.594 10.594"
          xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(-42.525 -200.67)">
            <g transform="matrix(.66735 0 0 .66735 -88.919 71.304)" style="fill:#570df8">
              <path
                d="m196.97 201.78c0 4.3897 3.5478 7.9375 7.9375 7.9375 4.3897 0 7.9375-3.5478 7.9375-7.9375 0-4.3897-3.5478-7.9375-7.9375-7.9375-4.3897 0-7.9375 3.5598-7.9375 7.9375zm1.757 3.1575c0-0.63138 0.50511-1.1365 1.1365-1.1365 0.6314 0 1.1365 0.5051 1.1365 1.1365 0 0.63135-0.50513 1.1364-1.1365 1.1364-0.63141 0-1.1365-0.5051-1.1365-1.1364zm1.7679-3.0306c0-0.63136 0.50513-1.1365 1.1365-1.1365 0.6314 0 1.1365 0.5051 1.1365 1.1365 0 0.63137-0.50512 1.1365-1.1365 1.1365-0.63141 0-1.1365-0.50509-1.1365-1.1365zm1.5154 3.0306c0-0.63138 0.50513-1.1365 1.1365-1.1365s1.1366 0.5051 1.1366 1.1365c0 0.63135-0.50515 1.1364-1.1366 1.1364s-1.1365-0.5051-1.1365-1.1364zm0-6.0611c0-0.63136 0.50513-1.1364 1.1365-1.1364s1.1366 0.50508 1.1366 1.1364c0 0.63138-0.50515 1.1365-1.1366 1.1365s-1.1365-0.50508-1.1365-1.1365zm1.7679 3.0306c0-0.63136 0.50515-1.1365 1.1365-1.1365 0.63141 0 1.1366 0.5051 1.1366 1.1365 0 0.63137-0.50514 1.1365-1.1366 1.1365-0.63138 0-1.1365-0.50509-1.1365-1.1365zm3.4e-4 -6.0611c0-0.63137 0.50515-1.1365 1.1365-1.1365 0.6314 0 1.1365 0.5051 1.1365 1.1365 0 0.63136-0.50513 1.1364-1.1365 1.1364-0.63139 0-1.1365-0.50508-1.1365-1.1364zm1.7676 9.0916c0-0.63138 0.50514-1.1365 1.1365-1.1365s1.1365 0.5051 1.1365 1.1365c0 0.63135-0.50513 1.1364-1.1365 1.1364s-1.1365-0.5051-1.1365-1.1364zm0-6.0611c0-0.63136 0.50514-1.1364 1.1365-1.1364s1.1365 0.50508 1.1365 1.1364c0 0.63138-0.50513 1.1365-1.1365 1.1365s-1.1365-0.50508-1.1365-1.1365zm1.5154 3.0306c0-0.63136 0.50513-1.1365 1.1365-1.1365 0.6314 0 1.1365 0.5051 1.1365 1.1365 0 0.63137-0.50511 1.1365-1.1365 1.1365-0.63141 0-1.1365-0.50509-1.1365-1.1365zm1.7679 3.0306c0-0.63138 0.50511-1.1365 1.1365-1.1365s1.1365 0.5051 1.1365 1.1365c0 0.63135-0.50512 1.1364-1.1365 1.1364s-1.1365-0.5051-1.1365-1.1364z"
                style="fill:#570df8;stroke-width:.12026" />
            </g>
          </g>
        </svg>
      </div>
      <div class="flex flex-col items-center gap-1.5">
        <span class="text-xs text-slate-400 font-mono tracking-widest animate-pulse">Loading...</span>
      </div>
    </div>
  </div>

  <main class="nx-main h-full flex flex-col min-h-0"
    style="visibility: hidden; overflow: hidden;"
    data-style="{
      visibility: appReady ? 'visible' : 'hidden',
      overflow: appReady ? '' : 'hidden'
    }"
    data-class="{
      'opacity-100 pointer-events-auto': appReady,
      'opacity-0 pointer-events-none': !appReady
    }">
    <app-layout data-component="'_components/layout.html?v=13'"
      class="block h-full flex-1 flex flex-col min-h-0"></app-layout>
  </main>
</body>

</html>
