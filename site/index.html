<!DOCTYPE html>
<html lang="en" data-init data-stylesheet data-scrollbar_global="{ mode: 'overlay', autohide: 800, fade: '0.4s' }"
  data-theme="{ default: 'auto' }" data-router="{
        signal: 'router',
        mode: 'hybrid',
        pagesDir: '_pages',
        manifest: '/_pages/manifest.json',
        error: '/_pages/error.html'
      }" data-import="{ 
        'DaisyUI': { 
          adopt: [
            'https://cdn.jsdelivr.net/npm/daisyui@5',
            'https://cdn.jsdelivr.net/npm/daisyui@5/themes.css'
          ] 
        }, 
        'Iconify': { 
          script: { src: 'https://cdn.jsdelivr.net/npm/iconify-icon@3.0.0/dist/iconify-icon.min.js' }
        }
      }"
  data-signal="{ appReady: false, rtl: localStorage.rtl === 'true', zoom: Number(localStorage.zoom) || 1, tempZoom: Number(localStorage.zoom) || 1 }"
  data-on-nexus-ready_document="appReady = true"
  data-effect="if (document.documentElement.classList.contains('nexus-ready')) appReady = true"
  data-bind-dir="rtl ? 'rtl' : 'ltr'" data-bind-style="{ fontSize: (zoom || 1) + 'rem' }">


<head>
  <meta charset="UTF-8">
  <title>Nexus-UX</title>
  <!-- Relative base so the SAME document works whether the server is rooted
       at the repo (/site/ is a subdir) or directly at /site/. A relative
       base keeps _components/, _pages/ and _assets/ fetches resolving
       against wherever index.html is actually served from. The router's
       autoDetectBasePath reads this. -->
  <base href="/">
  <script type="module" src="./dist/nexus-ux.js"></script>
  <link rel="icon" type="image/svg+xml" href="./_assets/images/emblem.svg">
  <style>
    /* 1. Static Pre-JS FOUC Guard */
    html:not(.nexus-ready) .nx-main {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    html.nexus-ready .nx-main {
      opacity: 1 !important;
      visibility: visible !important;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 2. Top Progress Bar */
    .nexus-progress-mount {
      position: fixed;
      top: 0;
      inset-inline: 0;
      z-index: 9999;
      height: 3px;
      pointer-events: none;
      transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
    }

    .nexus-top-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #570df8, #f000b8, #37cdbe, #570df8);
      background-size: 200% 100%;
      animation: nexus-progress-slide 1.5s infinite linear;
    }

    @keyframes nexus-progress-slide {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* 3. Sleek Loading Splash Screen */
    .nexus-loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.97) 0%, rgba(2, 6, 23, 0.99) 100%);
      transition: opacity 0.45s ease-out, visibility 0.45s ease-out;
    }

    html.nexus-ready .nexus-loading-screen,
    html.nexus-ready .nexus-progress-mount {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .nexus-loader-emblem {
      animation: nexus-loader-pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 24px rgba(87, 13, 248, 0.5));
    }

    @keyframes nexus-loader-pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.85;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
        filter: drop-shadow(0 0 32px rgba(240, 0, 184, 0.65));
      }
    }

    /* 4. Tab Content Scaffolding */
    tab-content>body {
      display: flex;
      flex-direction: column;
      flex: 1 1 0%;
      min-height: 0;
      height: 100%;
      margin: 0;
      background: transparent;
    }
  </style>
</head>

<body
  class="bg-gradient-to-br from-base-200 via-base-100 to-base-300 h-screen max-h-screen overflow-hidden font-sans antialiased text-base-content">
  <!-- Top Indeterminate Progress Bar -->
  <div class="nexus-progress-mount" aria-hidden="true">
    <div class="nexus-top-bar"></div>
  </div>

  <!-- Sleek Centered Loading Splash -->
  <div class="nexus-loading-screen" aria-label="Loading application">
    <div class="relative flex flex-col items-center gap-5 select-none">
      <div class="relative w-20 h-20 flex items-center justify-center">
        <div class="absolute inset-0 rounded-full bg-primary/20 blur-2xl animate-pulse"></div>
        <img src="./_assets/images/emblem.svg" alt="Nexus-UX" class="nexus-loader-emblem w-14 h-14 relative z-10" />
      </div>
      <div class="flex flex-col items-center gap-1.5">
        <span class="text-xs text-slate-400 font-mono tracking-widest animate-pulse">Loading...</span>
      </div>
    </div>
  </div>

  <main class="nx-main h-full flex flex-col min-h-0">
    <app-layout data-component="'_components/layout.html'"
      class="block h-full flex-1 flex flex-col min-h-0"></app-layout>
  </main>
</body>

</html>
