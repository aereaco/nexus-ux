<!DOCTYPE html>
<html lang="en" data-init data-debug data-stylesheet data-scrollbar:global="{ mode: 'overlay', autohide: 800, fade: '0.4s' }" data-theme="{ default: 'auto' }" data-router="{
        signal: 'router',
        mode: 'hybrid',
        pagesDir: '_pages',
        manifest: '/_pages/manifest.json',
        error: '/_internal/error.html'
      }" data-import="{ 
        'DaisyUI': { 
          link: [
            { href: 'https://cdn.jsdelivr.net/npm/daisyui@5' },
            { href: 'https://cdn.jsdelivr.net/npm/daisyui@5/themes.css' }
          ] 
        }, 
        'Iconify': { 
          script: { src: 'https://cdn.jsdelivr.net/npm/iconify-icon@3.0.0/dist/iconify-icon.min.js' }
        }
      }" data-signal="{ appReady: true }">


<head>
  <meta charset="UTF-8">
  <title>Nexus-UX</title>
  <!-- Relative base so the SAME document works whether the server is rooted
       at the repo (/site/ is a subdir) or directly at /site/. A relative
       base keeps _components/, _pages/ and _assets/ fetches resolving
       against wherever index.html is actually served from. The router's
       autoDetectBasePath reads this. -->
  <base href="/">
  <script type="module" src="./dist/nexus-ux.js"></script>
  <link rel="icon" type="image/svg+xml" href="./_assets/images/emblem.svg">
  <style>
    /* Progress Bar */
    .nexus-progress-mount {
      position: fixed;
      top: 0;
      inset-inline: 0;
      z-index: 9999;
    }

    progress {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: transparent;
      height: 0.5rem;
      margin: 0;
      display: block;
    }

    progress::-webkit-progress-bar {
      background-color: rgba(166, 173, 187, 0.2);
    }

    progress::-webkit-progress-value {
      background-color: #570df8;
    }

    progress::-moz-progress-bar {
      background-color: #570df8;
    }

    /* Main Layout */
    main.nx-main {
      opacity: 1;
      transition: opacity 0.5s ease-in;
    }

    /* Zero-Flash Native Scrollbar Suppression for Overlay Mode */
    .overflow-auto,
    .overflow-y-auto,
    .overflow-x-auto,
    .overflow-scroll,
    .overflow-y-scroll,
    .overflow-x-scroll,
    [data-scrollbar] {
      scrollbar-width: none !important;
    }
    .overflow-auto::-webkit-scrollbar,
    .overflow-y-auto::-webkit-scrollbar,
    .overflow-x-auto::-webkit-scrollbar,
    .overflow-scroll::-webkit-scrollbar,
    .overflow-y-scroll::-webkit-scrollbar,
    .overflow-x-scroll::-webkit-scrollbar,
    [data-scrollbar]::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
  </style>
</head>

<body
  class="bg-gradient-to-br from-base-200 via-base-100 to-base-300 min-h-screen font-sans antialiased text-base-content">
  <main class="nx-main">
    <app-layout data-component="'_components/layout.html'"></app-layout>
  </main>

</body>

</html>
