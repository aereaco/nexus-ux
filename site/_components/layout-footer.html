<!-- Page Footer with Inline Diagnostics (within content drawer, not below sidebar) -->
<footer
  class="w-full px-6 py-2.5 text-xs bg-base-300/80 backdrop-blur-md border-t border-base-content/10 shrink-0 z-10 flex flex-wrap items-center justify-between gap-4 mt-auto transition-all duration-300"
  data-class="{ 'sticky bottom-0': fixedFooter }">
  <div class="flex flex-wrap items-center gap-x-5 gap-y-1 font-mono opacity-80">
    <span class="inline-flex items-center gap-1.5"><span class="badge badge-xs badge-accent"></span><span
        data-bind="'Width: ' + window.innerWidth + 'px'"></span></span>
    <span class="inline-flex items-center gap-1.5"><span class="badge badge-xs badge-secondary"></span><span
        data-bind="'Mobile: ' + isMobile"></span></span>
    <span class="inline-flex items-center gap-1.5"><span class="badge badge-xs badge-info"></span><span
        data-bind="'Sidebar: ' + (collapsed ? 'Collapsed' : 'Expanded')"></span></span>
    <span class="inline-flex items-center gap-1.5"><span class="badge badge-xs badge-success"></span><span
        data-bind="'Route: ' + (router.route || '/')"></span></span>
    <span class="inline-flex items-center gap-1.5"><span class="badge badge-xs badge-warning"></span><span
        data-bind="'Zoom: ' + (zoom || 1) + 'x'"></span></span>
  </div>
  <div class="flex items-center gap-4 text-xs opacity-60 font-sans">
    <span>Nexus-UX Engine</span>
    <span data-bind="'Tabs: ' + (router.pageTabs?.length || 0)"></span>
  </div>
</footer>
