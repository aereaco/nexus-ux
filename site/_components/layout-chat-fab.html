<!-- ================= Collaborative Chat FAB & Speed Dial (Anchored to Content Wrapper) ================= -->
<div data-show="!chatbarOpen" class="absolute z-40 select-none flex flex-col items-end"
  data-signal="{
    fabRight: Number(localStorage.fabRight || 24),
    fabBottom: Number(localStorage.fabBottom || 24),
    dragging: false,
    moved: false,
    startX: 0,
    startY: 0,
    startRight: 0,
    startBottom: 0,
    onPointerDown: function(e) {
      if (e.button !== 0) return;
      dragging = true;
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      startRight = fabRight;
      startBottom = fabBottom;
      e.currentTarget.setPointerCapture(e.pointerId);
    },
    onPointerMove: function(e) {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
        moved = true;
      }
      const parent = $el.parentElement;
      const parentRect = parent ? parent.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
      const maxRight = Math.max(12, parentRect.width - 76);
      const maxBottom = Math.max(12, parentRect.height - 76);
      
      const newRight = Math.max(12, Math.min(maxRight, startRight - dx));
      const newBottom = Math.max(12, Math.min(maxBottom, startBottom - dy));
      
      fabRight = newRight;
      fabBottom = newBottom;
      localStorage.setItem('fabRight', String(newRight));
      localStorage.setItem('fabBottom', String(newBottom));
    },
    onPointerUp: function(e) {
      if (dragging) {
        dragging = false;
        try { e.currentTarget.releasePointerCapture(e.pointerId); } catch(err) {}
      }
    },
    onClick: function() {
      if (!moved) {
        chatFabOpen = !chatFabOpen;
      }
    }
  }"
  data-style="{ right: fabRight + 'px', bottom: fabBottom + 'px' }">

  <!-- Speed Dial Action Pills: Stacks upward when chatFabOpen is true -->
  <div data-show="chatFabOpen"
    class="mb-3 flex flex-col items-end gap-3 transition-all duration-300">
    <!-- "New Conversation" Action -->
    <div class="flex items-center gap-2.5">
      <span class="badge badge-neutral shadow-lg font-medium text-xs py-2 px-3">New Conversation</span>
      <button type="button"
        class="btn btn-circle btn-sm btn-secondary shadow-xl hover:scale-110 active:scale-95 transition-transform"
        aria-label="New Conversation" data-on-click="createChatSession()">
        <iconify-icon icon="material-symbols-light:add" class="text-lg"></iconify-icon>
      </button>
    </div>

    <!-- Speed Dial Session Pills (Correlate to chatSessions, draggable & contextmenu pinnable) -->
    <div class="flex flex-col items-end gap-3 w-full"
      data-drag="{ list: 'chatSessions', group: 'chatSessions', direction: 'vertical' }">
      <template data-for="session in (chatSessions || [])">
        <div data-drag-item class="flex items-center gap-2.5 cursor-grab active:cursor-grabbing select-none"
          data-on-contextmenu_prevent_stop="ctxMenu = { open: true, x: $evt.clientX, y: $evt.clientY, type: 'chatSession', target: session }">
          <span
            class="badge badge-neutral shadow-lg font-medium text-xs py-2 px-3 max-w-xs truncate cursor-pointer hover:bg-neutral-focus transition-colors flex items-center gap-1.5"
            data-on-click="openSession(session.id)">
            <iconify-icon data-show="session.pinned" icon="material-symbols-light:keep"
              class="text-xs text-secondary shrink-0"></iconify-icon>
            <span data-bind="session.name"></span>
          </span>
          <button type="button"
            class="btn btn-circle btn-md btn-primary shadow-xl hover:scale-110 active:scale-95 transition-transform relative"
            aria-label="Open Session" data-on-click="openSession(session.id)">
            <iconify-icon data-bind-icon="session.icon" class="text-xl"></iconify-icon>
            <!-- Pinned Indicator Badge -->
            <span data-show="session.pinned"
              class="badge badge-xs badge-secondary absolute -top-1 -start-1 size-4 p-0 flex items-center justify-center shadow-sm">
              <iconify-icon icon="material-symbols-light:keep" class="text-[10px]"></iconify-icon>
            </span>
            <!-- Unread Badge -->
            <span data-show="session.unread > 0"
              class="badge badge-xs badge-error indicator-item absolute -top-1 -end-1 shadow-sm"
              data-bind="session.unread"></span>
          </button>
        </div>
      </template>
    </div>
  </div>

  <!-- Primary Floating Action Button (FAB): Freely draggable anywhere inside content container -->
  <div class="flex items-center justify-end">
    <button type="button"
      class="btn btn-circle btn-lg btn-primary shadow-2xl hover:scale-105 active:scale-95 transition-transform duration-200 border-2 border-primary-content/20 flex items-center justify-center relative cursor-grab active:cursor-grabbing touch-none select-none"
      aria-label="Toggle Collaboration Speed Dial"
      title="Drag to reposition anywhere, click to toggle"
      data-on-pointerdown="onPointerDown($evt)"
      data-on-pointermove="onPointerMove($evt)"
      data-on-pointerup="onPointerUp($evt)"
      data-on-click="onClick()">
      <!-- Main Chat Icon (when speed dial closed) -->
      <iconify-icon icon="material-symbols-light:chat" class="text-3xl transition-transform duration-300 pointer-events-none"
        data-class="{ 'rotate-90 opacity-0 scale-50 hidden': chatFabOpen, 'rotate-0 opacity-100 scale-100 block': !chatFabOpen }"></iconify-icon>
      <!-- Close (✕) Icon (when speed dial open) -->
      <iconify-icon icon="material-symbols-light:close" class="text-3xl transition-transform duration-300 pointer-events-none"
        data-class="{ 'rotate-0 opacity-100 scale-100 block': chatFabOpen, '-rotate-90 opacity-0 scale-50 hidden': !chatFabOpen }"></iconify-icon>
      <!-- Global unread indicator -->
      <span data-show="!chatFabOpen && (chatSessions || []).some(s => s.unread > 0)"
        class="badge badge-xs badge-error absolute top-0 end-0 size-3 rounded-full border-2 border-base-100 pointer-events-none"></span>
    </button>
  </div>

</div>
