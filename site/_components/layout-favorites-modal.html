<!-- Add / Edit Favorite Modal -->
<div class="modal modal-bottom sm:modal-middle" data-class-modal-open="favModalOpen"
  data-on-keydown_escape_window="favModalOpen = false">
  <div class="modal-box bg-base-100 border border-base-content/10 shadow-2xl">
    <h3 class="font-bold text-lg flex items-center gap-2">
      <iconify-icon
        data-bind-icon="favForm.id ? 'material-symbols-light:edit-outline' : 'material-symbols-light:star-outline'"
        class="text-warning text-2xl"></iconify-icon>
      <span data-bind="favForm.id ? 'Edit Favorite' : 'Add to Favorites'"></span>
    </h3>
    <p class="py-2 text-sm opacity-70">Customize the title and icon for your bookmark.</p>
    <div class="form-control w-full space-y-4 my-2">
      <div>
        <label class="label"><span class="label-text font-semibold">Title</span></label>
        <input id="fav-modal-title" type="text" class="input input-bordered w-full" data-bind="favForm.title"
          placeholder="Title" />
      </div>
      <div>
        <label class="label"><span class="label-text font-semibold">Destination URL / Page</span></label>
        <input id="fav-modal-href" type="text" class="input input-bordered w-full" data-bind="favForm.href"
          placeholder="URL" />
      </div>
      <div>
        <label class="label"><span class="label-text font-semibold">Icon</span></label>
        <div class="flex items-center gap-2">
          <input type="text" class="input input-bordered grow" data-bind="favForm.icon"
            placeholder="material-symbols-light:star" />
          <div class="avatar placeholder">
            <div
              class="bg-base-200 text-base-content rounded-box size-10 flex items-center justify-center border border-base-content/10">
              <iconify-icon data-bind-icon="favForm.icon || 'material-symbols-light:star'"
                class="text-xl"></iconify-icon>
            </div>
          </div>
        </div>
      </div>
      <div>
        <label class="label"><span class="label-text font-semibold">Group / Folder (Optional)</span></label>
        <input type="text" class="input input-bordered w-full" list="fav-groups-datalist" data-bind="favForm.group"
          placeholder="e.g. Work, Tools, Personal..." />
        <datalist id="fav-groups-datalist">
          <template data-for="grp in favoriteGroups">
            <option data-bind-value="grp"></option>
          </template>
        </datalist>
      </div>
    </div>
    <div class="modal-action">
      <button type="button" class="btn btn-ghost" data-on-click="favModalOpen = false">Cancel</button>
      <button type="button" class="btn btn-primary" data-on-click="if (favForm.id) {
          const item = (favorites || []).find(f => (f.id || f) === favForm.id);
          if (item) {
            item.title = (favForm.title || '').trim() || 'Bookmark';
            item.href = (favForm.href || '').trim() || '/';
            item.icon = (favForm.icon || '').trim() || 'material-symbols-light:star-outline';
            item.group = (favForm.group || '').trim();
            favorites = [...favorites];
            favoriteGroups = [...new Set(favorites.map(f => (f?.group || '').trim()).filter(Boolean))];
            if (indexedDB?.favorites) indexedDB.favorites.put(item);
            const tId = 'toast-' + Math.floor(Math.random() * 1000000);
            notifications = [{ id: 'notif-' + Math.floor(Math.random() * 1000000), title: 'Favorite Updated', message: item.title + ' updated', type: 'success', priority: 'normal', time: 'Just now', read: false }, ...(notifications || [])];
            toasts = [...(toasts || []), { id: tId, message: 'Favorite updated successfully', type: 'success' }];
            setTimeout(() => { toasts = (toasts || []).filter(t => t.id !== tId); }, 7000);
          }
        } else {
          const newFav = {
            id: 'fav-' + Math.floor(Math.random() * 1000000000),
            title: (favForm.title || '').trim() || 'Bookmark',
            href: (favForm.href || '').trim() || '/',
            icon: (favForm.icon || '').trim() || 'material-symbols-light:star-outline',
            group: (favForm.group || '').trim()
          };
          favorites = [...(favorites || []), newFav];
          favoriteGroups = [...new Set(favorites.map(f => (f?.group || '').trim()).filter(Boolean))];
          if (indexedDB?.favorites) indexedDB.favorites.put(newFav);
          const tId = 'toast-' + Math.floor(Math.random() * 1000000);
          notifications = [{ id: 'notif-' + Math.floor(Math.random() * 1000000), title: 'Favorite Added', message: newFav.title + ' saved to bookmarks', type: 'success', priority: 'normal', time: 'Just now', read: false }, ...(notifications || [])];
          toasts = [...(toasts || []), { id: tId, message: 'Favorite added to bookmarks', type: 'success' }];
          setTimeout(() => { toasts = (toasts || []).filter(t => t.id !== tId); }, 7000);
        };
        favModalOpen = false">
        <span data-bind="favForm.id ? 'Update Favorite' : 'Save Favorite'"></span>
      </button>
    </div>
  </div>
  <div class="modal-backdrop bg-base-900/40" data-on-click="favModalOpen = false"></div>
</div>

<!-- Delete Favorite Confirmation Modal -->
<div class="modal modal-bottom sm:modal-middle" data-class-modal-open="favDeleteModalOpen"
  data-on-keydown_escape_window="favDeleteModalOpen = false">
  <div class="modal-box bg-base-100 border border-base-content/10 shadow-2xl">
    <h3 class="font-bold text-lg text-error flex items-center gap-2">
      <iconify-icon icon="material-symbols-light:warning-outline" class="text-2xl"></iconify-icon>
      Remove Favorite?
    </h3>
    <p class="py-4 text-sm opacity-80">Are you sure you want to remove this item from your favorites? This action
      cannot be undone.</p>
    <div class="modal-action">
      <button type="button" class="btn btn-ghost"
        data-on-click="pendingDeleteId = null; favDeleteModalOpen = false">Cancel</button>
      <button type="button" class="btn btn-error" data-on-click="if (pendingDeleteId) {
          favorites = (favorites || []).filter(f => (f.id || f.href || f) !== pendingDeleteId);
          favoriteGroups = [...new Set(favorites.map(f => (f?.group || '').trim()).filter(Boolean))];
          if (indexedDB?.favorites) indexedDB.favorites.delete(pendingDeleteId);
          pendingDeleteId = null;
          const tId = 'toast-' + Math.floor(Math.random() * 1000000);
          notifications = [{ id: 'notif-' + Math.floor(Math.random() * 1000000), title: 'Favorite Removed', message: 'Bookmark removed', type: 'info', priority: 'normal', time: 'Just now', read: false }, ...(notifications || [])];
          toasts = [...(toasts || []), { id: tId, message: 'Favorite removed', type: 'info' }];
          setTimeout(() => { toasts = (toasts || []).filter(t => t.id !== tId); }, 7000);
        };
        favDeleteModalOpen = false">
        Remove
      </button>
    </div>
  </div>
  <div class="modal-backdrop bg-base-900/40" data-on-click="favDeleteModalOpen = false"></div>
</div>
