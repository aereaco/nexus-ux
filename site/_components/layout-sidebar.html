      </ul>
    </li>
  </template>

  <!-- ================= 2. Middle Content Section (Scrollable) ================= -->

    <!-- Main Navigation Menu (tab 1) -->

            <div class="flex rounded-lg transition-colors" data-class="{ 'menu-active active bg-primary text-primary-content font-semibold shadow-sm': (collapsed && !hovered && !sidebarOpen) && item.href && ((router.activePageTab?.route || router.path) === item.href || (item.href !== '/' && (router.activePageTab?.route || router.path || '').startsWith(item.href))), 'text-primary font-medium bg-base-200/40': (!collapsed || hovered || sidebarOpen) && item.href !== '/' && (router.activePageTab?.route || router.path || '').startsWith(item.href) && (router.activePageTab?.route || router.path) !== item.href }">

                <span class="whitespace-nowrap" data-class="{ 'hidden': collapsed && !hovered && !sidebarOpen }"

                  data-class="{ 'rotate-90': open}"></iconify-icon>
              </button>
            </div>
            <ul
              class="menu-dropdown menu-dropdown-show ms-12 overflow-hidden [interpolate-size:allow-keywords] transition-[height,opacity] duration-300 ease-in-out"
              data-class="{ 'h-auto opacity-100': open && (!collapsed || hovered || sidebarOpen), 'h-0 opacity-0 pointer-events-none': (collapsed && !hovered && !sidebarOpen) || !open }"
              data-drag="item.children">
              <template data-for="item in item.children" data-template="#sidebar-sub-menu-item"></template>
            </ul>
          </li>
        </template>
      </ul>

      <!-- 2. Categorized Sections (Draggable Category Groups & Dedicated Item Lists) -->

              </li>
              <li class="w-full h-px bg-base-content/10 my-1"></li>

            <!-- Dynamic Category Item List (Zero Hardcoding, Zero Duplication) -->

              data-drag="(router.pages || []).filter(p => (p.category || p.meta?.category) === cat.name)">

                    data-bind-data-tab-icon="item.tabIcon || item.icon || item.meta?.icon"
                    data-bind-aria-current="(router.activePageTab?.route || router.path) === item.href ? 'page' : null"
                    data-class="{ 'menu-active active bg-primary text-primary-content font-semibold shadow-sm': (router.activePageTab?.route || router.path) === item.href }"
                    data-on-click="if (isMobile) { sidebarOpen = false; activeSidebarTab = 1; }"
                    data-on-contextmenu_prevent_stop="ctxMenu = { open: true, x: $evt.clientX, y: $evt.clientY, type: 'nav', target: item }">

                      data-bind="item.title"></span>
                  </a>
                </li>

                <!-- Case A: Branch Item with Route (dual-action: click title navigates, chevron toggles) -->
                <li data-show="item.children && item.children.length > 0 && !item.meta?.isSubmenu && item.href"

                  <div class="flex rounded-lg transition-colors" data-class="{ 'menu-active active bg-primary text-primary-content font-semibold shadow-sm': (collapsed && !hovered && !sidebarOpen) && item.href && ((router.activePageTab?.route || router.path) === item.href || (item.href !== '/' && (router.activePageTab?.route || router.path || '').startsWith(item.href))), 'text-primary font-medium bg-base-200/40': (!collapsed || hovered || sidebarOpen) && item.href !== '/' && (router.activePageTab?.route || router.path || '').startsWith(item.href) && (router.activePageTab?.route || router.path) !== item.href }">
                    <a data-bind-href="item.href" draggable="false" class="grow flex whitespace-nowrap"

                        data-class="{ 'rotate-90': open}"></iconify-icon>
                    </button>
                  </div>

                    class="menu-dropdown menu-dropdown-show ms-12 overflow-hidden [interpolate-size:allow-keywords] transition-[height,opacity] duration-300 ease-in-out"

                    data-drag="item.children">
                    <template data-for="item in item.children" data-template="#sidebar-sub-menu-item"></template>
                  </ul>
                </li>

                class="btn btn-circle btn-ghost btn-xs text-base-content/60 hover:text-base-content hover:bg-base-300 transition-all"
                title="Edit Favorite"
                data-on-click="searchOpen = false; favForm = { id: fav.id, title: fav.title, href: fav.href, icon: fav.icon, group: fav.group || '' }; favModalOpen = true; $nextTick(() => $('#fav-modal-title')?.focus())">
                <iconify-icon icon="material-symbols-light:edit-outline" class="text-sm"></iconify-icon>
              </button>
              <button
                class="btn btn-circle btn-ghost btn-xs text-error/60 hover:text-error hover:bg-error/10 transition-all"
                title="Remove Favorite" data-on-click="pendingDeleteId = (fav.id || fav); favDeleteModalOpen = true">
                <iconify-icon icon="material-symbols-light:delete-outline" class="text-sm"></iconify-icon>
              </button>
            </div>
          </div>
        </template>
      </div>

      <!-- 2. Categorized / Grouped Favorites (Draggable Whole Groups) -->
      <div data-drag="favoriteGroups">
        <template data-for="grp in favoriteGroups">
          <div data-drag-item data-show="(favorites || []).filter(f => (f.group || '').trim() === grp).length > 0">
            <!-- Group Header (Title + Separator Line) -->
            <ul class="menu w-full py-0">
              <li class="menu-title cursor-grab font-bold text-xs uppercase tracking-wider opacity-60 mt-3"
                data-bind="grp"></li>
              <li class="w-full mx-0 opacity-6"></li>
            </ul>

            <!-- Group Items in Dual-Mode Container -->
            <div class="transition-all duration-300 w-full" data-class="{
                'grid grid-cols-2 gap-2 px-3 py-1': favViewMode === 'grid',
                'flex flex-col gap-1.5 px-3 py-1': favViewMode === 'list'
              }" data-drag="{ list: 'favorites', group: 'favorites' }">
              <template data-for="fav in (favorites || []).filter(f => (f.group || '').trim() === grp)">
                <div data-drag-item
                  data-on-contextmenu_prevent_stop="ctxMenu = { open: true, x: $evt.clientX, y: $evt.clientY, type: 'fav', target: fav }"
                  class="rounded-xl transition-all duration-300 flex border border-transparent min-w-0 cursor-move relative group"
                  data-class="{
                    'p-3 flex-col items-center justify-center text-center h-28 bg-base-200/70 hover:bg-base-200': favViewMode === 'grid',
                    'p-2 items-center gap-3 text-sm bg-base-200/50 hover:bg-base-200': favViewMode === 'list'
                  }">
                  <!-- Main Clickable Area -->
                  <a data-bind-href="fav.href || fav" class="flex-1 flex min-w-0 overflow-hidden" data-class="{
                      'flex-col items-center w-full': favViewMode === 'grid',
                      'items-center gap-3': favViewMode === 'list'
                    }"
                    data-on-contextmenu_prevent_stop="ctxMenu = { open: true, x: $evt.clientX, y: $evt.clientY, type: 'fav', target: fav }">
                    <iconify-icon data-bind-icon="fav.icon || 'material-symbols-light:star'"
                      class="text-warning shrink-0" data-class="{
                        'text-3xl mb-1': favViewMode === 'grid',
                        'text-xl': favViewMode === 'list'
                      }"></iconify-icon>
                    <span class="font-medium leading-tight select-none text-base-content truncate w-full"
                      data-bind="fav.title || fav"></span>
                  </a>

                  <!-- Inline Action Buttons (todo.html design) -->
                  <div class="flex items-center gap-0.5 transition-opacity opacity-0 group-hover:opacity-100 shrink-0"
                    data-on-click_stop="" data-class="{ 'absolute top-2 right-2': favViewMode === 'grid' }">
                    <button
                      class="btn btn-circle btn-ghost btn-xs text-base-content/60 hover:text-base-content hover:bg-base-300 transition-all"
                      title="Edit Favorite"
                      data-on-click="favForm = { id: fav.id, title: fav.title, href: fav.href, icon: fav.icon, group: fav.group || '' }; favModalOpen = true">
                      <iconify-icon icon="material-symbols-light:edit-outline" class="text-sm"></iconify-icon>
                    </button>
                    <button
                      class="btn btn-circle btn-ghost btn-xs text-error/60 hover:text-error hover:bg-error/10 transition-all"
                      title="Delete Favorite"
                      data-on-click="pendingDeleteId = (fav.id || fav); favDeleteModalOpen = true">
                      <iconify-icon icon="material-symbols-light:delete-outline" class="text-sm"></iconify-icon>
                    </button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- Empty State -->
      <div data-show="!favorites || favorites.length === 0" class="text-center py-12 px-4">
        <iconify-icon icon="material-symbols-light:star-outline" class="text-4xl opacity-30 mb-2"></iconify-icon>
        <p class="text-sm opacity-60">No favorites saved yet.</p>
      </div>
    </div>

    <!-- ================= Panel Preferences (tab 3) ================= -->
    <div class="w-full" data-show="activeSidebarTab === 3 && (!collapsed || hovered || sidebarOpen)">
      <div class="p-6">
        <div class="mb-6 whitespace-nowrap">
          <h1 class="text-lg font-bold">Panel Preferences</h1>
        </div>
        <div class="flex flex-col">

          <!-- Theme Chooser Header: Mode status text + mode cycle button -->
          <div class="flex justify-between items-center pb-3">
            <span class="text-sm font-medium"
              data-bind="(!$theme.isSystem ? 'Set ' + ($theme.mode.charAt(0).toUpperCase() + $theme.mode.slice(1)) + ' Theme:' : 'System Theme Selected')"></span>
            <button type="button" class="btn btn-ghost btn-circle size-10" aria-label="Switch Theme Mode"
              title="Switch Theme Mode"
              data-on-click="$switchTheme()">
              <iconify-icon data-bind-icon="$themeIcon" class="text-xl transition-all duration-300"></iconify-icon>
            </button>
          </div>

          <!-- Theme Chooser Dropdown Trigger & Options List (DaisyUI 5: Native details/summary) -->
          <details class="dropdown w-full relative"
            data-signal="{ isOpen: false }"
            data-effect="if ($theme.isSystem && isOpen) { $el.removeAttribute('open'); isOpen = false; }"
            data-on-toggle="isOpen = $evt.target.open"
            data-on-click_outside="$(this).removeAttribute('open'); isOpen = false">
            <summary
              class="btn btn-block bg-base-100 justify-between font-sans px-4 py-3 h-auto min-h-12 border border-base-content/10 shadow-sm list-none cursor-pointer"
              data-bind-disabled="$theme.isSystem">
              <span class="flex items-center gap-2 grow text-start">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                  class="size-4 shrink-0 invisible">
                  <path d="M20.285 2l-11.285 11.567-5.286-5.011-3.714 3.716 9 8.728 15-15.285z"></path>
                </svg>
                <span class="capitalize text-sm font-semibold" data-bind="$theme.current"></span>
              </span>
              <span class="flex h-full shrink-0 items-center gap-1">
                <span class="bg-primary rounded-badge w-2 h-4"></span>
                <span class="bg-secondary rounded-badge w-2 h-4"></span>
                <span class="bg-accent rounded-badge w-2 h-4"></span>
                <span class="bg-neutral rounded-badge w-2 h-4"></span>
                <iconify-icon icon="material-symbols-light:keyboard-arrow-down" class="text-xl ms-1"></iconify-icon>
              </span>
            </summary>

            <!-- Dropdown Content Menu -->
            <div
              class="dropdown-content bg-base-200 text-base-content rounded-box absolute top-full start-0 mt-2 h-60 max-h-[calc(100vh-10rem)] w-full overflow-y-auto border border-base-content/10 shadow-2xl z-[200] p-2 space-y-2 scroll-smooth"
              data-effect="if (!isOpen) $el.scrollTop = 0">
              <template data-for="t in themes">
                <label class="outline-base-content text-start outline-offset-4 cursor-pointer block"
                  data-bind-data-active-option="$theme.current === t"
                  data-effect="if (isOpen && $theme.current === t) { $el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }">
                  <input type="radio" name="theme-radios" class="radio hidden" data-bind-value="t"
                    data-on-change="$setTheme(t); $evt.target.closest('details')?.removeAttribute('open'); isOpen = false" />
                  <span class="bg-base-100 rounded-btn text-base-content block w-full cursor-pointer font-sans"
                    data-bind-data-theme="t">
                    <span class="grid grid-cols-5 grid-rows-3">
                      <span class="col-span-5 row-span-3 row-start-1 flex items-center gap-2 px-4 py-3">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                          class="size-4 shrink-0"
                          data-class="{ 'visible text-primary': $theme.current === t, 'invisible': $theme.current !== t }">
                          <path d="M20.285 2l-11.285 11.567-5.286-5.011-3.714 3.716 9 8.728 15-15.285z"></path>
                        </svg>
                        <span class="flex-grow text-sm capitalize" data-bind="t"></span>
                        <span class="flex h-full shrink-0 flex-wrap gap-1">
                          <span class="bg-primary rounded-badge w-2 h-4"></span>
                          <span class="bg-secondary rounded-badge w-2 h-4"></span>
                          <span class="bg-accent rounded-badge w-2 h-4"></span>
                          <span class="bg-neutral rounded-badge w-2 h-4"></span>
                        </span>
                      </span>
                    </span>
                  </span>
                </label>
              </template>
            </div>
          </details>

          <div class="divider"></div>

          <!-- Text Flow Direction (LTR / RTL) -->
          <div class="flex flex-nowrap items-center">
            <span class="label-text grow">Text Flow Direction</span>
            <label class="grid cursor-pointer place-items-center">
              <input type="checkbox" class="toggle toggle-primary" data-bind-checked="rtl"
                data-on-change="rtl = $evt.target.checked; localStorage.setItem('rtl', $evt.target.checked)" />
            </label>
          </div>

          <div class="divider"></div>

          <!-- Theme Zoom -->
          <div>
            <div class="label-text pb-3">Theme Zoom</div>
            <input type="range" class="range range-primary" min="0.5" max="2" step="0.1"
              data-bind-value="tempZoom || zoom || 1" data-on-input="tempZoom = Number($evt.target.value)"
              data-on-change="zoom = tempZoom; localStorage.setItem('zoom', zoom)" />
            <div class="flex w-full justify-between px-2 text-xs opacity-40 select-none">
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
              <span>|</span>
            </div>
            <div class="flex justify-between items-center mt-1">
              <span class="text-xs">0.5</span>
              <div class="flex justify-center bg-neutral text-neutral-content rounded w-14 py-1">
                <span class="font-semibold text-sm" data-bind="(tempZoom || zoom || 1) + 'x'"></span>
              </div>
              <span class="text-xs">2.0</span>
            </div>
          </div>

          <div class="divider my-1"></div>

          <!-- Page Tabs toggle -->
          <div class="flex flex-nowrap items-center">
            <span class="label-text grow">Page Tabs</span>
            <label class="grid cursor-pointer place-items-center">
              <input type="checkbox" class="toggle toggle-secondary" data-bind-checked="pageTabs"
                data-on-change="pageTabs = $evt.target.checked; localStorage.setItem('pageTabs', $evt.target.checked)" />
            </label>
          </div>

          <div class="divider my-1"></div>

          <!-- Fixed Header & Tabs toggle -->
          <div class="flex flex-nowrap items-center">
            <span class="label-text grow">Fixed Header & Tabs</span>
            <label class="grid cursor-pointer place-items-center">
              <input type="checkbox" class="toggle toggle-primary" data-bind-checked="fixedHeader"
                data-on-change="fixedHeader = $evt.target.checked; localStorage.setItem('fixedHeader', $evt.target.checked)" />
            </label>
          </div>

          <div class="divider my-1"></div>

          <!-- Fixed Footer toggle -->
          <div class="flex flex-nowrap items-center">
            <span class="label-text grow">Fixed Footer</span>
            <label class="grid cursor-pointer place-items-center">
              <input type="checkbox" class="toggle toggle-primary" data-bind-checked="fixedFooter"
                data-on-change="fixedFooter = $evt.target.checked; localStorage.setItem('fixedFooter', $evt.target.checked)" />
            </label>
          </div>

          <div class="divider my-1"></div>

          <!-- Floating Bookmarks toggle -->
          <div class="flex flex-nowrap items-center">
            <span class="label-text grow">Floating Bookmarks</span>
            <label class="grid cursor-pointer place-items-center">
              <input type="checkbox" class="toggle toggle-primary" data-bind-checked="floatingBookmarks"
                data-on-change="floatingBookmarks = $evt.target.checked; localStorage.setItem('floatingBookmarks', $evt.target.checked)" />
            </label>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- ================= 3. Dock Section (shrink-0) ================= -->
  <footer class="sidebar-dock relative h-16 min-h-16 shrink-0 border-t border-base-content/5">
    <div class="dock !relative w-full h-full shrink-0 overflow-hidden"
      data-class="{ 'flex': (collapsed || isMobile) && !hovered && !sidebarOpen, 'hidden': sidebarOpen || hovered || (!collapsed && !isMobile) }">
      <iconify-icon icon="material-symbols-light:left-panel-open-outline" class="text-2xl"></iconify-icon>
    </div>
    <div class="dock !relative w-full h-full shrink-0 overflow-hidden"
      data-class="{ 'flex': sidebarOpen || hovered || (!collapsed && !isMobile), 'hidden': (collapsed || isMobile) && !hovered && !sidebarOpen }">
      <button class="tooltip tooltip-top" data-tip="Menu" data-class="{ 'dock-active': activeSidebarTab === 1 }"
        data-on-click="activeSidebarTab = 1">
        <iconify-icon icon="material-symbols-light:list" class="text-2xl"></iconify-icon>
      </button>

      <button class="tooltip tooltip-top" data-tip="Favorites" data-class="{ 'dock-active': activeSidebarTab === 2 }"
        data-on-click="activeSidebarTab = 2">
        <iconify-icon icon="material-symbols-light:star-outline" class="text-2xl"></iconify-icon>
      </button>

      <button class="tooltip tooltip-top" data-tip="Preferences"
        data-class="{ 'dock-active': activeSidebarTab === 3 }" data-on-click="activeSidebarTab = 3">
        <iconify-icon icon="material-symbols-light:tune" class="text-2xl"></iconify-icon>
      </button>
    </div>
  </footer>
</aside>
