<!-- Search Modal (triggered by the navbar search button or Ctrl+K) -->
<div class="modal modal-top sm:modal-middle" role="dialog" aria-label="Search" data-class-modal-open="searchOpen"
  data-on-keydown_escape_window="searchOpen = false; if (typeof CSS !== 'undefined' && CSS.highlights) { CSS.highlights.delete('search-match'); }">
  <div class="modal-box bg-base-100 shadow-2xl border border-base-300 p-0 overflow-hidden flex flex-col max-w-2xl">
    <!-- Search Input Row -->
    <div class="flex items-center gap-3 px-4 py-3 border-b border-base-200">
      <iconify-icon icon="material-symbols-light:search" class="text-2xl opacity-60"></iconify-icon>
      <input id="search-modal-input" type="text" role="searchbox" inputmode="search" autocomplete="off" spellcheck="false"
        class="input input-ghost w-full text-lg focus:outline-none border-0 focus:border-0 px-0"
        placeholder="Search pages and features…" data-bind="searchQuery"
        data-on-input="if (!$el.value.trim()) { searchQuery = ''; searchDebouncedQuery = ''; searchResults = []; flatResults = []; searchTokens = []; searchActiveIndex = 0; }"
        data-on-input_debounce.200="
          const q = ($el.value || '').trim();
          searchDebouncedQuery = q;
          searchTokens = (typeof getSearchTokens === 'function' ? getSearchTokens(q) : q.toLowerCase().split(/\s+/).filter(Boolean));
          searchResults = (q && searchIndex && searchIndex.length !== 0 && typeof searchResultGroups === 'function') ? searchResultGroups(q, searchIndex) : [];
          flatResults = (searchResults || []).flatMap(function(grp) { return grp.items || []; });
          searchActiveIndex = 0;
        "
        data-on-keydown_escape="searchOpen = false; if (typeof CSS !== 'undefined' && CSS.highlights) { CSS.highlights.delete('search-match'); }"
        data-on-keydown_prevent_down="
          const total = (searchDebouncedQuery || searchQuery || '').trim() ? (flatResults || []).length : (recentSearches || []).length;
          if (total > 0) { searchActiveIndex = Math.min(searchActiveIndex + 1, total - 1); }
        "
        data-on-keydown_prevent_up="
          if (searchActiveIndex > 0) { searchActiveIndex = searchActiveIndex - 1; }
        "
        data-on-keydown_prevent_enter="
          const q = (searchDebouncedQuery || searchQuery || '').trim();
          if (q) {
            const items = flatResults || [];
            const active = items[searchActiveIndex] || items[0];
            if (active) {
              recentSearches = [q, ...(recentSearches || []).filter(function(s) { return s !== q; })].slice(0, 6);
              let targetTabId = '';
              if (router.pageTabs) {
                const existing = (router.pageTabs || []).find(function(t) { return t.route === active.path; });
                if (existing) {
                  router.switchPageTab(existing.id);
                  targetTabId = existing.id;
                } else {
                  router.createPageTab(active.component || active.path, active.path);
                  targetTabId = router.activePageTabId;
                }
              }
              searchHighlightTargetTabId = targetTabId;
              searchHighlightTargetPath = active.path;
              searchHighlightTokens = [...(searchTokens || [])];
              if (targetTabId) {
                searchTabs = {
                  ...(searchTabs || {}),
                  [targetTabId]: {
                    query: q,
                    tokens: [...(searchTokens || [])],
                    ticks: [],
                    count: 0,
                    path: active.path,
                    scrolled: false
                  }
                };
              }
              router.navigate(active.path);
              searchOpen = false;
              if (typeof CSS !== 'undefined' && CSS.highlights) { CSS.highlights.delete('search-match'); }
            }
          } else {
            const recents = recentSearches || [];
            const activeRecent = recents[searchActiveIndex];
            if (activeRecent) {
              searchQuery = activeRecent;
              searchDebouncedQuery = activeRecent;
              searchTokens = (typeof getSearchTokens === 'function' ? getSearchTokens(activeRecent) : [activeRecent]);
              searchResults = (activeRecent && searchIndex && searchIndex.length !== 0 && typeof searchResultGroups === 'function') ? searchResultGroups(activeRecent, searchIndex) : [];
              flatResults = (searchResults || []).flatMap(function(grp) { return grp.items || []; });
              searchActiveIndex = 0;
            }
          }
        "
        data-effect="if (searchOpen && $el) { $nextTick().then(function() { $el.focus(); $el.select(); }); }" />
      <button type="button" class="btn btn-ghost btn-xs btn-circle opacity-60 hover:opacity-100 me-1"
        aria-label="Clear search" data-show="searchQuery"
        data-on-click="searchQuery = ''; searchDebouncedQuery = ''; searchTokens = []; searchResults = []; flatResults = []; searchActiveIndex = 0; $nextTick().then(function() { const el = document.getElementById('search-modal-input'); if (el) el.focus(); });">
        <iconify-icon icon="material-symbols-light:backspace-outline" class="text-base"></iconify-icon>
      </button>
      <kbd class="kbd kbd-sm opacity-60 max-sm:hidden">Esc</kbd>
      <button type="button" class="btn btn-ghost btn-xs btn-circle" aria-label="Close search"
        data-on-click="searchOpen = false; if (typeof CSS !== 'undefined' && CSS.highlights) { CSS.highlights.delete('search-match'); }">
        <iconify-icon icon="material-symbols-light:close" class="text-lg"></iconify-icon>
      </button>
    </div>

    <!-- Results Area -->
    <div id="search-results-viewport" class="p-3 max-h-[60vh] overflow-y-auto"
      data-effect="if (searchActiveIndex === 0) { $el.scrollTop = 0; } if (typeof syncHighlights === 'function') { syncHighlights($el, searchTokens); }">
      <!-- State 1: Empty Query & No Recent Searches -->
      <div data-show="!searchQuery.trim() && !(recentSearches && recentSearches.length)"
        class="px-4 py-12 text-center text-base-content/50">
        <iconify-icon icon="material-symbols-light:search" class="text-4xl opacity-40"></iconify-icon>
        <p class="mt-2 text-sm">Start typing to search pages &amp; content…</p>
        <kbd class="kbd kbd-sm mt-3 opacity-60">Ctrl + K</kbd>
      </div>

      <!-- State 2: Empty Query & Has Recent Searches -->
      <div data-show="!searchQuery.trim() && (recentSearches && recentSearches.length !== 0)" class="w-full">
        <div
          class="flex items-center justify-between px-3 py-1.5 text-xs font-semibold uppercase tracking-wider text-base-content/50">
          <span>Recent Searches</span>
          <button class="btn btn-ghost btn-xs text-xs lowercase font-normal opacity-60 hover:opacity-100"
            data-on-click="recentSearches = []; searchActiveIndex = 0;">Clear</button>
        </div>
        <ul class="menu menu-sm w-full p-0">
          <template data-for="recent in (recentSearches || [])">
            <li
              class="flex flex-row items-center justify-between group rounded-xl transition-colors"
              data-class="{
                'bg-primary/10 text-primary font-semibold ring-1 ring-primary/20': !searchQuery.trim() && (recentSearches || [])[searchActiveIndex] === recent,
                'hover:bg-base-200/60': searchQuery.trim() || (recentSearches || [])[searchActiveIndex] !== recent
              }"
              data-effect="if (!searchQuery.trim() && (recentSearches || [])[searchActiveIndex] === recent) $el.scrollIntoView({ block: 'nearest' });">
              <a class="flex items-center gap-2.5 flex-1 min-w-0 py-2 px-3"
                data-bind-aria-selected="(!searchQuery.trim() && (recentSearches || [])[searchActiveIndex] === recent) ? 'true' : 'false'"
                data-on-click="
                  searchQuery = recent;
                  searchDebouncedQuery = recent;
                  searchTokens = (typeof getSearchTokens === 'function' ? getSearchTokens(recent) : [recent]);
                  searchResults = (recent && searchIndex && searchIndex.length !== 0 && typeof searchResultGroups === 'function') ? searchResultGroups(recent, searchIndex) : [];
                  flatResults = (searchResults || []).flatMap(function(grp) { return grp.items || []; });
                  searchActiveIndex = 0;
                ">
                <iconify-icon icon="material-symbols-light:history"
                  class="text-lg opacity-60 shrink-0"
                  data-class="{ 'text-primary opacity-100': !searchQuery.trim() && (recentSearches || [])[searchActiveIndex] === recent }"></iconify-icon>
                <span class="truncate font-medium" data-bind="recent"></span>
              </a>
              <button
                class="btn btn-ghost btn-xs btn-circle opacity-0 group-hover:opacity-60 hover:!opacity-100 me-2"
                aria-label="Remove search" title="Remove"
                data-on-click_stop="recentSearches = (recentSearches || []).filter(function(s) { return s !== recent; })">
                <iconify-icon icon="material-symbols-light:close" class="text-sm"></iconify-icon>
              </button>
            </li>
          </template>
        </ul>
      </div>

      <!-- State 3: Active Query & Has Results (Grouped by Pages & Navigation vs Page Content Matches) -->
      <div data-show="searchDebouncedQuery && searchResults && searchResults.length !== 0" class="space-y-4">
        <template data-for="group in (searchResults || [])">
          <div class="w-full">
            <div
              class="flex items-center justify-between px-3 py-1.5 text-xs font-semibold uppercase tracking-wider text-base-content/50">
              <div class="flex items-center gap-1.5">
                <iconify-icon data-bind-icon="group.icon" class="text-base opacity-70"></iconify-icon>
                <span data-bind="group.title"></span>
              </div>
              <span class="badge badge-xs badge-ghost opacity-60" data-bind="(group.items || []).length"></span>
            </div>
            <ul class="menu menu-sm w-full p-0">
              <template data-for="item in (group.items || [])">
                <li data-effect="if ((flatResults || [])[searchActiveIndex]?.path === item.path) $el.scrollIntoView({ block: 'nearest' });">
                  <a class="flex flex-col items-start gap-1 py-2 px-3 rounded-xl transition-colors cursor-pointer"
                    data-class="{
                      'bg-primary/10 text-primary font-semibold ring-1 ring-primary/20 shadow-sm': (flatResults || [])[searchActiveIndex]?.path === item.path,
                      'hover:bg-base-200/60': (flatResults || [])[searchActiveIndex]?.path !== item.path
                    }"
                    data-bind-aria-selected="(flatResults || [])[searchActiveIndex]?.path === item.path ? 'true' : 'false'"
                    data-on-mouseenter="const idx = (flatResults || []).findIndex(function(it) { return it.path === item.path; }); if (idx !== -1) searchActiveIndex = idx;"
                    data-on-click="
                      const q = (searchDebouncedQuery || searchQuery || '').trim();
                      if (q) {
                        recentSearches = [q, ...(recentSearches || []).filter(function(s) { return s !== q; })].slice(0, 6);
                      }
                      let targetTabId = '';
                      if (router.pageTabs) {
                        const existing = (router.pageTabs || []).find(function(t) { return t.route === item.path; });
                        if (existing) {
                          router.switchPageTab(existing.id);
                          targetTabId = existing.id;
                        } else {
                          router.createPageTab(item.component || item.path, item.path);
                          targetTabId = router.activePageTabId;
                        }
                      }
                      searchHighlightTargetTabId = targetTabId;
                      searchHighlightTargetPath = item.path;
                      searchHighlightTokens = [...(searchTokens || [])];
                      if (targetTabId) {
                        searchTabs = {
                          ...(searchTabs || {}),
                          [targetTabId]: {
                            query: q,
                            tokens: [...(searchTokens || [])],
                            ticks: [],
                            count: 0,
                            path: item.path,
                            scrolled: false
                          }
                        };
                      }
                      router.navigate(item.path);
                      searchOpen = false;
                      if (typeof CSS !== 'undefined' && CSS.highlights) { CSS.highlights.delete('search-match'); }
                    ">
                    <div class="flex items-center justify-between w-full">
                      <div class="flex items-center gap-2.5 min-w-0">
                        <iconify-icon
                          data-bind-icon="item.meta?.icon || 'material-symbols-light:description-outline'"
                          class="text-xl shrink-0 opacity-70"
                          data-class="{ 'text-primary opacity-100': (flatResults || [])[searchActiveIndex]?.path === item.path }"></iconify-icon>
                        <span class="font-medium text-sm truncate" data-bind="item.meta?.title || item.name"></span>
                        <span class="badge badge-xs badge-ghost opacity-60" data-bind="item.category"></span>
                      </div>
                      <span class="badge badge-sm badge-ghost font-mono opacity-50 shrink-0"
                        data-bind="item.path"></span>
                    </div>
                    <div data-show="item.snippet"
                      class="text-xs text-base-content/60 ps-7 font-sans line-clamp-1 w-full text-start">
                      <span class="opacity-80 font-mono" data-bind="item.snippet"></span>
                    </div>
                  </a>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </div>

      <!-- State 4: Active Query & Zero Matches -->
      <div data-show="searchDebouncedQuery && (!searchResults || searchResults.length === 0)"
        class="px-4 py-12 text-center text-base-content/50">
        <iconify-icon icon="material-symbols-light:search-off" class="text-4xl opacity-40"></iconify-icon>
        <p class="mt-2 text-sm">No results found for &quot;<span class="font-semibold text-base-content"
            data-bind="searchDebouncedQuery"></span>&quot;</p>
      </div>
    </div>
  </div>
  <div class="modal-backdrop bg-black/60 backdrop-blur-sm" data-on-click="searchOpen = false; if (typeof CSS !== 'undefined' && CSS.highlights) { CSS.highlights.delete('search-match'); }"></div>
</div>
