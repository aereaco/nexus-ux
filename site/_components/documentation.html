<div class="dashboard-fragment w-full p-6 max-w-6xl mx-auto space-y-8"
    data-signal="{ 
        toastMsg: '', 
        toastType: 'info', 
        showToast: false,
        copied: false,
        specTab: 'usage',
        labTab: 'preview',
        activeFork: 'Default',
        activeSnippet: 'Default',
        forkSource: '',
        forkCode: '',
        snippetCode: '',
        baseSnippets: [],
        initComplete: false,
        askCopilot() {
            if (window.Nexus?.coordinator?.runtimeContext?.globalSignals) {
                const g = window.Nexus.coordinator.runtimeContext.globalSignals();
                if (typeof g.openSession === 'function') g.openSession('session-copilot');
                g.newChatMessage = '@Nexus Copilot Can you explain how ' + (doc?.Title || 'this directive') + ' works and show an advanced example?';
            }
        }
     }" data-effect="
        if (!initComplete && doc) {
            initComplete = true;

            // Populate base snippets
            if (baseSnippets.length === 0) {
                const bases = [];
                if (doc.Examples) {
                    Object.keys(doc.Examples).forEach(k => bases.push(k));
                } else if (doc.Snippet) {
                    bases.push(doc.DefaultSnippetName || 'Default');
                }
                baseSnippets = bases;
                if (bases.length > 0 && activeSnippet === 'Default') activeSnippet = bases[0];
            }

            // Sync snippet code to preview immediately
            if (!snippetCode && doc.Examples && doc.Examples[activeSnippet]) {
                snippetCode = doc.Examples[activeSnippet];
            } else if (!snippetCode && doc.Snippet && activeSnippet === (doc.DefaultSnippetName || 'Default')) {
                snippetCode = doc.Snippet;
            }

            if (activeFork === 'Default' && forkSource && !forkCode) forkCode = forkSource;

            // Fetch framework module source directly from GitHub
            if (!forkSource && doc.SourceModule) {
                fetch('https://raw.githubusercontent.com/aereaco/nexus-ux/main/src' + doc.SourceModule)
                    .then(r => r.ok ? r.text() : Promise.reject(r.statusText))
                    .then(d => {
                        forkSource = d;
                        if (activeFork === 'Default') forkCode = d;
                        $el._mountEditors?.();
                    })
                    .catch(err => console.error('Failed to load source from GitHub:', err));
            }

            // Mount editors (CodeMirror 6)
            const mountEditors = () => {
                if (!window.CM) return;

                const { EditorView, EditorState, Compartment, basicSetup, javascript, html, oneDark } = window.CM;

                // Cleanup stale editor instances if detached
                if (window._sourceEditor && !document.contains(window._sourceEditor.dom)) {
                    window._sourceEditor.destroy();
                    window._sourceEditor = null;
                }
                if (window._snippetEditor && !document.contains(window._snippetEditor.dom)) {
                    window._snippetEditor.destroy();
                    window._snippetEditor = null;
                }

                // 1. Module Source Editor
                const sourceEl = document.getElementById('source-editor');
                if (sourceEl && !window._sourceEditor && forkSource) {
                    const readOnly = new Compartment();
                    window._sourceEditor = new EditorView({
                        state: EditorState.create({
                            doc: forkSource,
                            extensions: [
                                basicSetup,
                                javascript(),
                                oneDark,
                                EditorView.lineWrapping,
                                readOnly.of(EditorState.readOnly.of(true)),
                                EditorView.updateListener.of(update => {
                                    if (update.docChanged) {
                                        const val = update.state.doc.toString();
                                        if (forkCode !== val) forkCode = val;
                                    }
                                })
                            ]
                        }),
                        parent: sourceEl
                    });

                    $watch(() => forkCode, (code) => {
                        if (code !== undefined && window._sourceEditor && window._sourceEditor.state.doc.toString() !== code) {
                            window._sourceEditor.dispatch({
                                 changes: { from: 0, to: window._sourceEditor.state.doc.length, insert: code || '' }
                            });
                        }
                    });
                }

                // 2. Lab Snippet Editor
                const snippetEl = document.getElementById('snippet-editor');
                if (snippetEl && (doc?.Snippet || doc?.Examples) && !window._snippetEditor) {
                    window._snippetEditor = new EditorView({
                        state: EditorState.create({
                            doc: snippetCode || '',
                            extensions: [
                                basicSetup,
                                html(),
                                oneDark,
                                EditorView.lineWrapping,
                                EditorView.updateListener.of(update => {
                                    if (update.docChanged) {
                                        const val = update.state.doc.toString();
                                        if (snippetCode !== val) snippetCode = val;
                                    }
                                })
                            ]
                        }),
                        parent: snippetEl
                    });

                    $watch(() => snippetCode, (code) => {
                        if (code !== undefined && window._snippetEditor && window._snippetEditor.state.doc.toString() !== code) {
                            window._snippetEditor.dispatch({
                                 changes: { from: 0, to: window._snippetEditor.state.doc.length, insert: code || '' }
                            });
                        }
                    });

                    $watch(() => activeSnippet, (snippet) => {
                        if (doc.Examples && doc.Examples[snippet]) {
                            snippetCode = doc.Examples[snippet];
                        } else if (snippet === (doc.DefaultSnippetName || 'Default')) {
                            snippetCode = doc.Snippet;
                        }
                    });
                }
            };

            $el._mountEditors = mountEditors;

            if (window.CM) mountEditors();

            if (!window.CM && !$el._cmListenerRegistered) {
                $el._cmListenerRegistered = true;
                window.addEventListener('nexus:cm-ready', () => $el._mountEditors?.(), { once: true });
            }

            $watch(() => specTab, () => setTimeout(() => $el._mountEditors?.(), 50));
            $watch(() => labTab, () => setTimeout(() => $el._mountEditors?.(), 50));
        }
    ">
    <script type="module">
        // CDN-based single-instance CodeMirror 6 bundle via esm.sh
        if (!window.CM && !window._cmLoading) {
            window._cmLoading = true;
            const STATE_VER = '@codemirror/state@6.4.1';
            const DEPS = '?deps=' + STATE_VER;
            Promise.all([
                import('https://esm.sh/' + STATE_VER),
                import('https://esm.sh/codemirror@6.0.1' + DEPS),
                import('https://esm.sh/@codemirror/lang-javascript@6.2.2' + DEPS),
                import('https://esm.sh/@codemirror/lang-html@6.4.9' + DEPS),
                import('https://esm.sh/@codemirror/theme-one-dark@6.1.2' + DEPS)
            ]).then(([state, cm, js, html, theme]) => {
                window.CM = {
                    EditorState: state.EditorState,
                    Compartment: state.Compartment,
                    EditorView: cm.EditorView,
                    basicSetup: cm.basicSetup,
                    javascript: js.javascript,
                    html: html.html,
                    oneDark: theme.oneDark
                };
                window.dispatchEvent(new CustomEvent('nexus:cm-ready'));
            }).catch(err => {
                window._cmLoading = false;
                console.error('Failed to load CodeMirror from CDN:', err);
            });
        }
    </script>

    <style>
        /* Editor Styles - CM6 auto-height until max, then scroll */
        .nx-editor-container { position: relative; min-height: 380px; width: 100%; }
        .nx-editor { position: absolute; top: 0; left: 0; right: 0; bottom: 0; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; }
        .nx-editor .cm-editor { height: 100%; max-height: 520px; }
        .nx-editor .cm-scroller { overflow: auto; }
    </style>

    <!-- ═══════════ 1. HEADER TOOLBAR ═══════════ -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 pb-4 border-b border-base-content/10" data-if="doc">
        <div>
            <div class="flex items-center gap-2 mb-1.5">
                <span class="badge badge-primary badge-sm font-semibold uppercase tracking-wider" data-bind="doc.Category || 'Attributes'"></span>
                <span class="badge badge-ghost badge-sm font-mono opacity-70" data-bind="doc.SourceModule || ''"></span>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-base-content flex items-center gap-3">
                <iconify-icon data-bind-icon="doc.Icon || 'material-symbols-light:code-blocks-outline'" class="text-primary text-3xl"></iconify-icon>
                <span data-bind="doc.Title"></span>
            </h1>
            <p class="text-base text-base-content/70 mt-1 max-w-3xl leading-relaxed" data-markdown="doc.Description"></p>
        </div>

        <!-- Quick Action Pills -->
        <div class="flex items-center gap-2 shrink-0">
            <button class="btn btn-sm btn-outline btn-primary gap-2" data-on-click="askCopilot()">
                <iconify-icon icon="material-symbols-light:robot-2-outline" class="text-lg"></iconify-icon>
                <span>Ask AI</span>
            </button>
            <button class="btn btn-sm btn-ghost border border-base-content/10 gap-2"
                data-on-click="
                    navigator.clipboard.writeText(doc.Syntax || '');
                    copied = true;
                    setTimeout(() => copied = false, 2000);
                ">
                <iconify-icon data-bind-icon="copied ? 'material-symbols-light:check' : 'material-symbols-light:content-copy'" class="text-lg"></iconify-icon>
                <span data-bind="copied ? 'Copied!' : 'Copy Syntax'"></span>
            </button>
        </div>
    </div>

    <!-- ═══════════ 2. TAB GROUP 1: MODULE SPECIFICATION ═══════════ -->
    <div class="card bg-base-100 border border-base-content/10 shadow-sm overflow-hidden" data-if="doc">
        <div class="card-header bg-base-200/40 px-6 py-3 border-b border-base-content/10 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <iconify-icon icon="material-symbols-light:menu-book-outline" class="text-primary text-xl"></iconify-icon>
                <h2 class="font-bold text-sm uppercase tracking-wider text-base-content/80">Module Specification</h2>
            </div>

            <!-- Tabs: [ Syntax & API Usage ] [ Extensibility Notes ] [ Module Source ] -->
            <div class="tabs tabs-boxed bg-base-200/60 p-1">
                <button class="tab tab-sm font-medium transition-colors"
                    data-class="{ 'tab-active bg-primary text-primary-content': specTab === 'usage' }"
                    data-on-click="specTab = 'usage'">
                    <iconify-icon icon="material-symbols-light:code" class="text-base me-1"></iconify-icon>
                    Syntax &amp; API Usage
                </button>
                <button class="tab tab-sm font-medium transition-colors"
                    data-class="{ 'tab-active bg-primary text-primary-content': specTab === 'extensibility' }"
                    data-on-click="specTab = 'extensibility'">
                    <iconify-icon icon="material-symbols-light:description-outline" class="text-base me-1"></iconify-icon>
                    Extensibility Notes
                </button>
                <button class="tab tab-sm font-medium transition-colors"
                    data-class="{ 'tab-active bg-primary text-primary-content': specTab === 'source' }"
                    data-on-click="specTab = 'source'">
                    <iconify-icon icon="material-symbols-light:terminal" class="text-base me-1"></iconify-icon>
                    Module Source
                </button>
            </div>
        </div>

        <div class="p-6">
            <!-- Sub-Tab 1: Syntax & API Usage -->
            <div data-show="specTab === 'usage'" class="space-y-6">
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-wider text-base-content/60 mb-2">NEG Expression Grammar</h3>
                    <pre class="mockup-code bg-neutral text-neutral-content p-4 font-mono text-sm w-full overflow-x-auto"><code data-bind="doc.Syntax || ''"></code></pre>
                </div>

                <!-- Parameters Table with Zebra Styling -->
                <div data-show="doc.Params && doc.Params.length > 0">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-base-content/60 mb-2">Parameters &amp; Modifiers</h3>
                    <div class="overflow-x-auto border border-base-content/10 rounded-xl">
                        <table class="table table-zebra table-sm w-full">
                            <thead>
                                <tr class="bg-base-200/50 text-xs">
                                    <th>Parameter / Modifier</th>
                                    <th>Type</th>
                                    <th>Default</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template data-for="param in (doc.Params || [])" data-key="param.name">
                                    <tr>
                                        <td class="font-mono text-primary font-bold text-xs" data-bind="param.name"></td>
                                        <td class="font-mono text-xs opacity-70" data-bind="param.type"></td>
                                        <td class="font-mono text-xs opacity-60" data-bind="param.default || '-'"></td>
                                        <td class="text-xs" data-bind="param.description"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Sub-Tab 2: Extensibility Notes -->
            <div data-show="specTab === 'extensibility'" style="display:none;" class="space-y-4">
                <div class="prose max-w-none text-base-content/80 text-sm leading-relaxed" data-html="doc.Extensibility || ''"></div>
            </div>

            <!-- Sub-Tab 3: Module Source -->
            <div data-show="specTab === 'source'" style="display:none;" class="space-y-4">
                <div class="nx-editor-container border border-base-content/10 rounded-xl overflow-hidden" style="width: 100%;">
                    <div id="source-editor" class="nx-editor"></div>
                </div>
            </div>
        </div>

        <!-- Command bar for Module Source (visible when source tab active) -->
        <div data-show="specTab === 'source'" class="flex items-center justify-between px-6 py-3 bg-base-200/40 border-t border-base-content/10 text-xs">
            <div class="flex items-center gap-2">
                <iconify-icon icon="material-symbols-light:folder-outline" class="text-base opacity-60"></iconify-icon>
                <span class="font-mono opacity-60" data-bind="doc.SourceModule || ''"></span>
            </div>
            <div class="join">
                <button class="btn btn-xs btn-ghost border border-base-content/10 gap-1"
                    data-on-click="
                        const blob = new Blob([forkCode || forkSource], { type: 'text/plain' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        const mod = (doc.SourceModule || 'module.ts').split('/').pop();
                        a.download = mod;
                        a.click();
                    ">
                    <iconify-icon icon="material-symbols-light:download" class="text-sm"></iconify-icon> Download .ts
                </button>
                <button class="btn btn-xs btn-ghost border border-base-content/10 gap-1"
                    data-on-click="
                        navigator.clipboard.writeText(forkCode || forkSource);
                        toastMsg = 'Module source copied to clipboard'; toastType = 'info'; showToast = true;
                    ">
                    <iconify-icon icon="material-symbols-light:content-copy" class="text-sm"></iconify-icon> Copy
                </button>
            </div>
        </div>

        <!-- Framework Contract Footer -->
        <div class="px-6 py-3 bg-base-200/20 border-t border-base-content/10 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs text-base-content/60">
            <span>Module Path: <code class="font-mono text-primary font-semibold" data-bind="doc.SourceModule || ''"></code></span>
            <span>Framework Contract: Engine owns API primitives; Modules schedule directives.</span>
        </div>
    </div>

    <!-- ═══════════ 3. TAB GROUP 2: INTERACTIVE SANDBOX ═══════════ -->
    <div class="card bg-base-100 border border-base-content/10 shadow-sm overflow-hidden" data-if="doc.Snippet || doc.Examples">
        <div class="card-header bg-base-200/40 px-6 py-3 border-b border-base-content/10 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-success animate-pulse"></span>
                <h2 class="font-bold text-sm uppercase tracking-wider text-base-content/80">Interactive Sandbox</h2>
                <span class="badge badge-success badge-xs gap-1 py-0.5 px-2 font-mono text-[10px] font-semibold">LIVE REACTIVE DOM</span>
            </div>

            <!-- Tabs: [ Interactive Lab ] [ Lab Source ] [ Split View ] -->
            <div class="tabs tabs-boxed bg-base-200/60 p-1">
                <button class="tab tab-sm font-medium transition-colors"
                    data-class="{ 'tab-active bg-secondary text-secondary-content': labTab === 'preview' }"
                    data-on-click="labTab = 'preview'">
                    <iconify-icon icon="material-symbols-light:play-circle-outline" class="text-base me-1"></iconify-icon>
                    Interactive Lab
                </button>
                <button class="tab tab-sm font-medium transition-colors"
                    data-class="{ 'tab-active bg-secondary text-secondary-content': labTab === 'source' }"
                    data-on-click="labTab = 'source'">
                    <iconify-icon icon="material-symbols-light:code" class="text-base me-1"></iconify-icon>
                    Lab Source
                </button>
                <button class="tab tab-sm font-medium transition-colors"
                    data-class="{ 'tab-active bg-secondary text-secondary-content': labTab === 'split' }"
                    data-on-click="labTab = 'split'">
                    <iconify-icon icon="material-symbols-light:view-column-outline" class="text-base me-1"></iconify-icon>
                    Split View
                </button>
            </div>
        </div>

        <div class="p-6">
            <div class="grid grid-cols-1 gap-6" data-class-md:grid-cols-2="labTab === 'split'">
                <!-- Interactive Lab Live Execution Panel -->
                <div data-show="labTab === 'preview' || labTab === 'split'" class="w-full h-full">
                    <div class="bg-base-200/50 rounded-xl p-6 min-h-[220px] h-full border border-base-content/10"
                         data-html="snippetCode">
                    </div>
                </div>

                <!-- Lab Source CodeMirror Editor Panel -->
                <div data-show="labTab === 'source' || labTab === 'split'" style="display:none;" class="w-full h-full">
                    <div class="nx-editor-container border border-base-content/10 rounded-xl overflow-hidden h-full min-h-[380px]" style="width: 100%;">
                        <div id="snippet-editor" class="nx-editor"></div>
                    </div>
                </div>
            </div>

            <!-- Collapsible Declarative HTML Markup Preview -->
            <div class="collapse collapse-arrow bg-base-200/30 border border-base-content/10 rounded-xl mt-6">
                <input type="checkbox" />
                <div class="collapse-title text-xs font-bold flex items-center gap-2">
                    <iconify-icon icon="material-symbols-light:code-blocks-outline" class="text-primary text-base"></iconify-icon>
                    Declarative HTML Markup (Read-Only Source)
                </div>
                <div class="collapse-content">
                    <pre class="bg-base-300 p-4 rounded-xl overflow-x-auto text-xs font-mono border border-base-content/10 text-base-content"><code data-bind="snippetCode"></code></pre>
                </div>
            </div>
        </div>

        <!-- Command bar for Interactive Sandbox -->
        <div class="flex flex-wrap items-center justify-between px-6 py-3 bg-base-200/40 border-t border-base-content/10 gap-3 text-xs">
            <div class="flex items-center gap-2">
                <div class="dropdown dropdown-top sm:dropdown-bottom" data-show="baseSnippets.length > 1">
                    <div tabindex="0" role="button" class="btn btn-ghost btn-xs border border-base-content/10 font-bold">
                        <span data-bind="activeSnippet" class="truncate max-w-[140px]"></span>
                        <iconify-icon icon="material-symbols-light:arrow-drop-down" class="text-base"></iconify-icon>
                    </div>
                    <ul tabindex="0" class="dropdown-content z-[100] menu menu-xs p-2 shadow-xl bg-base-100 rounded-box w-52 border border-base-content/10">
                        <template data-for="bs in baseSnippets">
                            <li><a data-on-click="activeSnippet = bs; if (document.activeElement instanceof HTMLElement) document.activeElement.blur()"
                                   data-class-active="activeSnippet === bs" class="font-bold" data-bind="bs"></a></li>
                        </template>
                    </ul>
                </div>
                <button class="btn btn-xs btn-ghost border border-base-content/10 gap-1"
                    data-on-click="
                        if (doc.Examples && doc.Examples[activeSnippet]) snippetCode = doc.Examples[activeSnippet];
                        else if (doc.Snippet) snippetCode = doc.Snippet;
                        toastMsg = 'Snippet reset to default'; toastType = 'info'; showToast = true;
                    ">
                    <iconify-icon icon="material-symbols-light:restart-alt" class="text-sm"></iconify-icon> Reset
                </button>
            </div>

            <div class="join">
                <button class="btn btn-xs btn-ghost border border-base-content/10 gap-1"
                    data-on-click="
                        const blob = new Blob([snippetCode], { type: 'text/html' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = (doc.Title || 'snippet').toLowerCase().replace(/[^a-z0-9]/g, '-') + '.html';
                        a.click();
                    ">
                    <iconify-icon icon="material-symbols-light:download" class="text-sm"></iconify-icon> Download .html
                </button>
                <button class="btn btn-xs btn-ghost border border-base-content/10 gap-1"
                    data-on-click="
                        navigator.clipboard.writeText(snippetCode);
                        toastMsg = 'Lab snippet copied to clipboard'; toastType = 'info'; showToast = true;
                    ">
                    <iconify-icon icon="material-symbols-light:content-copy" class="text-sm"></iconify-icon> Copy
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Feedback -->
    <div data-show="showToast" class="fixed bottom-6 end-6 z-[9999] shadow-2xl" style="display:none;"
        data-effect="if (showToast) setTimeout(() => showToast = false, 3000)">
        <div class="alert shadow-lg" data-class-alert-success="toastType === 'success'"
            data-class-alert-info="toastType === 'info'" data-class-alert-warning="toastType === 'warning'">
            <span data-bind="toastMsg" class="font-bold text-xs"></span>
        </div>
    </div>
</div>
