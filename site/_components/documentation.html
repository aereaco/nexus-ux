        toastType: 'info', 
        showToast: false,

        labTab: 'split',
        activeFork: 'Default',
        activeSnippet: 'Default',
        forkSource: '',
        forkCode: '',
        snippetCode: '',
        baseSnippets: [],
        snippets: [],
        snippetsLoaded: false,
        showSnippetModal: false,
        snippetName: '',
        snippetError: '',
        showRenameSnippetModal: false,
        showDeleteSnippetModal: false,
        manageTarget: '',

        manageError: '',

            if (window.Nexus?.coordinator?.runtimeContext?.globalSignals) {
                const g = window.Nexus.coordinator.runtimeContext.globalSignals();
                if (typeof g.openSession === 'function') g.openSession('session-copilot');
                g.newChatMessage = '@Nexus Copilot Can you explain how ' + (doc?.Title || 'this directive') + ' works and show an advanced example?';
            }
        }
     }" data-effect="
        if (!initComplete && doc) {
            initComplete = true;

            // Populate base snippets
            if (baseSnippets.length === 0) {
                const bases = [];
                if (doc.Examples) {
                    Object.keys(doc.Examples).forEach(k => bases.push(k));
                } else if (doc.Snippet) {
                    bases.push(doc.DefaultSnippetName || 'Default');
                }
                baseSnippets = bases;
                if (bases.length > 0 && activeSnippet === 'Default') activeSnippet = bases[0];
            }

            // Sync snippet code to preview immediately
            if (!snippetCode && doc.Examples && doc.Examples[activeSnippet]) {
                snippetCode = doc.Examples[activeSnippet];
            } else if (!snippetCode && doc.Snippet && activeSnippet === (doc.DefaultSnippetName || 'Default')) {
                snippetCode = doc.Snippet;
            }

            if (activeFork === 'Default' && forkSource && !forkCode) forkCode = forkSource;

            // Initialize saved snippets list from IndexedDB
            if (window._indexedDB?.snippets && !snippetsLoaded && doc.SnippetModule) {
                snippetsLoaded = true;
                window._indexedDB.snippets.list(doc.SnippetModule + '_').then(keys => {
                    snippets = keys.map(k => k.substring(doc.SnippetModule.length + 1));
                });
            }

            // Fetch framework module source directly from GitHub
            if (!forkSource && doc.SourceModule) {
                fetch('https://raw.githubusercontent.com/aereaco/nexus-ux/main/src' + doc.SourceModule)
                    .then(r => r.ok ? r.text() : Promise.reject(r.statusText))
                    .then(d => {
                        forkSource = d;
                        if (activeFork === 'Default') forkCode = d;
                        $el._mountEditors?.();
                    })
                    .catch(err => console.error('Failed to load source from GitHub:', err));
            }

            // Mount editors (CodeMirror 6)
            const mountEditors = () => {
                if (!window.CM) return;

                const { EditorView, EditorState, Compartment, basicSetup, javascript, html, oneDark } = window.CM;

                // Cleanup stale editor instances if detached
                if (window._sourceEditor && !document.contains(window._sourceEditor.dom)) {
                    window._sourceEditor.destroy();
                    window._sourceEditor = null;
                }
                if (window._snippetEditor && !document.contains(window._snippetEditor.dom)) {
                    window._snippetEditor.destroy();
                    window._snippetEditor = null;
                }

                // 1. Module Source Editor
                const sourceEl = document.getElementById('source-editor');
                if (sourceEl && !window._sourceEditor && forkSource) {
                    const readOnly = new Compartment();
                    window._sourceEditor = new EditorView({
                        state: EditorState.create({
                            doc: forkSource,
                            extensions: [
                                basicSetup,
                                javascript(),
                                oneDark,
                                EditorView.lineWrapping,
                                readOnly.of(EditorState.readOnly.of(true)),
                                EditorView.updateListener.of(update => {
                                    if (update.docChanged) {
                                        const val = update.state.doc.toString();
                                        if (forkCode !== val) forkCode = val;
                                    }
                                })
                            ]
                        }),
                        parent: sourceEl
                    });
                }

                // 2. Lab Snippet Editor (Live Editable)
                const snippetEl = document.getElementById('snippet-editor');
                if (snippetEl && (doc?.Snippet || doc?.Examples) && !window._snippetEditor) {
                    window._snippetEditor = new EditorView({
                        state: EditorState.create({
                            doc: snippetCode || '',
                            extensions: [
                                basicSetup,
                                html(),
                                oneDark,
                                EditorView.lineWrapping,
                                EditorView.updateListener.of(update => {
                                    if (update.docChanged) {
                                        const val = update.state.doc.toString();
                                        if (snippetCode !== val) snippetCode = val;
                                    }
                                })
                            ]
                        }),
                        parent: snippetEl
                    });
                }
            };

            $el._mountEditors = mountEditors;

            if (window.CM) mountEditors();

            if (!window.CM && !$el._cmListenerRegistered) {
                $el._cmListenerRegistered = true;
                window.addEventListener('nexus:cm-ready', () => $el._mountEditors?.(), { once: true });
            }
        }

        // Reactive synchronization via native data-effect:
        if (initComplete) {
            // Mount when switching to source or split
            if (specTab === 'source' || labTab === 'source' || labTab === 'split') {
                setTimeout(() => $el._mountEditors?.(), 40);
            }

            // Sync snippet code to editor when changed externally
            if (window._snippetEditor && snippetCode !== undefined) {
                const cur = window._snippetEditor.state.doc.toString();
                if (cur !== snippetCode) {
                    window._snippetEditor.dispatch({ changes: { from: 0, to: cur.length, insert: snippetCode || '' } });
                }
            }

            // Sync source code to editor when changed externally
            if (window._sourceEditor && forkCode !== undefined) {
                const cur = window._sourceEditor.state.doc.toString();
                if (cur !== forkCode) {
                    window._sourceEditor.dispatch({ changes: { from: 0, to: cur.length, insert: forkCode || '' } });
                }
            }
        }
    ">
    <script type="module">
        // IndexedDB Store Proxy Helper for Lab Snippet Persistence
        if (!window._indexedDB) {
            const DB_NAME = 'nexus-store';
            const openDB = (store) => new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME);
                req.onsuccess = () => {
                    const db = req.result;
                    if (db.objectStoreNames.contains(store)) return resolve(db);
                    const v = db.version + 1;
                    db.close();
                    const upReq = indexedDB.open(DB_NAME, v);
                    upReq.onupgradeneeded = (e) => {
                        const udb = e.target.result;
                        if (!udb.objectStoreNames.contains(store)) udb.createObjectStore(store);
                    };
                    upReq.onsuccess = () => resolve(upReq.result);
                    upReq.onerror = () => reject(upReq.error);
                };
                req.onerror = () => reject(req.error);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(store)) db.createObjectStore(store);
                };
            });

            const createStore = (storeName) => ({
                list(prefix) {
                    return openDB(storeName).then(db => new Promise(res => {
                        const tx = db.transaction(storeName, 'readonly');
                        const req = tx.objectStore(storeName).getAllKeys();
                        req.onsuccess = () => {
                            db.close();
                            const keys = (req.result || []).map(String);
                            res(prefix ? keys.filter(k => k.startsWith(prefix)) : keys);
                        };
                        req.onerror = () => { db.close(); res([]); };
                    })).catch(() => []);
                },
                get(key) {
                    return openDB(storeName).then(db => new Promise(res => {
                        const tx = db.transaction(storeName, 'readonly');
                        const req = tx.objectStore(storeName).get(key);
                        req.onsuccess = () => { db.close(); res(req.result); };
                        req.onerror = () => { db.close(); res(null); };
                    })).catch(() => null);
                },
                delete(key) {
                    return openDB(storeName).then(db => new Promise(res => {
                        const tx = db.transaction(storeName, 'readwrite');
                        tx.objectStore(storeName).delete(key);
                        tx.oncomplete = () => { db.close(); res(); };
                        tx.onerror = () => { db.close(); res(); };
                    })).catch(() => { });
                }
            });

            window._indexedDB = new Proxy({}, {
                get(t, storeName) {
                    if (typeof storeName !== 'string') return undefined;
                    if (!t[storeName]) {
                        const s = createStore(storeName);
                        t[storeName] = new Proxy(s, {
                            set(_, key, val) {
                                openDB(storeName).then(db => {
                                    const tx = db.transaction(storeName, 'readwrite');
                                    tx.objectStore(storeName).put(val, key);
                                    tx.oncomplete = () => db.close();
                                });
                                return true;
                            }
                        });
                    }
                    return t[storeName];
                }
            });
        }

        // CDN-based single-instance CodeMirror 6 bundle via esm.sh
        if (!window.CM && !window._cmLoading) {
            window._cmLoading = true;
            const STATE_VER = '@codemirror/state@6.4.1';
            const DEPS = '?deps=' + STATE_VER;
            Promise.all([
                import('https://esm.sh/' + STATE_VER),
                import('https://esm.sh/codemirror@6.0.1' + DEPS),
                import('https://esm.sh/@codemirror/lang-javascript@6.2.2' + DEPS),
                import('https://esm.sh/@codemirror/lang-html@6.4.9' + DEPS),
                import('https://esm.sh/@codemirror/theme-one-dark@6.1.2' + DEPS)
            ]).then(([state, cm, js, html, theme]) => {
                window.CM = {
                    EditorState: state.EditorState,
                    Compartment: state.Compartment,
                    EditorView: cm.EditorView,
                    basicSetup: cm.basicSetup,
                    javascript: js.javascript,
                    html: html.html,
                    oneDark: theme.oneDark
                };
                window.dispatchEvent(new CustomEvent('nexus:cm-ready'));
            }).catch(err => console.error('Failed to load CodeMirror 6 CDN:', err));
        }
    </script>

                            title="Copy snippet code" data-on-click="
                                navigator.clipboard.writeText(snippetCode);
                                toastMsg = 'Lab snippet copied to clipboard'; toastType = 'info'; showToast = true;
                            ">
                            <iconify-icon icon="material-symbols-light:content-copy" class="text-sm"></iconify-icon>
                            Copy
                        </button>
                    </div>

                    <!-- Right: Save + Reset Actions -->
                    <div class="flex items-center gap-2">
                        <button
                            class="btn btn-xs btn-ghost text-secondary border border-secondary/20 hover:bg-secondary/10 gap-1"
                            data-on-click="
                                if (!baseSnippets.includes(activeSnippet)) {
                                    window._indexedDB.snippets[doc.SnippetModule + '_' + activeSnippet] = snippetCode;
                                    toastMsg = 'Snippet saved: ' + activeSnippet; toastType = 'success'; showToast = true;
                                } else {
                                    showSnippetModal = true; snippetName = ''; snippetError = '';
                                }
                            ">
                            <iconify-icon icon="material-symbols-light:save" class="text-sm"></iconify-icon> Save
                        </button>
                        <button class="btn btn-xs btn-ghost text-error border border-error/20 hover:bg-error/10 gap-1"
                            data-on-click="
                                if (!baseSnippets.includes(activeSnippet)) {
                                    window._indexedDB.snippets.get(doc.SnippetModule + '_' + activeSnippet).then(val => {
                                        snippetCode = val || (doc.Examples && doc.Examples[activeSnippet]) || doc.Snippet || '';
                                        toastMsg = 'Reset complete'; toastType = 'success'; showToast = true;
                                    });
                                } else {
                                    snippetCode = (doc.Examples && doc.Examples[activeSnippet]) || doc.Snippet;
                                    toastMsg = 'Reverted to document source'; toastType = 'success'; showToast = true;
                                }
                            ">
                            <iconify-icon icon="material-symbols-light:restart-alt" class="text-sm"></iconify-icon>
                            Reset
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════ 4. MODALS (PORTED FROM ORIGINAL) ═══════════ -->
    <!-- Save Lab Modal -->
    <template data-if="showSnippetModal">
        <div class="fixed inset-0 bg-black/60 z-[9998] flex items-center justify-center p-4">
            <div class="card bg-base-100 shadow-2xl border border-base-content/10 max-w-md w-full">
                <div class="card-body p-6">
                    <h3 class="card-title text-base font-bold text-secondary flex items-center gap-2">
                        <iconify-icon icon="material-symbols-light:save" class="text-lg"></iconify-icon>
                        Save Lab Snippet
                    </h3>
                    <p class="py-1 text-xs text-base-content/70">Save this live lab configuration to IndexedDB:</p>
                    <input type="text" class="input input-bordered input-sm input-secondary w-full font-mono text-xs"
                        data-bind-value="snippetName" placeholder="my-custom-test">
                    <p data-show="snippetError !== ''" class="text-error text-xs mt-1" data-bind="snippetError"
                        style="display:none;"></p>
                    <div class="card-actions justify-end mt-4 gap-2">
                        <button class="btn btn-ghost btn-xs" data-on-click="showSnippetModal = false">Cancel</button>
                        <button class="btn btn-secondary btn-xs" data-on-click="
                            const name = snippetName.trim();
                            if (!name) { snippetError = 'Name is required'; return; }
                            if (baseSnippets.includes(name)) { snippetError = 'Reserved name'; return; }
                            if (snippets.indexOf(name) !== -1) { snippetError = 'Already exists'; return; }
                            window._indexedDB.snippets[doc.SnippetModule + '_' + name] = snippetCode;
                            snippets.push(name);
                            activeSnippet = name;
                            showSnippetModal = false;
                            toastMsg = 'Lab saved: ' + name; toastType = 'success'; showToast = true;
                        ">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Rename Lab Modal -->
    <template data-if="showRenameSnippetModal">
        <div class="fixed inset-0 bg-black/60 z-[9998] flex items-center justify-center p-4">
            <div class="card bg-base-100 shadow-2xl border border-base-content/10 max-w-md w-full">
                <div class="card-body p-6">
                    <h3 class="card-title text-base font-bold text-info flex items-center gap-2">
                        <iconify-icon icon="material-symbols-light:edit-outline" class="text-lg"></iconify-icon>
                        Rename Snippet
                    </h3>
                    <p class="py-1 text-xs text-base-content/70">Enter new name for <span
                            class="font-bold font-mono text-primary" data-bind="manageTarget"></span>:</p>
                    <input type="text" class="input input-bordered input-sm input-info w-full font-mono text-xs"
                        data-bind-value="newName" placeholder="new-name">
                    <p data-show="manageError !== ''" class="text-error text-xs mt-1" data-bind="manageError"
                        style="display:none;"></p>
                    <div class="card-actions justify-end mt-4 gap-2">
                        <button class="btn btn-ghost btn-xs"
                            data-on-click="showRenameSnippetModal = false">Cancel</button>
                        <button class="btn btn-info btn-xs" data-on-click="
                            const target = manageTarget;
                            const name = newName.trim();
                            if (!name) { manageError = 'Name is required'; return; }
                            if (baseSnippets.includes(name)) { manageError = 'Reserved name'; return; }
                            if (snippets.indexOf(name) !== -1 && name !== target) { manageError = 'Already exists'; return; }
                            window._indexedDB.snippets.get(doc.SnippetModule + '_' + target).then(val => {
                                window._indexedDB.snippets[doc.SnippetModule + '_' + name] = val || snippetCode;
                                window._indexedDB.snippets.delete(doc.SnippetModule + '_' + target);
                                const idx = snippets.indexOf(target);
                                if (idx !== -1) snippets[idx] = name;
                                if (activeSnippet === target) activeSnippet = name;
                                showRenameSnippetModal = false;
                                toastMsg = 'Renamed to: ' + name; toastType = 'success'; showToast = true;
                            });
                        ">Rename</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Delete Lab Modal -->
    <template data-if="showDeleteSnippetModal">
        <div class="fixed inset-0 bg-black/60 z-[9998] flex items-center justify-center p-4">
            <div class="card bg-base-100 shadow-2xl border border-base-content/10 max-w-md w-full">
                <div class="card-body p-6">
                    <h3 class="card-title text-base font-bold text-error flex items-center gap-2">
                        <iconify-icon icon="material-symbols-light:delete-outline" class="text-lg"></iconify-icon>
                        Delete Snippet
                    </h3>
                    <p class="py-1 text-xs text-base-content/70">Are you sure you want to delete <span
                            class="font-bold font-mono text-error" data-bind="manageTarget"></span>? This cannot be
                        undone.</p>
                    <div class="card-actions justify-end mt-4 gap-2">
                        <button class="btn btn-ghost btn-xs"
                            data-on-click="showDeleteSnippetModal = false">Cancel</button>
                        <button class="btn btn-error btn-xs" data-on-click="
                            const target = manageTarget;
                            window._indexedDB.snippets.delete(doc.SnippetModule + '_' + target);
                            const idx = snippets.indexOf(target);
                            if (idx !== -1) snippets.splice(idx, 1);
                            if (activeSnippet === target) activeSnippet = baseSnippets[0] || 'Default';
                            showDeleteSnippetModal = false;
                            toastMsg = 'Deleted: ' + target; toastType = 'info'; showToast = true;
                        ">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ═══════════ 5. TOAST FEEDBACK ═══════════ -->
    <div data-show="showToast" class="fixed bottom-6 end-6 z-[9999] shadow-2xl" style="display:none;"
        data-effect="if (showToast) setTimeout(() => showToast = false, 3000)">
        <div class="alert shadow-lg" data-class-alert-success="toastType === 'success'"
            data-class-alert-info="toastType === 'info'" data-class-alert-warning="toastType === 'warning'">
            <span data-bind="toastMsg" class="font-bold text-xs"></span>
        </div>
    </div>
</div>
