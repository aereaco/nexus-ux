      syncPageHighlights: function(container, tabId, tokens) {
        if (typeof window === 'undefined' || typeof window.CSS === 'undefined' || !window.CSS.highlights || typeof window.Highlight === 'undefined') return;
        if (!container) return;
        const effectiveTabId = tabId || (typeof router !== 'undefined' ? router.activePageTabId : '');
        if (!tokens || tokens.length === 0 || !searchTabs || !searchTabs[effectiveTabId]) {
          window.CSS.highlights.delete('page-match');
          searchHighlightCount = 0;
          searchTicks = [];
          if (effectiveTabId && searchTabs && searchTabs[effectiveTabId]) {
            searchTabs[effectiveTabId].count = 0;
            searchTabs[effectiveTabId].ticks = [];
          }
          return;
        }
        window.setTimeout(() => {
          try {
            if (!searchTabs || !searchTabs[effectiveTabId] || !searchTabs[effectiveTabId].tokens || searchTabs[effectiveTabId].tokens.length === 0) {
              window.CSS.highlights.delete('page-match');
              return;
            }
            const ranges = [];
            const filter = window.NodeFilter ? window.NodeFilter.SHOW_TEXT : 4;
            const walker = window.document.createTreeWalker(container, filter, null);
            let node;
            while ((node = walker.nextNode())) {
              const text = node.textContent;
              if (!text || !text.trim()) continue;
              const lowerText = text.toLowerCase();
              for (const token of tokens) {
                if (!token || token.length < 2) continue;
                let pos = 0;
                while ((pos = lowerText.indexOf(token, pos)) !== -1) {
                  const range = new window.Range();
                  range.setStart(node, pos);
                  range.setEnd(node, pos + token.length);
                  ranges.push(range);
                  pos += token.length;
                }
              }
            }
            if (!searchTabs || !searchTabs[effectiveTabId]) {
              window.CSS.highlights.delete('page-match');
              return;
            }
            searchHighlightCount = ranges.length;
            if (ranges.length !== 0) {
              window.CSS.highlights.set('page-match', new window.Highlight(...ranges));

              // Compute scrollbar location ticks
              const scrollEl = container.closest('.overflow-y-auto') || container;
              const ticks = [];
              if (scrollEl) {
                const scrollRect = scrollEl.getBoundingClientRect();
                const scrollH = scrollEl.scrollHeight;
                const scrollT = scrollEl.scrollTop;

                for (const r of ranges) {
                  const rect = r.getBoundingClientRect();
                  if (!rect || (rect.width === 0 && rect.height === 0)) continue;
                  const topInScroll = (rect.top - scrollRect.top) + scrollT;
                  const pct = Math.min(99.5, Math.max(0.5, (topInScroll / scrollH) * 100));
                  if (!ticks.some(t => Math.abs(t - pct) < 0.8)) {
                    ticks.push(Number(pct.toFixed(1)));
                  }
                }
              }
              searchTicks = ticks;
              if (effectiveTabId && searchTabs && searchTabs[effectiveTabId]) {
                searchTabs[effectiveTabId].count = ranges.length;
                searchTabs[effectiveTabId].ticks = ticks;
              }
            } else {
              window.CSS.highlights.delete('page-match');
              searchTicks = [];
              if (effectiveTabId && searchTabs && searchTabs[effectiveTabId]) {
                searchTabs[effectiveTabId].count = 0;
                searchTabs[effectiveTabId].ticks = [];
              }
            }
          } catch { /* ignore range calculation errors */ }
        }, 120);
      },
      segmenter: null,
      collator: null,
      getSearchTokens: function(query) {
        const q = (query || '').trim();
        if (!q) return [];
        try {
          if (typeof Intl !== 'undefined' && Intl.Segmenter) {
            const seg = new Intl.Segmenter('en', { granularity: 'word' });
            return Array.from(seg.segment(q)).filter(function(s) { return s.isWordLike; }).map(function(s) { return s.segment.toLowerCase(); });
          }
        } catch { /* fallback */ }
        return q.toLowerCase().split(/\s+/).filter(Boolean);
      },
      syncHighlights: (container, tokens) => {
        if (typeof window === 'undefined' || typeof window.CSS === 'undefined' || !window.CSS.highlights || typeof window.Highlight === 'undefined') return;
        if (!container) return;
        if (!tokens || tokens.length === 0) {
          window.CSS.highlights.delete('search-match');
          return;
        }
        window.setTimeout(() => {
          try {
            const ranges = [];
            const filter = window.NodeFilter ? window.NodeFilter.SHOW_TEXT : 4;
            const walker = window.document.createTreeWalker(container, filter, null);
            let node;
            while ((node = walker.nextNode())) {
              const text = node.textContent;
              if (!text || !text.trim()) continue;
              const lowerText = text.toLowerCase();
              for (const token of tokens) {
                if (!token || token.length === 0 || token.length === 1) continue;
                let pos = 0;
                while ((pos = lowerText.indexOf(token, pos)) !== -1) {
                  const range = new window.Range();
                  range.setStart(node, pos);
                  range.setEnd(node, pos + token.length);
                  ranges.push(range);
                  pos += token.length;
                }
              }
            }
            if (ranges.length !== 0) {
              window.CSS.highlights.set('search-match', new window.Highlight(...ranges));
            } else {
              window.CSS.highlights.delete('search-match');
            }
          } catch { /* ignore range calculation errors */ }
        }, 60);
      },
      getRouteCategory: (r) => {
        if (!r || !r.path || r.path === '/') return 'Navigation';
        const g = window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
        const pages = g.router?.pages || [];
        const titleCase = (s) => (s || '')
          .split(/[-_]+/)
          .filter(Boolean)
          .map(w => w.charAt(0).toUpperCase() + w.slice(1))
          .join(' ');

        let foundNode = null;
        const walk = (items, ancestors = []) => {
          if (foundNode) return;
          for (const item of items || []) {
            if (!item) continue;
            const key = item.href || item.route || item.path;
            if (key && key === r.path) {
              foundNode = { item, ancestors };
              return;
            }
            if (item.children && item.children.length) {
              walk(item.children, [...ancestors, item]);
              if (foundNode) return;
            }
          }
        };
        walk(pages);

        if (foundNode) {
          const { item, ancestors } = foundNode;
          if (ancestors && ancestors.length !== 0) {
            const rootCat = ancestors[0].category || ancestors[0].meta?.category;
            const ancestorChain = ancestors.map(a => a.title || titleCase(a.id)).filter(Boolean);
            const parentChain = ancestorChain.join(' / ');
            if (rootCat && !ancestorChain.includes(rootCat)) {
              return `${rootCat} / ${parentChain}`;
            }
            return parentChain;
          }
          if (item.category) return item.category;
          if (item.meta?.category) return item.meta.category;
          if (item.children && item.children.length) return item.title || 'General';
        }

        if (r.meta?.category) return r.meta.category;

        const segs = r.path.split('/').filter(Boolean);
        if (segs.length === 0) return 'Navigation';
        if (segs.length === 1) return titleCase(segs[0]) || 'General';
        const catSegs = segs.slice(0, segs.length - 1);
        return catSegs.map(titleCase).join(' / ');
      },
      searchResultGroups: (query, index) => {
        const q = (query || '').trim();
        if (!q) return [];
        const g = window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
        const terms = (g.getSearchTokens ? g.getSearchTokens(q) : q.toLowerCase().split(/\s+/).filter(Boolean));
        if (terms.length === 0) return [];

        const getCat = g.getRouteCategory || (() => 'General');
        const catalog = index || g.searchIndex || [];
        const allRoutes = (g.router?.manifest || g.router?.routes || []).filter(r => r.path !== '/error' && r.path !== '' && !r.internal);

        const navMatches = [];
        const contentMatches = [];
        const seenNavPaths = new Set();

        // Domain 1: Routes, Categories, Titles, & Keywords
        for (const r of allRoutes) {
          const title = (r.meta?.title || r.title || r.name || '').toLowerCase();
          const path = (r.path || '').toLowerCase();
          const cat = getCat(r).toLowerCase();
          const id = (r.id || r.name || '').toLowerCase();
          const kws = (r.meta?.keywords || r.keywords || []).join(' ').toLowerCase();
          const searchable = `${title} ${path} ${cat} ${id} ${kws}`;

          if (terms.every(term => searchable.includes(term))) {
            let score = 0;
            if (title === q) score += 100;
            else if (title.startsWith(q)) score += 50;
            else if (title.includes(q)) score += 30;
            if (terms.every(t => title.includes(t))) score += 20;
            for (const t of terms) {
              if (title.includes(t)) score += 10;
              if (path.includes(t)) score += 5;
              if (cat.includes(t)) score += 3;
              if (kws.includes(t)) score += 4;
            }

            navMatches.push({
              id: r.path,
              path: r.path,
              component: r.component,
              name: r.name,
              meta: r.meta,
              category: getCat(r),
              score: score
            });
            seenNavPaths.add(r.path);
          }
        }

        navMatches.sort((a, b) => b.score - a.score);

        // Domain 2: Deep Content & Documentation
        for (const entry of catalog) {
          if (!entry || !entry.route || seenNavPaths.has(entry.route)) continue;
          const text = entry.content || '';
          if (!text) continue;
          const lowerText = text.toLowerCase();
          if (terms.every(term => lowerText.includes(term))) {
            let bestPos = -1;
            for (const t of terms) {
              const p = lowerText.indexOf(t);
              if (p !== -1) {
                bestPos = (bestPos === -1) ? p : Math.min(bestPos, p);
              }
            }
            if (bestPos !== -1) {
              const start = Math.max(0, bestPos - 35);
              const end = Math.min(text.length, bestPos + 45);
              let snippet = text.slice(start, end).trim();
              if (start !== 0) snippet = '…' + snippet;
              if (end !== text.length) snippet = snippet + '…';

              const r = allRoutes.find(route => route.path === entry.route) || { path: entry.route, component: entry.path, name: entry.id, meta: { title: entry.title } };
              contentMatches.push({
                id: 'content_' + entry.route,
                path: entry.route,
                component: r.component || entry.path,
                name: r.name || entry.id,
                meta: r.meta || { title: entry.title },
                category: entry.category || getCat(r),
                snippet: snippet
              });
            }
          }
        }

        const groups = [];
        if (navMatches.length !== 0) {
          groups.push({
            id: 'nav_' + q,
            type: 'nav',
            title: 'Pages & Navigation',
            icon: 'material-symbols-light:navigation-outline',
            items: navMatches
          });
        }
        if (contentMatches.length !== 0) {
          groups.push({
            id: 'content_' + q,
            type: 'content',
            title: 'Page Content Matches',
            icon: 'material-symbols-light:description-outline',
            items: contentMatches
          });
        }
        return groups;
      },
      flatSearchResults: (query) => {
        const g = window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
        const fn = g.searchResultGroups;
        if (!fn) return [];
        return fn(query, g.searchIndex).flatMap(grp => grp.items || []);

        return groups.some(grp => grp.items && grp.items.length !== 0);

        { id: 'runtime', name: 'Nexus Runtime', icon: 'material-symbols-light:memory' },
        { id: 'build', name: 'Build & AOT', icon: 'material-symbols-light:build' },
        { id: 'surreal', name: 'SurrealDB / REPL', icon: 'material-symbols-light:database' }
      ],
      terminalBuffers: {
        cli: [
          { type: 'info', text: 'Nexus-UX Interactive Shell v2.4 (Tier 3 Sovereign Engine)' },
          { type: 'dim', text: 'Type help for available commands, status for runtime diagnostics.' },
          { type: 'system', text: '[SYSTEM] Shell initialized at /workspace/nexus-ux. Ready for input.' }
        ],
        runtime: [
          { type: 'system', text: '[Nexus Topology] Boot: Detected 8 cores, SAB: true, Tier 3 Quad-Thread' },
          { type: 'heap', text: '[SignalHeap] Attached SharedArrayBuffer (Capacity: 1,048,576 slots)' },
          { type: 'worker', text: '[Worker-1] Logic pipeline thread running (4-phase atomic cycle: 60fps)' },
          { type: 'worker', text: '[Worker-2] DOM reconciliation diff thread active' },
          { type: 'worker', text: '[Worker-3] JIT CSS / Theme token generator active' }
        ],
        build: [
          { type: 'build', text: '[AOT Compiler] Compiling constructable stylesheets… OK' },
          { type: 'build', text: '[Packer] Inlining DaisyUI v5 & Tailwind v4 theme tokens: 32 themes cached' },
          { type: 'build', text: '[Router] Synchronized 16 routes from manifest.json' },
          { type: 'ok', text: '[Bundle] Zero-copy bundle payload ready: 48.2 KB (brotli)' }
        ],
        surreal: [
          { type: 'db', text: 'Connected to surreal://localhost:8000 (Namespace: nexus, Database: erp)' },
          { type: 'db', text: 'Live tables: [customer, invoice, order, inventory_item, telemetry_event]' },
          { type: 'dim', text: 'Ready for SurrealQL queries. Type SELECT * FROM invoice; or help.' }
        ]
      },
      terminalInputText: '',
      toggleTerminalHud: () => {
        const g = window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
        g.terminalOpen = !g.terminalOpen;
        if (g.terminalOpen) {
          window.Nexus?.coordinator?.runtimeContext?.$nextTick?.(() => {
            document.getElementById('terminal-cli-input')?.focus();
            const stream = document.getElementById('terminal-message-stream');
            if (stream) stream.scrollTop = stream.scrollHeight;
          });
        }
      },
      closeTerminalHud: () => {
        const g = window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
        g.terminalOpen = false;
      },
      toggleTerminalDock: () => {
        const g = window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
        g.terminalDocked = !g.terminalDocked;
        localStorage.setItem('terminalDocked', g.terminalDocked);
      },
      toggleTerminalMax: () => {
        const g = window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
        g.terminalMaximized = !g.terminalMaximized;
      },
      clearTerminalTab: (tabId) => {
        const g = window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
        const id = tabId || g.terminalActiveTab || 'cli';
        const buffers = { ...(g.terminalBuffers || {}) };
        buffers[id] = [{ type: 'dim', text: 'Buffer cleared.' }];
        g.terminalBuffers = buffers;
      },
      createTerminalTab: () => {
        const g = window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
        const count = (g.terminalTabs || []).length + 1;
        const newId = 'custom-' + window.Date.now();
        const newTab = { id: newId, name: 'Term #' + count, icon: 'material-symbols-light:terminal' };
        g.terminalTabs = [...(g.terminalTabs || []), newTab];
        g.terminalBuffers = {
          ...(g.terminalBuffers || {}),
          [newId]: [{ type: 'info', text: 'Custom terminal session created.' }]
        };
        g.terminalActiveTab = newId;
      },
      closeTerminalTab: (tabId) => {
        const g = window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
        const tabs = (g.terminalTabs || []).filter(t => t.id !== tabId);
        g.terminalTabs = tabs;
        if (g.terminalActiveTab === tabId && tabs.length > 0) {
          g.terminalActiveTab = tabs[0].id;
        }
      },
      runTerminalCommand: () => {
        const g = window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
        const input = (g.terminalInputText || '').trim();
        if (!input) return;
        const tab = g.terminalActiveTab || 'cli';
        const curBuf = [...((g.terminalBuffers || {})[tab] || [])];
        
        curBuf.push({ type: 'user', text: input, time: new window.Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) });
        
        const parts = input.split(' ');
        const cmd = parts[0].toLowerCase();
        const arg = parts.slice(1).join(' ').trim();
        
        if (cmd === 'help') {
          curBuf.push({ type: 'help', text: 'Available CLI commands:' });
          curBuf.push({ type: 'dim', text: '  status           - View live topology, tier, and heap status' });
          curBuf.push({ type: 'dim', text: '  topology         - View multi-threaded Web Worker allocation' });
          curBuf.push({ type: 'dim', text: '  routes           - List all available SPA application routes' });
          curBuf.push({ type: 'dim', text: '  theme <name>     - Switch DaisyUI theme (e.g. dark, synthwave)' });
          curBuf.push({ type: 'dim', text: '  tabs             - List open page tabs in the workspace' });
          curBuf.push({ type: 'dim', text: '  chat             - Open the collaborative AI chatbar' });
          curBuf.push({ type: 'dim', text: '  dock             - Toggle HUD docking below footer' });
          curBuf.push({ type: 'dim', text: '  clear            - Clear current terminal buffer' });
          curBuf.push({ type: 'dim', text: '  exit / close     - Dismiss Terminal HUD' });
        } else if (cmd === 'clear') {
          curBuf.length = 0;
          curBuf.push({ type: 'dim', text: 'Buffer cleared.' });
        } else if (cmd === 'status' || cmd === 'info') {
          curBuf.push({ type: 'system', text: '[SYSTEM DIAGNOSTICS]' });
          curBuf.push({ type: 'ok', text: '  Framework: Nexus-UX v2.4 (HTML Declarative Reactive Architecture)' });
          curBuf.push({ type: 'ok', text: '  Reactive Engine: Vue 3 Fine-Grained with SharedArrayBuffer SignalHeap' });
          curBuf.push({ type: 'info', text: '  Active Theme: ' + (document.documentElement.getAttribute('data-theme') || 'dark') });
          curBuf.push({ type: 'info', text: '  Active Page Tabs: ' + (g.router?.pageTabs?.length || 1) });
          curBuf.push({ type: 'info', text: '  Active Chat Sessions: ' + (g.chatSessions?.length || 0) });
        } else if (cmd === 'topology') {
          curBuf.push({ type: 'system', text: '[NEXUS TOPOLOGY METRICS]' });
          curBuf.push({ type: 'ok', text: '  Tier: Tier 3 (Quad-Thread Sovereign Autoscale)' });
          curBuf.push({ type: 'ok', text: '  Dedicated Web Workers: 3 active (Logic, Diff, JIT)' });
          curBuf.push({ type: 'info', text: '  Frame Budget: 8.0ms (4-phase atomic execution loop: 60fps)' });
        } else if (cmd === 'routes') {
          const rList = (g.router?.routes || []).map(r => r.path).filter(Boolean);
          curBuf.push({ type: 'info', text: 'Available Routes (' + rList.length + '): ' + rList.join(', ') });
        } else if (cmd === 'tabs') {
          const tList = (g.router?.pageTabs || []).map(t => t.title || t.path || 'Tab').join(', ');
          curBuf.push({ type: 'info', text: 'Workspace Tabs: ' + (tList || 'None open') });
        } else if (cmd === 'chat') {
          g.chatbarOpen = true;
          curBuf.push({ type: 'ok', text: 'Collaborative AI Chatbar opened.' });
        } else if (cmd === 'dock') {
          g.toggleTerminalDock();
          curBuf.push({ type: 'ok', text: 'Terminal docking toggled: ' + (g.terminalDocked ? 'Docked below footer' : 'Floating over content') });
        } else if (cmd === 'theme') {
          if (arg) {
            document.documentElement.setAttribute('data-theme', arg);
            localStorage.setItem('theme', arg);
            curBuf.push({ type: 'ok', text: 'Theme switched to: ' + arg });
          } else {
            curBuf.push({ type: 'warn', text: 'Usage: theme <name> (e.g. theme synthwave, theme luxury, theme dark)' });
          }
        } else if (cmd === 'exit' || cmd === 'close') {
          g.terminalOpen = false;
          curBuf.push({ type: 'dim', text: 'Terminal closed.' });
        } else {
          curBuf.push({ type: 'error', text: 'Command not recognized: ' + cmd + '. Type help for a list of commands.' });
        }
        
        g.terminalBuffers = { ...(g.terminalBuffers || {}), [tab]: curBuf };
        g.terminalInputText = '';
        
        window.Nexus?.coordinator?.runtimeContext?.$nextTick?.(() => {
          const stream = document.getElementById('terminal-message-stream');
          if (stream) stream.scrollTop = stream.scrollHeight;
        });
      }
    }"
  data-class="{ 'md:grid-cols-[max-content_1fr]': !collapsed, 'md:grid-cols-[4rem_1fr]': collapsed, 'h-screen max-h-screen overflow-hidden': fixedHeader, 'min-h-screen': !fixedHeader }"
