<head>
  <title>Nexus-UX • Advanced Todo</title>
  <meta name="id" content="todo">
  <meta name="route" content="/todo">
  <meta name="icon" content="material-symbols-light:checklist">
  <meta name="order" content="2">
  <meta name="category" content="Apps">
</head>

<div class="max-w-4xl mx-auto w-full p-4 sm:p-6 space-y-6 flex flex-col items-center justify-start relative"
  data-import="{
    testPlugin: {
      script: { src: '/_pages/todo-plugin.js' }
    }
  }"
  data-signal="{
    todos: [
      { id: 1, text: 'Explore Nexus-UX reactive directives', completed: true },
      { id: 2, text: 'Test drag-and-drop task reordering', completed: false },
      { id: 3, text: 'Verify dynamic plugin attribute loading', completed: false }
    ],
    hydrated: false,
    newTodo: '',
    filter: 'all',
    layout: (typeof localStorage !== 'undefined' && localStorage.getItem('nexus_todo_layout')) || 'list',
    activeTodo: null,
    isEditing: false,
    showConfirmDelete: false,
    showConfirmClear: false,
    editTempText: '',
    progress: 0,
    $saveTodos: (t) => {
      progress = 20;
      try {
        if (typeof localStorage !== 'undefined') {
          localStorage.setItem('nexus_todos', JSON.stringify(t));
        }
      } catch (e) {}
      setTimeout(() => progress = 100, 300);
      setTimeout(() => progress = 0, 800);
    }
  }"
  data-effect="
    if (!hydrated) {
      try {
        if (typeof localStorage !== 'undefined') {
          const saved = localStorage.getItem('nexus_todos');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              todos.splice(0, todos.length, ...parsed);
            }
          }
        }
      } catch (e) {}
      hydrated = true;
    }
    if (typeof localStorage !== 'undefined') {
      try { localStorage.setItem('nexus_todo_layout', layout); } catch (e) {}
    }
  "
  data-computed="{
    filteredTodos: () => {
      const f = filter;
      const list = todos;
      if (f === 'active') return list.filter(t => !t.completed);
      if (f === 'completed') return list.filter(t => t.completed);
      return [...list];
    },
    remaining: () => todos.filter(t => !t.completed).length
  }">

  <!-- Progress Bar indicator -->
  <div class="w-full max-w-2xl h-1 -mb-4 overflow-hidden rounded-t-lg">
    <progress class="progress progress-primary w-full h-1 rounded-none transition-all duration-300"
      data-show="progress > 0 || isEditing" data-bind-value="isEditing ? null : progress" max="100"></progress>
  </div>

  <!-- Main Card (data-test-plugin: demonstrates Nexus-UX 3rd-party plugin API) -->
  <div class="card w-full max-w-2xl bg-base-100/90 backdrop-blur-md shadow-2xl border border-base-content/10 transition-all duration-500 overflow-visible relative"
    data-test-plugin="yay!">
    <div class="card-body gap-6 p-6 sm:p-8">

      <!-- Header -->
      <header class="flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-primary/10 text-primary flex items-center justify-center text-2xl">
            <iconify-icon icon="material-symbols-light:checklist"></iconify-icon>
          </div>
          <div>
            <h1 class="text-3xl font-bold tracking-tight text-primary">Nexus Todo</h1>
            <p class="text-xs text-base-content/60">HTML-first reactive state management</p>
          </div>
        </div>

        <!-- Layout Toggles -->
        <div class="join bg-base-200 p-1 rounded-box shadow-inner">
          <button class="join-item btn btn-xs btn-ghost gap-1" data-on-click="layout = 'list'"
            data-class="{ 'btn-active text-primary': layout === 'list' }">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M4 6h16M4 12h16M4 18h16" stroke-width="2" stroke-linecap="round" />
            </svg> List
          </button>
          <button class="join-item btn btn-xs btn-ghost gap-1" data-on-click="layout = 'grid'"
            data-class="{ 'btn-active text-primary': layout === 'grid' }">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z" stroke-width="2" stroke-linecap="round" />
            </svg> Grid
          </button>
          <button class="join-item btn btn-xs btn-ghost gap-1" data-on-click="layout = 'compact'"
            data-class="{ 'btn-active text-primary': layout === 'compact' }">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M4 8h16M4 16h16" stroke-width="2" stroke-linecap="round" />
            </svg> Compact
          </button>
        </div>

        <div class="badge badge-secondary badge-lg font-bold py-3" data-bind="remaining + ' left'"></div>
      </header>

      <!-- Input Group -->
      <div class="relative group w-full">
        <input type="text"
          class="input input-lg input-bordered w-full pr-[120px] focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-medium bg-base-200/40"
          data-bind="newTodo" placeholder="What needs to be done?" data-on-keyup_enter="
            if (newTodo.trim()) {
              todos.push({ id: Date.now(), text: newTodo.trim(), completed: false });
              newTodo = '';
              $saveTodos(todos);
            }
          ">
        <button class="btn btn-primary absolute top-1/2 -translate-y-1/2 right-2 px-6 shadow-md" data-on-click="
            if (newTodo.trim()) {
              todos.push({ id: Date.now(), text: newTodo.trim(), completed: false });
              newTodo = '';
              $saveTodos(todos);
            }
          ">Add Task</button>
      </div>

      <!-- Filter Tabs -->
      <div class="flex flex-wrap justify-between items-center gap-4 border-b border-base-content/10 pb-4 w-full">
        <div class="tabs tabs-boxed bg-base-200 p-1">
          <a class="tab tab-sm" data-on-click="filter = 'all'"
            data-class="{ 'tab-active': filter === 'all' }">All</a>
          <a class="tab tab-sm" data-on-click="filter = 'active'"
            data-class="{ 'tab-active': filter === 'active' }">Active</a>
          <a class="tab tab-sm" data-on-click="filter = 'completed'"
            data-class="{ 'tab-active': filter === 'completed' }">Completed</a>
        </div>
        <button class="btn btn-ghost btn-xs text-error font-bold" data-on-click="showConfirmClear = true">
          Clear Completed
        </button>
      </div>

      <!-- Todo List Container -->
      <div class="min-h-[220px] transition-all duration-300 w-full" data-class="{
          'grid grid-cols-1 sm:grid-cols-2 gap-4': layout === 'grid',
          'flex flex-col gap-3': layout === 'list',
          'flex flex-col gap-1.5': layout === 'compact'
        }" data-drag-container="todos"
        data-drag-class="!opacity-100 !shadow-[0_25px_50px_-12px_rgba(0,0,0,0.25)] scale-105 cursor-grabbing z-[9999]"
        data-drag-ghost-class="opacity-40 bg-base-200 border-2 border-dashed border-base-content/20">

        <!-- Empty State -->
        <div data-show="todos.length === 0"
          class="flex flex-col items-center justify-center h-40 text-base-content/30 italic col-span-full w-full">
          <svg class="w-12 h-12 mb-2 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Ready for your focus...
        </div>

        <!-- Todo Items -->
        <div data-for="todo in filteredTodos" data-drag
          class="rounded-2xl transition-all duration-200 flex border border-base-content/5 min-w-0 cursor-move relative group select-none shadow-sm hover:border-primary/30"
          data-class="{
            'p-5 flex-col items-center justify-center text-center h-40 bg-base-200/70': layout === 'grid',
            'p-4 items-center gap-4 bg-base-200/70 hover:shadow-md': layout === 'list',
            'p-2.5 items-center gap-3 text-sm bg-base-200/50 hover:bg-base-200/80': layout === 'compact'
          }" data-on-click="activeTodo = todo; isEditing = false">

          <!-- Left area -->
          <div class="flex-1 flex min-w-0" data-class="{
              'flex-col items-center w-full': layout === 'grid',
              'gap-4 items-center': layout !== 'grid'
            }">

            <!-- Checkbox -->
            <div data-on-click_stop="" data-class="{ 'absolute top-4 left-4': layout === 'grid' }">
              <input type="checkbox"
                class="checkbox checkbox-primary transition-all hover:scale-110 active:scale-125"
                data-class="{ 'checkbox-md': layout !== 'compact', 'checkbox-sm': layout === 'compact' }"
                data-bind-checked="todo.completed" data-on-change="$saveTodos(todos)">
            </div>

            <!-- Text -->
            <span class="font-medium leading-tight select-none text-base-content transition-opacity" data-bind="todo.text"
              data-class="{
                'text-base sm:text-lg': layout === 'list',
                'line-clamp-3 w-full px-4 mt-2': layout === 'grid',
                'truncate': layout === 'compact',
                'line-through opacity-40': todo.completed
              }"></span>
          </div>

          <!-- Delete Button -->
          <div class="flex items-center gap-1 transition-opacity opacity-0 group-hover:opacity-100"
            data-on-click_stop="" data-class="{ 'absolute top-4 right-4': layout === 'grid' }">
            <button
              class="btn btn-circle btn-ghost text-error/50 hover:text-error hover:bg-error/10 transition-all"
              data-class="{ 'btn-sm': layout !== 'compact', 'btn-xs': layout === 'compact' }"
              title="Delete Task" data-on-click="activeTodo = todo; showConfirmDelete = true">
              <iconify-icon icon="material-symbols-light:delete-outline"
                data-class="{ 'text-xl': layout !== 'compact', 'text-base': layout === 'compact' }"></iconify-icon>
            </button>
          </div>
        </div>
      </div>

      <!-- Footer Diagnostics -->
      <footer class="mt-auto px-2 opacity-50 hover:opacity-100 transition-opacity w-full">
        <div class="divider text-[10px] uppercase tracking-tighter">Diagnostic Overlay</div>
        <div class="grid grid-cols-2 gap-2 text-[9px] font-mono lowercase">
          <div class="bg-base-200 p-2 rounded flex justify-between">
            <span>viewport</span>
            <span class="text-primary">
              <span data-bind="window.innerWidth"></span>x<span data-bind="window.innerHeight"></span>
            </span>
          </div>
          <div class="bg-base-200 p-2 rounded flex justify-between">
            <span>items total</span>
            <span class="text-secondary" data-bind="todos.length"></span>
          </div>
        </div>
      </footer>

    </div>
  </div>

  <!-- Task View/Edit Modal -->
  <div class="modal" data-class="{ 'modal-open': activeTodo && !showConfirmDelete }">
    <div class="modal-box bg-base-100 shadow-2xl border border-primary/20 p-0 overflow-hidden flex flex-col max-w-lg">
      <!-- Modal Header -->
      <div class="flex items-center justify-between p-4 border-b border-base-200">
        <span class="font-bold uppercase tracking-widest text-xs text-primary/60"
          data-bind="isEditing ? 'Edit Task' : 'View Task'"></span>
        <button class="btn btn-ghost btn-xs btn-circle" data-on-click="activeTodo = null">
          <iconify-icon icon="material-symbols-light:close" class="text-lg"></iconify-icon>
        </button>
      </div>

      <!-- Modal Content -->
      <div class="p-6 flex-1 min-h-[180px] flex flex-col">
        <!-- View Mode -->
        <div data-show="!isEditing"
          class="max-h-64 overflow-y-auto whitespace-pre-wrap select-text px-2 text-lg leading-relaxed text-base-content"
          data-bind="activeTodo?.text"></div>

        <!-- Edit Mode -->
        <textarea data-show="isEditing"
          class="textarea textarea-bordered w-full text-base sm:text-lg font-medium flex-1 min-h-[100px] focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all leading-relaxed"
          data-bind="editTempText" placeholder="Describe your task..."
          data-effect="if (isEditing && $el) { $el.focus(); $el.select(); }"
          data-on-keydown_ctrl_enter="
            if (editTempText.trim()) {
              activeTodo.text = editTempText.trim();
              isEditing = false;
              $saveTodos(todos);
            }
          " data-on-keydown_escape="isEditing = false"></textarea>

        <div data-show="isEditing" class="mt-4">
          <label class="label text-xs uppercase tracking-widest text-primary/60 font-bold">Due Date (DD/MM/YYYY)</label>
          <input type="text" class="input input-bordered w-full font-mono text-sm" data-mask="'##/##/####'" placeholder="DD/MM/YYYY">
        </div>
      </div>

      <!-- Modal Action Bar -->
      <div class="p-4 bg-base-200/50 flex items-center justify-between border-t border-base-200">
        <button class="btn btn-circle btn-ghost text-error/60 hover:text-error hover:bg-error/10 transition-all"
          title="Delete Task" data-on-click="showConfirmDelete = true">
          <iconify-icon icon="material-symbols-light:delete-outline" class="text-2xl"></iconify-icon>
        </button>
        <div class="flex items-center gap-2">
          <div data-show="!isEditing" class="flex gap-2">
            <button class="btn btn-ghost gap-2 px-6"
              data-on-click="isEditing = true; editTempText = activeTodo.text">
              <iconify-icon icon="material-symbols-light:edit-outline" class="text-xl"></iconify-icon>
              Edit
            </button>
            <button class="btn btn-primary px-6 shadow-md" data-on-click="activeTodo = null">Done</button>
          </div>
          <div data-show="isEditing" class="flex gap-2">
            <button class="btn btn-ghost" data-on-click="isEditing = false">Cancel</button>
            <button class="btn btn-primary px-6 shadow-md" data-on-click="
                if (editTempText.trim()) {
                  activeTodo.text = editTempText.trim();
                  isEditing = false;
                  $saveTodos(todos);
                }
              ">Save</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-backdrop bg-black/60 backdrop-blur-sm" data-on-click="activeTodo = null"></div>
  </div>

  <!-- Confirm Delete / Clear Modal -->
  <div class="modal" data-class="{ 'modal-open': showConfirmDelete || showConfirmClear }">
    <div class="modal-box bg-base-100 shadow-2xl border border-error/20 p-6 flex flex-col gap-4 max-w-sm">
      <h3 class="font-bold text-lg text-error flex items-center gap-2">
        <iconify-icon icon="material-symbols-light:warning-rounded" class="text-2xl"></iconify-icon>
        <span data-bind="showConfirmDelete ? 'Confirm Delete' : 'Confirm Clear'"></span>
      </h3>
      <p class="text-base-content/70"
        data-bind="showConfirmDelete ? 'Are you sure you want to permanently remove this task? This action cannot be undone.' : 'Are you sure you want to clear all completed tasks?'">
      </p>
      <div class="flex justify-end gap-3 mt-4">
        <button class="btn btn-ghost btn-sm"
          data-on-click="showConfirmDelete = false; showConfirmClear = false; activeTodo = null">No, Keep it</button>
        <button class="btn btn-error btn-sm text-white px-6 shadow-md" data-on-click="
            if (showConfirmDelete) {
              if (activeTodo) {
                const idx = todos.findIndex(t => t.id === activeTodo.id);
                if (idx !== -1) todos.splice(idx, 1);
              }
              activeTodo = null;
            } else {
              todos.splice(0, todos.length, ...todos.filter(t => !t.completed));
            }
            $saveTodos(todos);
            showConfirmDelete = false;
            showConfirmClear = false;
          ">Yes, <span data-bind="showConfirmDelete ? 'Delete' : 'Clear'"></span></button>
      </div>
    </div>
    <div class="modal-backdrop bg-black/60 backdrop-blur-sm"
      data-on-click="showConfirmDelete = false; showConfirmClear = false"></div>
  </div>

</div>
