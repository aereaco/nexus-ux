<head>
  <title>Visual Builder</title>
  <meta name="route" content="/builder">
  <meta name="icon" content="material-symbols-light:dashboard-customize-outline">
  <meta name="order" content="4">
  <meta name="category" content="Apps">
  <meta name="keywords" content="builder, visual editor, page builder, vvvebjs, drag and drop, daisyui, tailwind">
</head>

<div class="flex h-[calc(100dvh-5rem)] w-full select-none relative overflow-hidden bg-base-300/30 text-base-content font-sans antialiased text-xs"
  id="vvveb-builder-container"
  data-signal="{
    // Sidebar & Layout Toggles
    sidebarExpanded: false,
    showFileManager: true,
    showLeftColumn: true,
    showRightColumn: true,
    bottomPanelExpanded: false,
    activeSidebarTab: 'components',
    componentsSubTab: 'components',
    sectionsSubTab: 'sections',
    propertiesSubTab: 'content',
    styleState: '',
    designerMode: false,
    showHidden: false,
    showTreeList: true,

    // Viewport & Workspace State
    viewport: 'desktop',
    canvasTheme: 'light',
    zoom: 100,
    previewMode: false,
    currentDoc: '/_pages/builder/templates/landing.html',

    // Modals & Popups
    addSectionBoxOpen: false,
    addSectionMode: 'after',
    exportModalOpen: false,
    templateModalOpen: false,
    copiedToast: false,

    // Selection & Overlays
    hasSelection: false,
    selectedEl: null,
    hoveredEl: null,
    selectedBox: { visible: false, top: 0, left: 0, width: 0, height: 0, tag: '', id: '', isText: false },
    hoverBox: { visible: false, top: 0, left: 0, width: 0, height: 0, tag: '' },
    breadcrumbs: [],
    domTree: [],
    pageSections: [],
    canvasHtmlDraft: '',
    canvasCssDraft: '/* Custom Element Styles */\n',
    codeTab: 'html',
    runJsOnEdit: false,

    // Inspector Model
    inspector: {
      tag: '',
      id: '',
      className: '',
      isTextLeaf: false,
      textContent: '',
      fontSize: '',
      fontWeight: '',
      fontFamily: '',
      textAlign: '',
      color: '',
      backgroundColor: '',
      display: '',
      gap: '',
      padding: '',
      marginBottom: '',
      borderRadius: '',
      opacity: '1',
      href: '',
      src: '',
      alt: '',
      target: '',
      dataSignal: '',
      dataBind: '',
      dataShow: '',
      dataOnClick: '',
      dataFor: ''
    },

    // Helper: Unwraps reactive proxies to raw native DOM nodes
    toRawNode: function(node) {
      if (!node) return null;
      let cur = node;
      while (cur && cur.__v_raw) {
        cur = cur.__v_raw;
      }
      return cur;
    },

    // Helper: Gets canvas shadowRoot
    getCanvasRoot: function() {
      const host = toRawNode(document.getElementById('builder-canvas-host'));
      return host ? host.shadowRoot : null;
    },

    // Safe Attribute & Style Modifiers for Inspector
    setAttr: function(name, val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      if (val === '' || val === null || val === undefined) {
        el.removeAttribute(name);
      } else {
        el.setAttribute(name, val);
      }
      if (inspector[name] !== undefined) inspector[name] = val;
      syncCanvasHtmlToDraft();
    },

    setStyle: function(prop, val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.style[prop] = val;
      if (inspector[prop] !== undefined) inspector[prop] = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    getAttr: function(name) {
      const el = toRawNode(selectedEl);
      return el ? (el.getAttribute(name) || '') : '';
    },

    getStyle: function(prop) {
      const el = toRawNode(selectedEl);
      return el ? (el.style[prop] || '') : '';
    },

    toggleCanvasTheme: function() {
      canvasTheme = canvasTheme === 'dark' ? 'light' : 'dark';
      const root = getCanvasRoot();
      const host = toRawNode(document.getElementById('builder-canvas-host'));
      if (host) {
        host.setAttribute('data-theme', canvasTheme);
        if (canvasTheme === 'dark') {
          host.classList.remove('bg-white', 'text-[#212529]');
          host.classList.add('bg-[#1d232a]', 'text-[#a6adbb]', 'dark');
        } else {
          host.classList.remove('bg-[#1d232a]', 'text-[#a6adbb]', 'dark');
          host.classList.add('bg-white', 'text-[#212529]');
        }
      }
      if (root) {
        const body = root.querySelector('body') || root.firstElementChild;
        if (body) {
          body.setAttribute('data-theme', canvasTheme);
          if (canvasTheme === 'dark') {
            body.classList.add('dark');
          } else {
            body.classList.remove('dark');
          }
        }
        const inner = root.querySelector('.min-h-screen') || root.querySelector('div');
        if (inner) {
          inner.setAttribute('data-theme', canvasTheme);
          if (canvasTheme === 'dark') {
            inner.classList.add('dark');
            inner.classList.remove('bg-white', 'text-[#212529]');
            inner.classList.add('bg-[#1d232a]', 'text-[#a6adbb]');
          } else {
            inner.classList.remove('dark', 'bg-[#1d232a]', 'text-[#a6adbb]');
            inner.classList.add('bg-white', 'text-[#212529]');
          }
        }
      }
      updateSelectedBox();
    },

    updateTextContent: function(val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.textContent = val;
      inspector.textContent = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    updateInspectorText: function(val) {
      updateTextContent(val);
    },

    updateClassAttribute: function(val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.className = val;
      inspector.className = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    toggleDaisyClass: function(cls) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.classList.toggle(cls);
      inspector.className = el.className;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    changeTag: function(newTag) {
      const el = toRawNode(selectedEl);
      if (!el || !el.parentNode) return;
      const replacement = document.createElement(newTag);
      replacement.innerHTML = el.innerHTML;
      for (const a of el.attributes) {
        replacement.setAttribute(a.name, a.value);
      }
      el.parentNode.replaceChild(replacement, el);
      selectElement(replacement);
      syncCanvasHtmlToDraft();
      refreshTree();
    },

    // Selection Logic
    selectElement: function(el) {
      const raw = toRawNode(el);
      if (!raw || raw.nodeType !== 1) {
        selectedEl = null;
        hasSelection = false;
        selectedBox.visible = false;
        breadcrumbs = [];
        return;
      }
      selectedEl = raw;
      hasSelection = true;
      const tag = raw.tagName.toLowerCase();
      inspector.tag = raw.tagName.toUpperCase();
      inspector.id = raw.id || '';
      inspector.className = raw.className || '';
      inspector.isTextLeaf = (raw.children.length === 0 && raw.textContent.trim().length > 0);
      inspector.textContent = raw.textContent || '';
      
      try {
        const compStyle = window.getComputedStyle(raw);
        inspector.fontSize = raw.style.fontSize || (compStyle ? compStyle.fontSize : '');
        inspector.fontWeight = raw.style.fontWeight || (compStyle ? compStyle.fontWeight : '');
        inspector.fontFamily = raw.style.fontFamily || (compStyle ? compStyle.fontFamily : '');
        inspector.textAlign = raw.style.textAlign || (compStyle ? compStyle.textAlign : '');
        inspector.color = raw.style.color || (compStyle ? compStyle.color : '');
        inspector.backgroundColor = raw.style.backgroundColor || (compStyle ? compStyle.backgroundColor : '');
        inspector.display = raw.style.display || (compStyle ? compStyle.display : '');
        inspector.gap = raw.style.gap || (compStyle ? compStyle.gap : '');
        inspector.padding = raw.style.padding || (compStyle ? compStyle.padding : '');
        inspector.marginBottom = raw.style.marginBottom || (compStyle ? compStyle.marginBottom : '');
        inspector.borderRadius = raw.style.borderRadius || (compStyle ? compStyle.borderRadius : '');
        inspector.opacity = raw.style.opacity || (compStyle ? compStyle.opacity : '1');
      } catch (_) {}

      try {
        inspector.href = raw.getAttribute('href') || '';
        inspector.src = raw.getAttribute('src') || '';
        inspector.alt = raw.getAttribute('alt') || '';
        inspector.target = raw.getAttribute('target') || '';

        inspector.dataSignal = raw.getAttribute('data-signal') || '';
        inspector.dataBind = raw.getAttribute('data-bind') || '';
        inspector.dataShow = raw.getAttribute('data-show') || '';
        inspector.dataOnClick = raw.getAttribute('data-on-click') || '';
        inspector.dataFor = raw.getAttribute('data-for') || '';
      } catch (_) {}

      // Build breadcrumbs
      const crumbs = [];
      let cur = raw;
      while (cur && cur.nodeType === 1 && cur.tagName.toLowerCase() !== 'html') {
        const rawCur = toRawNode(cur);
        crumbs.unshift({ tag: rawCur.tagName.toLowerCase(), el: rawCur });
        cur = rawCur.parentElement;
      }
      breadcrumbs = crumbs;

      updateSelectedBox();
      syncCanvasHtmlToDraft();
      if (!domTree || domTree.length === 0) {
        refreshTree();
      }
    },

    updateSelectedBox: function() {
      const el = toRawNode(selectedEl);
      if (!el) {
        selectedBox.visible = false;
        hasSelection = false;
        return;
      }
      const host = toRawNode(document.getElementById('builder-canvas-host'));
      if (!host) return;
      try {
        const elRect = el.getBoundingClientRect();
        const frame = host.parentElement || host;
        const frameRect = frame.getBoundingClientRect();

        selectedBox.top = elRect.top - frameRect.top;
        selectedBox.left = elRect.left - frameRect.left;
        selectedBox.width = elRect.width;
        selectedBox.height = elRect.height;
        const tag = el.tagName.toLowerCase();
        selectedBox.tag = tag;
        selectedBox.id = el.id || '';
        selectedBox.isText = ['h1','h2','h3','h4','h5','h6','p','span','a','button','label','li','blockquote','td','th'].includes(tag);
        selectedBox.visible = true;
        hasSelection = true;

        const selectBoxEl = document.getElementById('select-box');
        if (selectBoxEl) {
          selectBoxEl.style.top = (elRect.top - frameRect.top) + 'px';
          selectBoxEl.style.left = (elRect.left - frameRect.left) + 'px';
          selectBoxEl.style.width = elRect.width + 'px';
          selectBoxEl.style.height = elRect.height + 'px';
        }
      } catch (_) {}
    },

    updateHoverBox: function(el) {
      const raw = toRawNode(el);
      if (!raw || raw.nodeType !== 1 || previewMode) {
        hoverBox.visible = false;
        hoveredEl = null;
        return;
      }
      hoveredEl = raw;
      const host = toRawNode(document.getElementById('builder-canvas-host'));
      if (!host) return;
      try {
        const elRect = raw.getBoundingClientRect();
        const frame = host.parentElement || host;
        const frameRect = frame.getBoundingClientRect();

        hoverBox.top = elRect.top - frameRect.top;
        hoverBox.left = elRect.left - frameRect.left;
        hoverBox.width = elRect.width;
        hoverBox.height = elRect.height;
        hoverBox.tag = raw.tagName.toLowerCase();
        hoverBox.visible = true;

        const hoverBoxEl = document.getElementById('highlight-box');
        if (hoverBoxEl) {
          hoverBoxEl.style.top = (elRect.top - frameRect.top) + 'px';
          hoverBoxEl.style.left = (elRect.left - frameRect.left) + 'px';
          hoverBoxEl.style.width = elRect.width + 'px';
          hoverBoxEl.style.height = elRect.height + 'px';
        }
      } catch (_) {}
    },

    selectParent: function() {
      const el = toRawNode(selectedEl);
      if (!el) return;
      const parent = toRawNode(el.parentElement);
      if (parent && parent.nodeType === 1) {
        selectElement(parent);
      }
    },

    duplicateElement: function() {
      const el = toRawNode(selectedEl);
      if (!el || !el.parentElement) return;
      const clone = el.cloneNode(true);
      el.parentElement.insertBefore(clone, el.nextSibling);
      selectElement(clone);
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    deleteElement: function() {
      const el = toRawNode(selectedEl);
      if (!el) return;
      const parent = toRawNode(el.parentElement);
      el.remove();
      selectedEl = null;
      selectedBox.visible = false;
      if (parent && parent.nodeType === 1) {
        selectElement(parent);
      }
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    moveElementUp: function() {
      const el = toRawNode(selectedEl);
      if (!el || !el.previousElementSibling) return;
      el.parentElement.insertBefore(el, el.previousElementSibling);
      updateSelectedBox();
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    moveElementDown: function() {
      const el = toRawNode(selectedEl);
      if (!el || !el.nextElementSibling) return;
      el.parentElement.insertBefore(el.nextElementSibling, el);
      updateSelectedBox();
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    // WYSIWYG In-Canvas Inline Formatting
    formatInline: function(command, value) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      if (command === 'bold') {
        el.style.fontWeight = (el.style.fontWeight === 'bold' || el.style.fontWeight >= '700') ? 'normal' : 'bold';
      } else if (command === 'italic') {
        el.style.fontStyle = (el.style.fontStyle === 'italic') ? 'normal' : 'italic';
      } else if (command === 'underline') {
        el.style.textDecoration = (el.style.textDecoration.includes('underline')) ? 'none' : 'underline';
      } else if (command === 'strike') {
        el.style.textDecoration = (el.style.textDecoration.includes('line-through')) ? 'none' : 'line-through';
      } else if (command === 'align') {
        el.style.textAlign = value;
      } else if (command === 'color') {
        el.style.color = value;
      } else if (command === 'bgColor') {
        el.style.backgroundColor = value;
      } else if (command === 'fontSize') {
        el.style.fontSize = value;
      } else if (command === 'fontFamily') {
        el.style.fontFamily = value;
      }
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    insertSnippet: function(templateId) {
      const root = getCanvasRoot();
      if (!root) return;

      let newEl = null;
      const tpl = document.getElementById(templateId);
      if (tpl && tpl.content) {
        const clone = tpl.content.cloneNode(true);
        newEl = clone.firstElementChild;
      } else if (typeof templateId === 'string' && templateId.startsWith('<')) {
        const temp = document.createElement('div');
        temp.innerHTML = templateId.trim();
        newEl = temp.firstElementChild;
      }
      if (!newEl) return;

      const activeEl = toRawNode(selectedEl);
      if (activeEl && activeEl.parentElement) {
        if (addSectionMode === 'inside' || activeEl.children.length > 0 || ['div', 'section', 'main', 'article', 'aside', 'header', 'footer'].includes(activeEl.tagName.toLowerCase())) {
          activeEl.appendChild(newEl);
        } else {
          activeEl.parentElement.insertBefore(newEl, activeEl.nextSibling);
        }
      } else {
        const container = root.querySelector('div, main, section') || root;
        container.appendChild(newEl);
      }

      addSectionBoxOpen = false;
      selectElement(newEl);
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    clearCanvas: function() {
      const root = getCanvasRoot();
      if (!root) return;
      root.innerHTML = '<div class=\'min-h-screen bg-base-100 text-base-content p-8 flex flex-col items-center justify-center\'><div class=\'max-w-md w-full p-8 border-2 border-dashed border-base-content/20 rounded-2xl text-center\'><h3 class=\'font-bold text-lg mb-1\'>Clean Canvas</h3><p class=\'text-xs text-base-content/60 mb-3\'>Select blocks from the left library to start building.</p></div></div>';
      selectedEl = null;
      selectedBox.visible = false;
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    loadTemplate: function(path) {
      currentDoc = path;
      selectedEl = null;
      selectedBox.visible = false;
      hoverBox.visible = false;
      window.setTimeout(function() {
        syncCanvasHtmlToDraft();
        refreshPageSections();
      }, 500);
    },

    updateStyle: function(prop, val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.style[prop] = val;
      inspector[prop] = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    updateAttribute: function(attr, val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      if (!val) {
        el.removeAttribute(attr);
      } else {
        el.setAttribute(attr, val);
      }
      inspector[attr] = val;
      syncCanvasHtmlToDraft();
    },

    updateClassAttribute: function(val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.className = val;
      inspector.className = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    toggleDaisyClass: function(cls) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.classList.toggle(cls);
      inspector.className = el.className;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    updateTextContent: function(val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.textContent = val;
      inspector.textContent = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    updateInspectorText: function(val) {
      updateTextContent(val);
    },

    refreshTree: function() {
      const root = getCanvasRoot();
      if (!root) { domTree = []; return; }
      const items = [];
      function walk(node, depth) {
        if (!node || node.nodeType !== 1) return;
        const tag = node.tagName.toLowerCase();
        if (tag === 'style' || tag === 'script') return;
        let icon = 'material-symbols-light:check-box-outline-blank';
        if (['h1','h2','h3','h4'].includes(tag)) icon = 'material-symbols-light:title';
        else if (tag === 'p') icon = 'material-symbols-light:notes';
        else if (tag === 'button' || tag === 'a') icon = 'material-symbols-light:smart-button';
        else if (['section','header','footer','main','nav'].includes(tag)) icon = 'material-symbols-light:view-agenda';
        else if (tag === 'input' || tag === 'select' || tag === 'textarea') icon = 'material-symbols-light:edit';
        else if (tag === 'img' || tag === 'svg') icon = 'material-symbols-light:image';
        
        items.push({
          el: node,
          tag: tag,
          classSummary: node.classList.length > 0 ? Array.from(node.classList).slice(0, 2).join('.') : '',
          depth: depth,
          icon: icon
        });
        Array.from(node.children).forEach(function(child) {
          walk(child, depth + 1);
        });
      }
      Array.from(root.children).forEach(function(child) {
        walk(child, 0);
      });
      domTree = items;
    },

    refreshPageSections: function() {
      const root = getCanvasRoot();
      if (!root) { pageSections = []; return; }
      const sections = [];
      Array.from(root.querySelectorAll('header, section, footer, main, [data-section]')).forEach(function(sec, idx) {
        sections.push({
          el: sec,
          tag: sec.tagName.toLowerCase(),
          name: sec.getAttribute('data-section') || (sec.id ? '#' + sec.id : sec.tagName.toLowerCase() + ' ' + (idx + 1)),
          classes: sec.className ? sec.className.substring(0, 30) : ''
        });
      });
      pageSections = sections;
    },

    syncCanvasHtmlToDraft: function() {
      const root = getCanvasRoot();
      if (root) {
        canvasHtmlDraft = root.innerHTML.trim();
      }
    },

    applyHtmlToCanvas: function() {
      const root = getCanvasRoot();
      if (!root) return;
      root.innerHTML = canvasHtmlDraft;
      selectedEl = null;
      selectedBox.visible = false;
      refreshTree();
      refreshPageSections();
    },

    formatCanvasHtml: function() {
      if (!canvasHtmlDraft) return;
      let formatted = '';
      let indent = '';
      const tab = '  ';
      canvasHtmlDraft.split(/>\s*</).forEach(function(element) {
        if (element.match(/^\/\w/)) {
          indent = indent.substring(tab.length);
        }
        formatted += indent + '<' + element + '>\r\n';
        if (element.match(/^<?\w[^>]*[^\/]$/) && !element.startsWith('input') && !element.startsWith('img') && !element.startsWith('br')) {
          indent += tab;
        }
      });
      canvasHtmlDraft = formatted.substring(1, formatted.length - 3);
    },

    copyCanvasHtml: function() {
      syncCanvasHtmlToDraft();
      navigator.clipboard.writeText(canvasHtmlDraft);
      copiedToast = true;
      window.setTimeout(function() { copiedToast = false; }, 2000);
    },

    generateFullExportHtml: function() {
      const root = getCanvasRoot();
      const bodyContent = root ? root.innerHTML.trim() : '';
      return '<' + '!DOCTYPE html>\n<html lang=\'en\' data-theme=\'dark\'>\n<head>\n  <meta charset=\'UTF-8\'>\n  <meta name=\'viewport\' content=\'width=device-width, initial-scale=1.0\'>\n  <title>Exported Page - Nexus-UX</title>\n  <!-- Tailwind CSS v4 & DaisyUI -->\n  <link href=\'https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css\' rel=\'stylesheet\' type=\'text/css\'>\n  <script src=\'https://cdn.tailwindcss.com\'></' + 'script>\n  <!-- Iconify Web Component -->\n  <script src=\'https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js\'></' + 'script>\n  <!-- Nexus-UX Reactive Runtime -->\n  <script type=\'module\' src=\'https://cdn.jsdelivr.net/npm/@nexus-ux/runtime@latest/dist/nexus-ux.min.js\'></' + 'script>\n</head>\n<body class=\'bg-base-100 text-base-content antialiased\'>\n' + bodyContent + '\n</body>\n</html>';
    },

    copyExportHtml: function() {
      const html = generateFullExportHtml();
      navigator.clipboard.writeText(html);
      copiedToast = true;
      window.setTimeout(function() { copiedToast = false; }, 2000);
    },

    downloadExportHtml: function() {
      const html = generateFullExportHtml();
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'nexus-page.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  }">

  <!-- 1. VvvebJs Far-Left Navigation Sidebar (.sidebar / small-nav) -->
  <aside class="flex flex-col shrink-0 border-r border-base-content/10 bg-base-200/90 backdrop-blur-md transition-all duration-200 z-30 select-none"
    data-class="{ 'w-48': sidebarExpanded, 'w-12': !sidebarExpanded }">
    
    <!-- Top Logo / Header -->
    <div class="h-9 flex items-center px-2.5 border-b border-base-content/10 overflow-hidden shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded bg-primary text-primary-content flex items-center justify-center font-bold text-xs shrink-0 shadow-sm">
          <iconify-icon icon="material-symbols-light:dashboard-customize" class="text-sm"></iconify-icon>
        </div>
        <span class="font-bold tracking-tight text-xs truncate" data-show="sidebarExpanded">VvvebJs</span>
      </div>
    </div>

    <!-- Vertical Icon Tabs -->
    <nav class="flex-1 flex flex-col py-1.5 gap-0.5 overflow-y-auto overflow-x-hidden">
      <!-- Pages Tab -->
      <button class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-left transition-colors relative mx-1"
        data-class="{ 'bg-primary text-primary-content shadow-sm font-semibold': activeSidebarTab === 'pages' && showLeftColumn, 'text-base-content/70 hover:bg-base-300 hover:text-base-content': activeSidebarTab !== 'pages' || !showLeftColumn }"
        data-on-click="activeSidebarTab = 'pages'; showLeftColumn = true"
        title="Pages & DOM Navigator">
        <iconify-icon icon="material-symbols-light:description-outline" class="text-lg shrink-0"></iconify-icon>
        <span class="truncate text-xs" data-show="sidebarExpanded">Pages</span>
      </button>

      <!-- Components Tab -->
      <button class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-left transition-colors relative mx-1"
        data-class="{ 'bg-primary text-primary-content shadow-sm font-semibold': activeSidebarTab === 'components' && showLeftColumn, 'text-base-content/70 hover:bg-base-300 hover:text-base-content': activeSidebarTab !== 'components' || !showLeftColumn }"
        data-on-click="activeSidebarTab = 'components'; showLeftColumn = true"
        title="Components & Blocks">
        <iconify-icon icon="material-symbols-light:view-in-ar" class="text-lg shrink-0"></iconify-icon>
        <span class="truncate text-xs" data-show="sidebarExpanded">Components</span>
      </button>

      <!-- Sections Tab -->
      <button class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-left transition-colors relative mx-1"
        data-class="{ 'bg-primary text-primary-content shadow-sm font-semibold': activeSidebarTab === 'sections' && showLeftColumn, 'text-base-content/70 hover:bg-base-300 hover:text-base-content': activeSidebarTab !== 'sections' || !showLeftColumn }"
        data-on-click="activeSidebarTab = 'sections'; showLeftColumn = true; refreshPageSections()"
        title="Sections & Page Sections">
        <iconify-icon icon="material-symbols-light:layers-outline" class="text-lg shrink-0"></iconify-icon>
        <span class="truncate text-xs" data-show="sidebarExpanded">Sections</span>
      </button>

      <!-- Style / Configuration Tab -->
      <button class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-left transition-colors relative mx-1"
        data-class="{ 'bg-primary text-primary-content shadow-sm font-semibold': activeSidebarTab === 'configuration' && showLeftColumn, 'text-base-content/70 hover:bg-base-300 hover:text-base-content': activeSidebarTab !== 'configuration' || !showLeftColumn }"
        data-on-click="activeSidebarTab = 'configuration'; showLeftColumn = true"
        title="Styles & Variables">
        <iconify-icon icon="material-symbols-light:palette-outline" class="text-lg shrink-0"></iconify-icon>
        <span class="truncate text-xs" data-show="sidebarExpanded">Style</span>
      </button>

      <!-- Properties Tab (opens right column) -->
      <button class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-left transition-colors relative mx-1"
        data-class="{ 'bg-primary text-primary-content shadow-sm font-semibold': showRightColumn, 'text-base-content/70 hover:bg-base-300 hover:text-base-content': !showRightColumn }"
        data-on-click="showRightColumn = !showRightColumn"
        title="Toggle Properties Panel">
        <iconify-icon icon="material-symbols-light:tune" class="text-lg shrink-0"></iconify-icon>
        <span class="truncate text-xs" data-show="sidebarExpanded">Properties</span>
      </button>
    </nav>
  </aside>

  <!-- 2. Main Builder Workspace (.main / #vvveb-builder) -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden relative">

    <!-- A. Authentic Top Control Bar (#top-panel) -->
    <div data-component="'/_pages/builder/_top-panel.html'"></div>

    <!-- B. Workspace Body: Left Column Drawer + Canvas Workspace + Right Column Inspector -->
    <div class="flex-1 flex min-h-0 overflow-hidden relative">
      
      <!-- Left Column Drawer (#left-panel) -->
      <div data-component="'/_pages/builder/_left-panel.html'"
        class="h-full shrink-0 border-r border-base-content/10 bg-base-100 transition-all duration-200 z-20"
        data-show="showLeftColumn">
      </div>

      <!-- Center Stage: Canvas Viewport + Docked Bottom Panel -->
      <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden relative bg-base-300/30" id="canvas-column">
        
        <!-- Canvas Workspace with device framing & overlays -->
        <div data-component="'/_pages/builder/_canvas.html'" class="flex-1 min-h-0 relative flex overflow-hidden [&>body]:w-full [&>body]:h-full [&>body]:flex [&>body]:flex-1 [&>body]:min-w-0 [&>body]:m-0 [&>body]:bg-transparent"></div>

        <!-- Docked Bottom Panel (#bottom-panel) -->
        <div data-component="'/_pages/builder/_bottom-panel.html'" class="shrink-0 z-30"></div>
      </div>

      <!-- Right Column Properties Inspector (#right-panel) -->
      <div data-component="'/_pages/builder/_right-panel.html'"
        class="h-full shrink-0 border-l border-base-content/10 bg-base-100 transition-all duration-200 z-20"
        data-show="showRightColumn">
      </div>

    </div>

  </div>

  <!-- 3. Modals & Popups (Export & Template Picker) -->
  <div data-component="'/_pages/builder/_modals.html'"></div>

</div>
