<head>
  <title>Visual Builder</title>
  <meta name="route" content="/builder">
  <meta name="icon" content="material-symbols-light:dashboard-customize-outline">
  <meta name="order" content="4">
  <meta name="category" content="Apps">
  <meta name="keywords" content="builder, visual editor, page builder, vvvebjs, drag and drop, daisyui, tailwind">
  <script src="/_pages/builder/builder-components.js"></script>
</head>

<div class="flex h-[calc(100dvh-5rem)] w-full select-none relative overflow-hidden bg-base-300/30 text-base-content font-sans antialiased text-xs"
  id="vvveb-builder-container"
  data-signal="{
    // Sidebar & Layout Toggles
    sidebarExpanded: false,
    showFileManager: true,
    showLeftColumn: true,
    showRightColumn: true,
    bottomPanelExpanded: false,
    activeSidebarTab: 'components',
    componentsSubTab: 'components',
    sectionsSubTab: 'sections',
    propertiesSubTab: 'content',
    styleState: '',
    designerMode: false,
    showHidden: false,
    showTreeList: true,

    // Viewport & Workspace State
    viewport: 'desktop',
    canvasTheme: 'light',
    zoom: 100,
    previewMode: false,
    currentDoc: '/_pages/builder/templates/landing.html',

    // Modals & Popups
    addSectionBoxOpen: false,
    addSectionMode: 'after',
    exportModalOpen: false,
    templateModalOpen: false,
    copiedToast: false,

    // Selection & Overlays
    hasSelection: false,
    selectedEl: null,
    hoveredEl: null,
    selectedBox: { visible: false, top: 0, left: 0, width: 0, height: 0, tag: '', id: '', isText: false },
    hoverBox: { visible: false, top: 0, left: 0, width: 0, height: 0, tag: '' },
    breadcrumbs: [],
    domTree: [],
    pageSections: [],
    canvasHtmlDraft: '',
    canvasCssDraft: '/* Custom Element Styles */\n',
    codeTab: 'html',
    runJsOnEdit: false,

    // Dynamic VvvebJs x Webstudio Inspector Model
    inspector: {
      tag: '',
      id: '',
      className: '',
      classList: [],
      newClassInput: '',
      componentType: 'element',
      isTextLeaf: false,
      textContent: '',
      fontSize: '',
      fontWeight: '',
      fontFamily: '',
      textAlign: '',
      color: '',
      backgroundColor: '',
      display: '',
      gap: '',
      padding: '',
      marginBottom: '',
      borderRadius: '',
      opacity: '1',
      href: '',
      src: '',
      alt: '',
      target: '',
      dataSignal: '',
      dataBind: '',
      dataShow: '',
      dataOnClick: '',
      dataFor: '',
      // VvvebJs-Aligned Dynamic Component Props
      props: {
        label: '',
        containerWidth: 'boxed',
        containerHeight: 'auto',
        bgMode: 'none',
        bgImage: '',
        bgVideo: '',
        bgYoutube: '',
        parallax: false,
        hasOverlay: false,
        overlayColor: 'rgba(0,0,0,0.6)',
        overlayOpacity: 0.6,
        hasTopSeparator: false,
        topSeparatorShape: 'wave',
        topSeparatorHeight: 48,
        hasBottomSeparator: false,
        bottomSeparatorShape: 'wave',
        bottomSeparatorHeight: 48,
        direction: 'row',
        verticalAlign: 'start',
        horizontalAlign: 'start',
        wrap: 'wrap',
        columns: [],
        svgIcon: 'star',
        svgWidth: 32,
        svgHeight: 32,
        svgStrokeWidth: 2,
        svgCode: '',
        imageAlign: 'center',
        imageRounded: 'none',
        imageFit: 'cover',
        hasLink: false,
        linkHref: '',
        linkTarget: '_self',
        buttonVariant: 'btn-primary',
        buttonSize: 'btn-md',
        buttonStyle: 'none',
        buttonShape: 'none',
        buttonDisabled: false,
        buttonActive: false,
        headingLevel: 'H2',
        cardBordered: false,
        cardCompact: false,
        cardSide: false,
        cardImageFull: false,
        badgeVariant: 'badge-primary',
        badgeSize: 'badge-md',
        badgeStyle: 'none',
        alertType: 'alert-info',
        alertStyle: 'none',
        collapseIcon: 'arrow',
        collapseOpen: false,
        tabsStyle: 'tabs-bordered',
        tabsSize: 'tabs-md',
        tabItems: [],
        inputType: 'text',
        inputPlaceholder: '',
        inputValue: '',
        inputName: '',
        inputSize: 'input-md',
        inputBordered: true,
        inputGhost: false,
        inputRequired: false,
        inputDisabled: false,
        tableZebra: false,
        tablePinRows: false,
        tablePinCols: false,
        tableSize: 'table-md'
      }
    },

    // Helper: Unwraps reactive proxies to raw native DOM nodes
    toRawNode: function(node) {
      if (!node) return null;
      let cur = node;
      while (cur && cur.__v_raw) {
        cur = cur.__v_raw;
      }
      return cur;
    },

    // Helper: Gets canvas shadow root
    getCanvasRoot: function() {
      const host = toRawNode(window.document.getElementById('builder-canvas-host'));
      return host && host.shadowRoot ? host.shadowRoot : null;
    },

    deselectElement: function() {
      selectedEl = null;
      hasSelection = false;
      selectedBox.visible = false;
      hoverBox.visible = false;
      breadcrumbs = [];
    },

    // Safe Attribute & Style Modifiers for Inspector
    setAttr: function(name, val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      if (val === '' || val === null || val === undefined) {
        el.removeAttribute(name);
      } else {
        el.setAttribute(name, val);
      }
      if (inspector[name] !== undefined) inspector[name] = val;
      syncCanvasHtmlToDraft();
    },

    setStyle: function(prop, val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.style[prop] = val;
      if (inspector[prop] !== undefined) inspector[prop] = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    getAttr: function(name) {
      const el = toRawNode(selectedEl);
      return el ? (el.getAttribute(name) || '') : '';
    },

    getStyle: function(prop) {
      const el = toRawNode(selectedEl);
      return el ? (el.style[prop] || '') : '';
    },

    setCanvasTheme: function(theme) {
      canvasTheme = theme;
      var host = toRawNode(window.document.getElementById('builder-canvas-host'));
      if (host) {
        host.setAttribute('data-theme', theme);
        var frame = host.closest('#canvas > div');
        if (frame) frame.setAttribute('data-theme', theme);
        if (host.shadowRoot) {
          var body = host.shadowRoot.querySelector('body') || host.shadowRoot.firstElementChild;
          if (body) {
            body.setAttribute('data-theme', theme);
            body.querySelectorAll('[data-theme]').forEach(function(el) { el.setAttribute('data-theme', theme); });
            if (['dark', 'synthwave', 'halloween', 'forest', 'black', 'luxury', 'dracula', 'business', 'night', 'coffee', 'dim', 'sunset', 'cyberpunk'].includes(theme)) {
              body.classList.add('dark');
            } else {
              body.classList.remove('dark');
            }
            body.style.backgroundColor = '';
            body.style.color = '';
          }
        }
      }
      updateSelectedBox();
    },

    toggleCanvasTheme: function() {
      var nextTheme = canvasTheme === 'dark' ? 'light' : 'dark';
      setCanvasTheme(nextTheme);
    },

    updateTextContent: function(val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.textContent = val;
      inspector.textContent = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    updateInspectorText: function(val) {
      updateTextContent(val);
    },

    updateClassAttribute: function(val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.className = val;
      inspector.className = val;
      inspector.classList = val.split(/\s+/).filter(Boolean);
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    toggleDaisyClass: function(cls) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.classList.toggle(cls);
      inspector.className = el.className;
      inspector.classList = el.className.split(/\s+/).filter(Boolean);
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    changeTag: function(newTag) {
      var el = toRawNode(selectedEl);
      if (!el || !el.parentNode) return;
      var replacement = el.ownerDocument.createElement(newTag);
      replacement.innerHTML = el.innerHTML;
      for (var a of el.attributes) {
        replacement.setAttribute(a.name, a.value);
      }
      el.parentNode.replaceChild(replacement, el);
      selectElement(replacement);
      syncCanvasHtmlToDraft();
      refreshTree();
    },

    // VvvebJs Dynamic Component Mutation Helpers
    setCompClass: function(validClasses, newClass) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      if (Array.isArray(validClasses)) {
        validClasses.forEach(function(c) { if (c) el.classList.remove(c); });
      }
      if (newClass && newClass !== 'none') {
        newClass.split(/\s+/).forEach(function(c) { if (c) el.classList.add(c); });
      }
      inspector.className = el.className;
      inspector.classList = el.className.split(/\s+/).filter(Boolean);
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    setCompAttr: function(attr, value) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      if (value === null || value === '' || value === false) {
        el.removeAttribute(attr);
      } else {
        el.setAttribute(attr, value === true ? '' : value);
      }
      if (inspector[attr] !== undefined) inspector[attr] = value;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    addClass: function(cls) {
      const el = toRawNode(selectedEl);
      if (!el || !cls || !cls.trim()) return;
      cls.trim().split(/\s+/).forEach(function(c) { if (c) el.classList.add(c); });
      inspector.className = el.className;
      inspector.classList = el.className.split(/\s+/).filter(Boolean);
      inspector.newClassInput = '';
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    removeClass: function(cls) {
      const el = toRawNode(selectedEl);
      if (!el || !cls) return;
      el.classList.remove(cls);
      inspector.className = el.className;
      inspector.classList = el.className.split(/\s+/).filter(Boolean);
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    addColumnToRow: function() {
      const el = toRawNode(selectedEl);
      if (!el) return;
      const col = el.ownerDocument.createElement('div');
      col.className = 'col-12 col-md-6 p-4';
      const h3 = el.ownerDocument.createElement('h3');
      h3.className = 'text-xl font-bold mb-2';
      h3.textContent = 'New Column';
      const p = el.ownerDocument.createElement('p');
      p.className = 'text-sm opacity-70';
      p.textContent = 'Column content goes here.';
      col.appendChild(h3);
      col.appendChild(p);
      el.appendChild(col);
      selectElement(el);
      syncCanvasHtmlToDraft();
    },

    removeColumn: function(index) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      const cols = el.querySelectorAll(':scope > .col, :scope > [class*=col-]');
      if (cols[index]) {
        cols[index].remove();
        selectElement(el);
        syncCanvasHtmlToDraft();
      }
    },

    setColumnSpan: function(colIdx, bp, span) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      const cols = el.querySelectorAll(':scope > .col, :scope > [class*=col-]');
      const col = cols[colIdx];
      if (!col) return;
      const prefix = bp === 'xs' ? 'col-' : ('col-' + bp + '-');
      const classes = col.className.split(/\s+/).filter(function(c) {
        return !c.startsWith(prefix) && (bp !== 'xs' || c !== 'col');
      });
      if (span && span !== 'none') {
        classes.push(bp === 'xs' ? ('col-' + span) : ('col-' + bp + '-' + span));
      }
      col.className = classes.join(' ');
      selectElement(el);
      syncCanvasHtmlToDraft();
    },

    setSectionBackground: function(mode) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      inspector.props.bgMode = mode;
      let bgContainer = el.querySelector(':scope > .background-container');
      if (mode === 'none') {
        if (bgContainer) bgContainer.remove();
      } else {
        if (!bgContainer) {
          bgContainer = el.ownerDocument.createElement('div');
          bgContainer.className = 'background-container absolute inset-0 -z-10 overflow-hidden pointer-events-none';
          el.classList.add('relative');
          el.insertBefore(bgContainer, el.firstChild);
        }
        bgContainer.innerHTML = '';
        if (mode === 'image') {
          const img = el.ownerDocument.createElement('img');
          img.src = inspector.props.bgImage || 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=1600&q=80';
          img.className = 'w-full h-full object-cover';
          bgContainer.appendChild(img);
        } else if (mode === 'video') {
          const vid = el.ownerDocument.createElement('video');
          vid.autoplay = true; vid.loop = true; vid.muted = true; vid.playsInline = true;
          vid.className = 'w-full h-full object-cover';
          vid.src = inspector.props.bgVideo || 'https://www.w3schools.com/html/mov_bbb.mp4';
          bgContainer.appendChild(vid);
        } else if (mode === 'youtube') {
          const iframe = el.ownerDocument.createElement('iframe');
          iframe.className = 'w-full h-full pointer-events-none';
          iframe.src = 'https://www.youtube.com/embed/' + (inspector.props.bgYoutube || 'C6fOoy7Se_4') + '?autoplay=1&mute=1&controls=0&loop=1';
          iframe.setAttribute('frameborder', '0');
          bgContainer.appendChild(iframe);
        }
      }
      syncCanvasHtmlToDraft();
    },

    toggleSectionOverlay: function(enabled) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      inspector.props.hasOverlay = enabled;
      let overlay = el.querySelector(':scope > .section-overlay');
      if (enabled) {
        if (!overlay) {
          overlay = el.ownerDocument.createElement('div');
          overlay.className = 'section-overlay absolute inset-0 -z-5 pointer-events-none';
          overlay.style.backgroundColor = inspector.props.overlayColor || 'rgba(0,0,0,0.6)';
          el.classList.add('relative');
          el.insertBefore(overlay, el.firstChild);
        }
      } else {
        if (overlay) overlay.remove();
      }
      syncCanvasHtmlToDraft();
    },

    toggleSectionSeparator: function(pos, enabled) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      const sel = ':scope > .separator.' + pos;
      let sep = el.querySelector(sel);
      if (enabled) {
        if (!sep) {
          sep = el.ownerDocument.createElement('div');
          sep.className = 'separator ' + pos + ' absolute ' + (pos === 'top' ? 'top-0' : 'bottom-0') + ' left-0 right-0 w-full overflow-hidden leading-none pointer-events-none -z-5';
          const svg = el.ownerDocument.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', '0 0 1200 120');
          svg.setAttribute('preserveAspectRatio', 'none');
          svg.setAttribute('class', 'w-full h-12 fill-base-100');
          const path = el.ownerDocument.createElementNS('http://www.w3.org/2000/svg', 'path');
          const yEnd = pos === 'top' ? '0' : '120';
          path.setAttribute('d', 'M0,0 C150,90 350,-40 500,60 C650,160 900,10 1200,40 L1200,' + yEnd + ' L0,' + yEnd + ' Z');
          svg.appendChild(path);
          sep.appendChild(svg);
          el.classList.add('relative');
          el.appendChild(sep);
        }
      } else {
        if (sep) sep.remove();
      }
      syncCanvasHtmlToDraft();
    },

    setSvgIcon: function(iconName) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      inspector.props.svgIcon = iconName;
      const iconShapes = {
        star: { tag: 'polygon', attrs: { points: '12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2' } },
        heart: { tag: 'path', attrs: { d: 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z' } },
        check: { tag: 'polyline', attrs: { points: '20 6 9 17 4 12' } },
        arrowRight: { tag: 'path', attrs: { d: 'M5 12h14M12 5l7 7-7 7' } },
        home: { tag: 'path', attrs: { d: 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' } },
        user: { tag: 'path', attrs: { d: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' } },
        settings: { tag: 'circle', attrs: { cx: '12', cy: '12', r: '3' } }
      };
      if (iconShapes[iconName]) {
        while (el.firstChild) el.removeChild(el.firstChild);
        const item = iconShapes[iconName];
        const sub = el.ownerDocument.createElementNS('http://www.w3.org/2000/svg', item.tag);
        for (const k in item.attrs) sub.setAttribute(k, item.attrs[k]);
        el.appendChild(sub);
        el.setAttribute('viewBox', '0 0 24 24');
        el.setAttribute('fill', 'none');
        el.setAttribute('stroke', 'currentColor');
        el.setAttribute('stroke-width', inspector.props.svgStrokeWidth || '2');
        inspector.props.svgCode = el.outerHTML;
        syncCanvasHtmlToDraft();
      }
    },

    toggleElementLink: function(enabled) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      if (enabled) {
        if (el.parentNode && el.parentNode.tagName.toLowerCase() !== 'a') {
          const a = el.ownerDocument.createElement('a');
          a.href = '#';
          el.parentNode.insertBefore(a, el);
          a.appendChild(el);
          inspector.props.hasLink = true;
          inspector.props.linkHref = '#';
        }
      } else {
        if (el.parentNode && el.parentNode.tagName.toLowerCase() === 'a') {
          const a = el.parentNode;
          a.parentNode.insertBefore(el, a);
          a.remove();
          inspector.props.hasLink = false;
        }
      }
      syncCanvasHtmlToDraft();
    },

    // Selection Logic & Component Matching
    selectElement: function(el) {
      const raw = toRawNode(el);
      if (!raw || raw.nodeType !== 1) {
        selectedEl = null;
        hasSelection = false;
        selectedBox.visible = false;
        breadcrumbs = [];
        return;
      }
      selectedEl = raw;
      hasSelection = true;
      const tag = raw.tagName.toLowerCase();
      inspector.tag = raw.tagName.toUpperCase();
      inspector.id = raw.id || '';
      inspector.className = raw.className || '';
      inspector.classList = raw.className ? raw.className.split(/\s+/).filter(Boolean) : [];
      inspector.isTextLeaf = (raw.children.length === 0 && raw.textContent.trim().length > 0);
      inspector.textContent = raw.textContent || '';
      
      const rawClasses = inspector.classList;

      // 1. Dynamic Component Archetype Detection
      let compType = 'element';
      if (['section', 'header', 'footer', 'main'].includes(tag) || rawClasses.includes('hero') || raw.getAttribute('data-section')) {
        compType = 'section';
      } else if (rawClasses.includes('row') || rawClasses.includes('grid-row') || raw.getAttribute('data-grid-row')) {
        compType = 'gridrow';
      } else if (tag === 'svg' || rawClasses.includes('svg-image') || rawClasses.includes('separator')) {
        compType = 'svgimage';
      } else if (tag === 'img' || (tag === 'figure' && raw.querySelector('img'))) {
        compType = 'image';
      } else if (tag === 'button' || rawClasses.includes('btn') || (tag === 'a' && rawClasses.includes('btn'))) {
        compType = 'button';
      } else if (['h1', 'h2', 'h3', 'h4', 'h5', 'h6'].includes(tag)) {
        compType = 'heading';
      } else if (rawClasses.includes('card')) {
        compType = 'card';
      } else if (rawClasses.includes('badge')) {
        compType = 'badge';
      } else if (rawClasses.includes('alert')) {
        compType = 'alert';
      } else if (rawClasses.includes('collapse') || tag === 'details') {
        compType = 'collapse';
      } else if (rawClasses.includes('tabs') || raw.getAttribute('role') === 'tablist') {
        compType = 'tabs';
      } else if (['input', 'textarea'].includes(tag)) {
        compType = 'input';
      } else if (tag === 'select') {
        compType = 'select';
      } else if (tag === 'form') {
        compType = 'form';
      } else if (tag === 'table' || rawClasses.includes('table')) {
        compType = 'table';
      } else if (tag === 'a') {
        compType = 'link';
      } else if (['p', 'span', 'blockquote', 'code', 'kbd', 'li'].includes(tag) || (raw.children.length === 0 && raw.textContent.trim().length > 0)) {
        compType = 'text';
      }
      inspector.componentType = compType;

      // 2. Populate Archetype Specific Props
      const p = inspector.props;
      if (compType === 'section') {
        p.label = raw.getAttribute('aria-label') || raw.id || '';
        p.containerWidth = rawClasses.includes('w-full') || raw.querySelector(':scope > .container-fluid, :scope > .w-full') ? 'full' : 'boxed';
        p.containerHeight = rawClasses.includes('min-h-screen') || rawClasses.includes('vh-100') ? 'full' : 'auto';
        p.hasOverlay = !!raw.querySelector(':scope > .section-overlay, :scope > .overlay');
        p.hasTopSeparator = !!raw.querySelector(':scope > .separator.top');
        p.hasBottomSeparator = !!raw.querySelector(':scope > .separator.bottom');
        const bgCont = raw.querySelector(':scope > .background-container');
        if (bgCont) {
          if (bgCont.querySelector('video')) p.bgMode = 'video';
          else if (bgCont.querySelector('iframe')) p.bgMode = 'youtube';
          else if (bgCont.querySelector('img')) p.bgMode = 'image';
        } else {
          p.bgMode = 'none';
        }
      } else if (compType === 'gridrow') {
        p.direction = rawClasses.includes('flex-col-reverse') ? 'col-reverse' : (rawClasses.includes('flex-col') ? 'col' : (rawClasses.includes('flex-row-reverse') ? 'row-reverse' : 'row'));
        p.verticalAlign = rawClasses.includes('items-center') ? 'center' : (rawClasses.includes('items-end') ? 'end' : (rawClasses.includes('items-stretch') ? 'stretch' : 'start'));
        p.horizontalAlign = rawClasses.includes('justify-center') ? 'center' : (rawClasses.includes('justify-end') ? 'end' : (rawClasses.includes('justify-between') ? 'between' : 'start'));
        p.wrap = rawClasses.includes('flex-nowrap') ? 'nowrap' : 'wrap';
        // Scan columns
        const cols = [];
        raw.querySelectorAll(':scope > .col, :scope > [class*=col-]').forEach(function(col, i) {
          const cCls = col.className;
          const xsM = cCls.match(/\bcol-(\d+)\b/);
          const smM = cCls.match(/\bcol-sm-(\d+)\b/);
          const mdM = cCls.match(/\bcol-md-(\d+)\b/);
          const lgM = cCls.match(/\bcol-lg-(\d+)\b/);
          const xlM = cCls.match(/\bcol-xl-(\d+)\b/);
          cols.push({
            index: i,
            name: 'Column ' + (i + 1),
            xs: xsM ? xsM[1] : (cCls.includes('col') ? '12' : 'none'),
            sm: smM ? smM[1] : 'none',
            md: mdM ? mdM[1] : 'none',
            lg: lgM ? lgM[1] : 'none',
            xl: xlM ? xlM[1] : 'none'
          });
        });
        p.columns = cols;
      } else if (compType === 'svgimage') {
        p.svgWidth = raw.getAttribute('width') || 32;
        p.svgHeight = raw.getAttribute('height') || 32;
        p.svgStrokeWidth = raw.getAttribute('stroke-width') || 2;
        p.svgCode = raw.outerHTML;
      } else if (compType === 'image') {
        p.hasLink = !!(raw.parentNode && raw.parentNode.tagName.toLowerCase() === 'a');
        p.linkHref = p.hasLink ? raw.parentNode.getAttribute('href') || '' : '';
        p.imageAlign = rawClasses.includes('mx-auto') ? 'center' : (rawClasses.includes('float-right') ? 'right' : 'left');
        p.imageRounded = rawClasses.includes('rounded-full') ? 'rounded-full' : (rawClasses.includes('rounded-box') || rawClasses.includes('rounded-2xl') ? 'rounded-box' : 'none');
      } else if (compType === 'button') {
        p.buttonVariant = ['btn-primary', 'btn-secondary', 'btn-accent', 'btn-neutral', 'btn-info', 'btn-success', 'btn-warning', 'btn-error', 'btn-ghost', 'btn-link'].find(function(v) { return rawClasses.includes(v); }) || 'btn-primary';
        p.buttonSize = ['btn-xs', 'btn-sm', 'btn-md', 'btn-lg', 'btn-xl'].find(function(s) { return rawClasses.includes(s); }) || 'btn-md';
        p.buttonStyle = ['btn-outline', 'btn-soft', 'btn-dash', 'glass'].find(function(st) { return rawClasses.includes(st); }) || 'none';
        p.buttonShape = ['btn-wide', 'btn-block', 'btn-circle', 'btn-square'].find(function(sh) { return rawClasses.includes(sh); }) || 'none';
        p.buttonDisabled = raw.hasAttribute('disabled') || rawClasses.includes('btn-disabled');
        p.buttonActive = rawClasses.includes('btn-active');
        p.hasLink = tag === 'a';
        p.linkHref = raw.getAttribute('href') || '';
        p.linkTarget = raw.getAttribute('target') || '_self';
      } else if (compType === 'heading') {
        p.headingLevel = tag.toUpperCase();
      } else if (compType === 'card') {
        p.cardBordered = rawClasses.includes('card-bordered') || rawClasses.includes('border');
        p.cardCompact = rawClasses.includes('card-compact');
        p.cardSide = rawClasses.includes('card-side');
        p.cardImageFull = rawClasses.includes('image-full');
      } else if (compType === 'badge') {
        p.badgeVariant = ['badge-primary', 'badge-secondary', 'badge-accent', 'badge-neutral', 'badge-info', 'badge-success', 'badge-warning', 'badge-error', 'badge-ghost'].find(function(v) { return rawClasses.includes(v); }) || 'badge-primary';
        p.badgeSize = ['badge-xs', 'badge-sm', 'badge-md', 'badge-lg', 'badge-xl'].find(function(s) { return rawClasses.includes(s); }) || 'badge-md';
        p.badgeStyle = ['badge-outline', 'badge-soft', 'badge-dash'].find(function(st) { return rawClasses.includes(st); }) || 'none';
      } else if (compType === 'alert') {
        p.alertType = ['alert-info', 'alert-success', 'alert-warning', 'alert-error'].find(function(t) { return rawClasses.includes(t); }) || 'alert-info';
        p.alertStyle = ['alert-soft', 'alert-dash', 'alert-outline'].find(function(st) { return rawClasses.includes(st); }) || 'none';
      } else if (compType === 'collapse') {
        p.collapseIcon = rawClasses.includes('collapse-plus') ? 'plus' : (rawClasses.includes('collapse-arrow') ? 'arrow' : 'none');
        p.collapseOpen = rawClasses.includes('collapse-open') || raw.hasAttribute('open');
      } else if (compType === 'tabs') {
        p.tabsStyle = rawClasses.includes('tabs-lifted') ? 'tabs-lifted' : (rawClasses.includes('tabs-box') ? 'tabs-box' : 'tabs-bordered');
        p.tabsSize = ['tabs-xs', 'tabs-sm', 'tabs-md', 'tabs-lg'].find(function(s) { return rawClasses.includes(s); }) || 'tabs-md';
      } else if (compType === 'input') {
        p.inputType = raw.getAttribute('type') || 'text';
        p.inputPlaceholder = raw.getAttribute('placeholder') || '';
        p.inputValue = raw.value || raw.getAttribute('value') || '';
        p.inputRequired = raw.hasAttribute('required');
        p.inputDisabled = raw.hasAttribute('disabled');
      } else if (compType === 'table') {
        p.tableZebra = rawClasses.includes('table-zebra');
        p.tablePinRows = rawClasses.includes('table-pin-rows');
        p.tablePinCols = rawClasses.includes('table-pin-cols');
        p.tableSize = ['table-xs', 'table-sm', 'table-md', 'table-lg'].find(function(s) { return rawClasses.includes(s); }) || 'table-md';
      }
      
      try {
        var compStyle = window.getComputedStyle(raw);
        inspector.fontSize = raw.style.fontSize || (compStyle ? compStyle.fontSize : '');
        inspector.fontWeight = raw.style.fontWeight || (compStyle ? compStyle.fontWeight : '');
        inspector.fontFamily = raw.style.fontFamily || (compStyle ? compStyle.fontFamily : '');
        inspector.textAlign = raw.style.textAlign || (compStyle ? compStyle.textAlign : '');
        inspector.color = raw.style.color || (compStyle ? compStyle.color : '');
        inspector.backgroundColor = raw.style.backgroundColor || (compStyle ? compStyle.backgroundColor : '');
        inspector.display = raw.style.display || (compStyle ? compStyle.display : '');
        inspector.gap = raw.style.gap || (compStyle ? compStyle.gap : '');
        inspector.padding = raw.style.padding || (compStyle ? compStyle.padding : '');
        inspector.marginBottom = raw.style.marginBottom || (compStyle ? compStyle.marginBottom : '');
        inspector.borderRadius = raw.style.borderRadius || (compStyle ? compStyle.borderRadius : '');
        inspector.opacity = raw.style.opacity || (compStyle ? compStyle.opacity : '1');
      } catch (_) {}

      try {
        inspector.href = raw.getAttribute('href') || '';
        inspector.src = raw.getAttribute('src') || '';
        inspector.alt = raw.getAttribute('alt') || '';
        inspector.target = raw.getAttribute('target') || '';

        inspector.dataSignal = raw.getAttribute('data-signal') || '';
        inspector.dataBind = raw.getAttribute('data-bind') || '';
        inspector.dataShow = raw.getAttribute('data-show') || '';
        inspector.dataOnClick = raw.getAttribute('data-on-click') || '';
        inspector.dataFor = raw.getAttribute('data-for') || '';
      } catch (_) {}

      // Build breadcrumbs
      const crumbs = [];
      let cur = raw;
      while (cur && cur.nodeType === 1 && cur.tagName.toLowerCase() !== 'html') {
        const rawCur = toRawNode(cur);
        crumbs.unshift({ tag: rawCur.tagName.toLowerCase(), el: rawCur });
        cur = rawCur.parentElement;
      }
      breadcrumbs = crumbs;

      updateSelectedBox();
      syncCanvasHtmlToDraft();
      if (!domTree || domTree.length === 0) {
        refreshTree();
      }
    },

    updateSelectedBox: function() {
      var el = toRawNode(selectedEl);
      if (!el || previewMode) {
        selectedBox.visible = false;
        hasSelection = false;
        return;
      }
      var host = toRawNode(window.document.getElementById('builder-canvas-host'));
      if (!host) return;
      try {
        var elRect = el.getBoundingClientRect();
        var hostRect = host.getBoundingClientRect();

        selectedBox.top = (elRect.top - hostRect.top) + host.offsetTop;
        selectedBox.left = (elRect.left - hostRect.left) + host.offsetLeft;
        selectedBox.width = elRect.width;
        selectedBox.height = elRect.height;
        var tag = el.tagName.toLowerCase();
        selectedBox.tag = tag;
        selectedBox.id = el.id || '';
        selectedBox.isText = ['h1','h2','h3','h4','h5','h6','p','span','a','button','label','li','blockquote','td','th'].includes(tag);
        selectedBox.visible = true;
        hasSelection = true;
      } catch (_) {}
    },

    updateHoverBox: function(el) {
      var raw = toRawNode(el);
      if (!raw || raw.nodeType !== 1 || previewMode || (selectedEl && raw === toRawNode(selectedEl))) {
        hoverBox.visible = false;
        hoveredEl = null;
        return;
      }
      hoveredEl = raw;
      var host = toRawNode(window.document.getElementById('builder-canvas-host'));
      if (!host) return;
      try {
        var elRect = raw.getBoundingClientRect();
        var hostRect = host.getBoundingClientRect();

        hoverBox.top = (elRect.top - hostRect.top) + host.offsetTop;
        hoverBox.left = (elRect.left - hostRect.left) + host.offsetLeft;
        hoverBox.width = elRect.width;
        hoverBox.height = elRect.height;
        hoverBox.tag = raw.tagName.toLowerCase();
        hoverBox.visible = true;
      } catch (_) {}
    },

    selectParent: function() {
      const el = toRawNode(selectedEl);
      if (!el) return;
      const parent = toRawNode(el.parentElement);
      if (parent && parent.nodeType === 1) {
        selectElement(parent);
      }
    },

    duplicateElement: function() {
      const el = toRawNode(selectedEl);
      if (!el || !el.parentElement) return;
      const clone = el.cloneNode(true);
      el.parentElement.insertBefore(clone, el.nextSibling);
      selectElement(clone);
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    deleteElement: function() {
      const el = toRawNode(selectedEl);
      if (!el) return;
      const parent = toRawNode(el.parentElement);
      el.remove();
      selectedEl = null;
      selectedBox.visible = false;
      if (parent && parent.nodeType === 1) {
        selectElement(parent);
      }
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    deleteSelected: function() {
      deleteElement();
    },

    moveElementUp: function() {
      const el = toRawNode(selectedEl);
      if (!el || !el.previousElementSibling) return;
      el.parentElement.insertBefore(el, el.previousElementSibling);
      updateSelectedBox();
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    moveElementDown: function() {
      const el = toRawNode(selectedEl);
      if (!el || !el.nextElementSibling) return;
      el.parentElement.insertBefore(el.nextElementSibling, el);
      updateSelectedBox();
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    // WYSIWYG In-Canvas Inline Formatting
    formatInline: function(command, value) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      if (command === 'bold') {
        el.style.fontWeight = (el.style.fontWeight === 'bold' || el.style.fontWeight >= '700') ? 'normal' : 'bold';
      } else if (command === 'italic') {
        el.style.fontStyle = (el.style.fontStyle === 'italic') ? 'normal' : 'italic';
      } else if (command === 'underline') {
        el.style.textDecoration = (el.style.textDecoration.includes('underline')) ? 'none' : 'underline';
      } else if (command === 'strike') {
        el.style.textDecoration = (el.style.textDecoration.includes('line-through')) ? 'none' : 'line-through';
      } else if (command === 'align') {
        el.style.textAlign = value;
      } else if (command === 'color') {
        el.style.color = value;
      } else if (command === 'bgColor') {
        el.style.backgroundColor = value;
      } else if (command === 'fontSize') {
        el.style.fontSize = value;
      } else if (command === 'fontFamily') {
        el.style.fontFamily = value;
      }
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    insertSnippet: function(templateId) {
      var root = getCanvasRoot();
      if (!root) return;

      var newEl = null;
      var tpl = toRawNode(window.document.getElementById(templateId));
      if (tpl && tpl.content) {
        var clone = tpl.content.cloneNode(true);
        newEl = clone.firstElementChild;
      } else if (typeof templateId === 'string' && templateId.startsWith('<')) {
        var temp = document.createElement('div');
        temp.innerHTML = templateId.trim();
        newEl = temp.firstElementChild;
      }
      if (!newEl) return;

      var activeEl = toRawNode(selectedEl);
      if (activeEl && activeEl.parentElement) {
        if (addSectionMode === 'inside' || activeEl.children.length > 0 || ['div', 'section', 'main', 'article', 'aside', 'header', 'footer'].includes(activeEl.tagName.toLowerCase())) {
          activeEl.appendChild(newEl);
        } else {
          activeEl.parentElement.insertBefore(newEl, activeEl.nextSibling);
        }
      } else {
        var containerEl = root.querySelector('div, main, section') || root;
        containerEl.appendChild(newEl);
      }

      addSectionBoxOpen = false;
      selectElement(newEl);
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    clearCanvas: function() {
      const root = getCanvasRoot();
      if (!root) return;
      root.innerHTML = '<div class=\'min-h-screen bg-base-100 text-base-content p-8 flex flex-col items-center justify-center\'><div class=\'max-w-md w-full p-8 border-2 border-dashed border-base-content/20 rounded-2xl text-center\'><h3 class=\'font-bold text-lg mb-1\'>Clean Canvas</h3><p class=\'text-xs text-base-content/60 mb-3\'>Select blocks from the left library to start building.</p></div></div>';
      selectedEl = null;
      selectedBox.visible = false;
      syncCanvasHtmlToDraft();
      refreshPageSections();
    },

    loadTemplate: function(path) {
      currentDoc = path;
    },

    updateStyle: function(prop, val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.style[prop] = val;
      inspector[prop] = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    updateAttribute: function(attr, val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      if (!val) {
        el.removeAttribute(attr);
      } else {
        el.setAttribute(attr, val);
      }
      inspector[attr] = val;
      syncCanvasHtmlToDraft();
    },

    updateClassAttribute: function(val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.className = val;
      inspector.className = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    toggleDaisyClass: function(cls) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.classList.toggle(cls);
      inspector.className = el.className;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    updateTextContent: function(val) {
      const el = toRawNode(selectedEl);
      if (!el) return;
      el.textContent = val;
      inspector.textContent = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    updateInspectorText: function(val) {
      updateTextContent(val);
    },

    refreshTree: function() {
      const root = getCanvasRoot();
      if (!root) { domTree = []; return; }
      const items = [];
      function walk(node, depth) {
        if (!node || node.nodeType !== 1) return;
        const tag = node.tagName.toLowerCase();
        if (tag === 'style' || tag === 'script') return;
        let icon = 'material-symbols-light:check-box-outline-blank';
        if (['h1','h2','h3','h4'].includes(tag)) icon = 'material-symbols-light:title';
        else if (tag === 'p') icon = 'material-symbols-light:notes';
        else if (tag === 'button' || tag === 'a') icon = 'material-symbols-light:smart-button';
        else if (['section','header','footer','main','nav'].includes(tag)) icon = 'material-symbols-light:view-agenda';
        else if (tag === 'input' || tag === 'select' || tag === 'textarea') icon = 'material-symbols-light:edit';
        else if (tag === 'img' || tag === 'svg') icon = 'material-symbols-light:image';
        
        items.push({
          el: node,
          tag: tag,
          classSummary: node.classList.length > 0 ? Array.from(node.classList).slice(0, 2).join('.') : '',
          depth: depth,
          icon: icon
        });
        Array.from(node.children).forEach(function(child) {
          walk(child, depth + 1);
        });
      }
      Array.from(root.children).forEach(function(child) {
        walk(child, 0);
      });
      domTree = items;
    },

    refreshPageSections: function() {
      const root = getCanvasRoot();
      if (!root) { pageSections = []; return; }
      const sections = [];
      Array.from(root.querySelectorAll('header, section, footer, main, [data-section]')).forEach(function(sec, idx) {
        sections.push({
          el: sec,
          tag: sec.tagName.toLowerCase(),
          name: sec.getAttribute('data-section') || (sec.id ? '#' + sec.id : sec.tagName.toLowerCase() + ' ' + (idx + 1)),
          classes: sec.className ? sec.className.substring(0, 30) : ''
        });
      });
      pageSections = sections;
    },

    syncCanvasHtmlToDraft: function() {
      const root = getCanvasRoot();
      if (root) {
        canvasHtmlDraft = root.innerHTML.trim();
      }
    },

    applyHtmlToCanvas: function() {
      const root = getCanvasRoot();
      if (!root) return;
      root.innerHTML = canvasHtmlDraft;
      selectedEl = null;
      selectedBox.visible = false;
      refreshTree();
      refreshPageSections();
    },

    formatCanvasHtml: function() {
      if (!canvasHtmlDraft) return;
      let formatted = '';
      let indent = '';
      const tab = '  ';
      canvasHtmlDraft.split(/>\s*</).forEach(function(element) {
        if (element.match(/^\/\w/)) {
          indent = indent.substring(tab.length);
        }
        formatted += indent + '<' + element + '>\r\n';
        if (element.match(/^<?\w[^>]*[^\/]$/) && !element.startsWith('input') && !element.startsWith('img') && !element.startsWith('br')) {
          indent += tab;
        }
      });
      canvasHtmlDraft = formatted.substring(1, formatted.length - 3);
    },

    copyCanvasHtml: function() {
      syncCanvasHtmlToDraft();
      navigator.clipboard.writeText(canvasHtmlDraft);
      copiedToast = true;
      window.setTimeout(function() { copiedToast = false; }, 2000);
    },

    generateFullExportHtml: function() {
      const root = getCanvasRoot();
      const bodyContent = root ? root.innerHTML.trim() : '';
      return '<' + '!DOCTYPE html>\n<html lang=\'en\' data-theme=\'dark\'>\n<head>\n  <meta charset=\'UTF-8\'>\n  <meta name=\'viewport\' content=\'width=device-width, initial-scale=1.0\'>\n  <title>Exported Page - Nexus-UX</title>\n  <!-- Tailwind CSS v4 & DaisyUI -->\n  <link href=\'https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css\' rel=\'stylesheet\' type=\'text/css\'>\n  <script src=\'https://cdn.tailwindcss.com\'></' + 'script>\n  <!-- Iconify Web Component -->\n  <script src=\'https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js\'></' + 'script>\n  <!-- Nexus-UX Reactive Runtime -->\n  <script type=\'module\' src=\'https://cdn.jsdelivr.net/npm/@nexus-ux/runtime@latest/dist/nexus-ux.min.js\'></' + 'script>\n</head>\n<body class=\'bg-base-100 text-base-content antialiased\'>\n' + bodyContent + '\n</body>\n</html>';
    },

    copyExportHtml: function() {
      const html = generateFullExportHtml();
      navigator.clipboard.writeText(html);
      copiedToast = true;
      window.setTimeout(function() { copiedToast = false; }, 2000);
    },

    // Save State & Local Draft Persistence
    saveStatus: 'idle',
    saveCanvasDraft: function() {
      syncCanvasHtmlToDraft();
      try {
        window.localStorage.setItem('nexus_builder_draft', canvasHtmlDraft || '');
      } catch (_) {}
      saveStatus = 'saved';
      window.setTimeout(function() { saveStatus = 'idle'; }, 1800);
    },

    // Accordion State & Embedded Tabs
    accordions: {
      files: true,
      navigation: true,
      components: true,
      themes: true
    },
    accordionTabs: {
      navigation: 'tree',
      components: 'components',
      themes: 'themes'
    },
    accordionHeights: {
      files: 160,
      navigation: 250,
      components: 380,
      themes: 200
    },
    componentCategory: 'all',
    componentSearch: '',
    filesSearch: '',

    toggleAccordion: function(name) {
      accordions[name] = !accordions[name];
    },
    setAccordionTab: function(acc, tab) {
      accordionTabs[acc] = tab;
      if (!accordions[acc]) accordions[acc] = true;
    },
    startAccordionResize: function(name, e, direction) {
      e.preventDefault();
      const startY = e.clientY;
      const startHeight = accordionHeights[name] || 200;
      window.document.body.style.userSelect = 'none';
      window.document.body.style.cursor = 'row-resize';
      const onMove = (ev) => {
        const delta = (direction === 'top') ? (startY - ev.clientY) : (ev.clientY - startY);
        accordionHeights[name] = Math.max(80, Math.min(650, startHeight + delta));
      };
      const onUp = () => {
        window.document.body.style.userSelect = '';
        window.document.body.style.cursor = '';
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    },

    downloadExportHtml: function() {
      const html = generateFullExportHtml();
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'nexus-page.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  }"
