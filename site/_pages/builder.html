<head>
  <title>Visual Builder</title>
  <meta name="route" content="/builder">
  <meta name="icon" content="material-symbols-light:dashboard-customize-outline">
  <meta name="order" content="4">
  <meta name="category" content="Apps">
  <meta name="keywords" content="builder, visual editor, page builder, vvvebjs, drag and drop, daisyui, tailwind">
</head>

<div class="flex flex-col h-[calc(100dvh-5rem)] w-full gap-3 p-2 sm:p-4 select-none relative overflow-hidden"
  data-signal="{
    // Viewport & Workspace State
    viewport: 'desktop',
    zoom: 100,
    previewMode: false,
    currentDoc: '/_pages/builder/templates/landing.html',

    // Panel Toggles
    activeTab: 'components',
    inspectorTab: 'style',
    searchFilter: '',
    codeDrawerOpen: false,
    exportModalOpen: false,
    templateModalOpen: false,
    copiedToast: false,

    // Selection & Overlays
    selectedEl: null,
    hoveredEl: null,
    selectedBox: { visible: false, top: 0, left: 0, width: 0, height: 0, tag: '', id: '' },
    hoverBox: { visible: false, top: 0, left: 0, width: 0, height: 0 },
    breadcrumbs: [],
    domTree: [],
    canvasHtmlDraft: '',

    // Inspector Model
    inspector: {
      tag: '',
      id: '',
      className: '',
      isTextLeaf: false,
      textContent: '',
      fontSize: '',
      fontWeight: '',
      textAlign: '',
      display: '',
      gap: '',
      padding: '',
      marginBottom: '',
      borderRadius: '',
      opacity: '1',
      href: '',
      src: '',
      alt: '',
      target: '',
      dataSignal: '',
      dataBind: '',
      dataShow: '',
      dataOnClick: '',
      dataFor: ''
    },

    // Helper: Gets canvas shadowRoot
    getCanvasRoot: function() {
      const host = document.getElementById('builder-canvas-host');
      return host ? host.shadowRoot : null;
    },

    // Selection Logic
    selectElement: function(el) {
      if (!el || el.nodeType !== 1) {
        selectedEl = null;
        selectedBox.visible = false;
        breadcrumbs = [];
        return;
      }
      selectedEl = el;
      inspector.tag = el.tagName.toLowerCase();
      inspector.id = el.id || '';
      inspector.className = el.className || '';
      inspector.isTextLeaf = (el.children.length === 0 && el.textContent.trim().length > 0);
      inspector.textContent = el.textContent || '';
      
      const compStyle = window.getComputedStyle(el);
      inspector.fontSize = el.style.fontSize || compStyle.fontSize || '';
      inspector.fontWeight = el.style.fontWeight || compStyle.fontWeight || '';
      inspector.textAlign = el.style.textAlign || compStyle.textAlign || '';
      inspector.display = el.style.display || compStyle.display || '';
      inspector.gap = el.style.gap || compStyle.gap || '';
      inspector.padding = el.style.padding || compStyle.padding || '';
      inspector.marginBottom = el.style.marginBottom || compStyle.marginBottom || '';
      inspector.borderRadius = el.style.borderRadius || compStyle.borderRadius || '';
      inspector.opacity = el.style.opacity || compStyle.opacity || '1';
      
      inspector.href = el.getAttribute('href') || '';
      inspector.src = el.getAttribute('src') || '';
      inspector.alt = el.getAttribute('alt') || '';
      inspector.target = el.getAttribute('target') || '';

      inspector.dataSignal = el.getAttribute('data-signal') || '';
      inspector.dataBind = el.getAttribute('data-bind') || '';
      inspector.dataShow = el.getAttribute('data-show') || '';
      inspector.dataOnClick = el.getAttribute('data-on-click') || '';
      inspector.dataFor = el.getAttribute('data-for') || '';

      // Build breadcrumbs
      const crumbs = [];
      let cur = el.parentElement;
      while (cur && cur.nodeType === 1 && cur.tagName.toLowerCase() !== 'html') {
        crumbs.unshift({ tag: cur.tagName.toLowerCase(), el: cur });
        cur = cur.parentElement;
      }
      breadcrumbs = crumbs;

      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    updateSelectedBox: function() {
      if (!selectedEl) {
        selectedBox.visible = false;
        return;
      }
      const host = document.getElementById('builder-canvas-host');
      if (!host) return;
      const hostRect = host.getBoundingClientRect();
      const elRect = selectedEl.getBoundingClientRect();

      selectedBox.top = (elRect.top - hostRect.top) + host.scrollTop;
      selectedBox.left = (elRect.left - hostRect.left) + host.scrollLeft;
      selectedBox.width = elRect.width;
      selectedBox.height = elRect.height;
      selectedBox.tag = selectedEl.tagName.toLowerCase();
      selectedBox.id = selectedEl.id || '';
      selectedBox.visible = true;
    },

    updateHoverBox: function(el) {
      if (!el || el.nodeType !== 1 || previewMode) {
        hoverBox.visible = false;
        hoveredEl = null;
        return;
      }
      hoveredEl = el;
      const host = document.getElementById('builder-canvas-host');
      if (!host) return;
      const hostRect = host.getBoundingClientRect();
      const elRect = el.getBoundingClientRect();

      hoverBox.top = (elRect.top - hostRect.top) + host.scrollTop;
      hoverBox.left = (elRect.left - hostRect.left) + host.scrollLeft;
      hoverBox.width = elRect.width;
      hoverBox.height = elRect.height;
      hoverBox.visible = true;
    },

    selectParent: function() {
      if (!selectedEl) return;
      const parent = selectedEl.parentElement;
      if (parent && parent.nodeType === 1) {
        selectElement(parent);
      }
    },

    duplicateElement: function() {
      if (!selectedEl || !selectedEl.parentElement) return;
      const clone = selectedEl.cloneNode(true);
      selectedEl.parentElement.insertBefore(clone, selectedEl.nextSibling);
      selectElement(clone);
      syncCanvasHtmlToDraft();
    },

    deleteElement: function() {
      if (!selectedEl) return;
      const parent = selectedEl.parentElement;
      selectedEl.remove();
      selectedEl = null;
      selectedBox.visible = false;
      if (parent && parent.nodeType === 1) {
        selectElement(parent);
      }
      syncCanvasHtmlToDraft();
    },

    moveElementUp: function() {
      if (!selectedEl || !selectedEl.previousElementSibling) return;
      selectedEl.parentElement.insertBefore(selectedEl, selectedEl.previousElementSibling);
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    moveElementDown: function() {
      if (!selectedEl || !selectedEl.nextElementSibling) return;
      selectedEl.parentElement.insertBefore(selectedEl.nextElementSibling, selectedEl);
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    insertSnippet: function(templateId) {
      const root = getCanvasRoot();
      if (!root) return;

      let newEl = null;
      const tpl = document.getElementById(templateId);
      if (tpl && tpl.content) {
        const clone = tpl.content.cloneNode(true);
        newEl = clone.firstElementChild;
      } else if (typeof templateId === 'string' && templateId.startsWith('<')) {
        const temp = document.createElement('div');
        temp.innerHTML = templateId.trim();
        newEl = temp.firstElementChild;
      }
      if (!newEl) return;

      if (selectedEl && selectedEl.parentElement) {
        if (selectedEl.children.length > 0 || ['div', 'section', 'main', 'article', 'aside', 'header', 'footer'].includes(selectedEl.tagName.toLowerCase())) {
          selectedEl.appendChild(newEl);
        } else {
          selectedEl.parentElement.insertBefore(newEl, selectedEl.nextSibling);
        }
      } else {
        const container = root.querySelector('div, main, section') || root;
        container.appendChild(newEl);
      }

      selectElement(newEl);
      syncCanvasHtmlToDraft();
    },

    clearCanvas: function() {
      const root = getCanvasRoot();
      if (!root) return;
      root.innerHTML = '<div class=\'min-h-screen bg-base-100 text-base-content p-8 flex flex-col items-center justify-center\'><div class=\'max-w-md w-full p-8 border-2 border-dashed border-base-content/20 rounded-2xl text-center\'><h3 class=\'font-bold text-lg mb-1\'>Clean Canvas</h3><p class=\'text-xs text-base-content/60 mb-3\'>Select blocks from the left library to start building.</p></div></div>';
      selectedEl = null;
      selectedBox.visible = false;
      syncCanvasHtmlToDraft();
    },

    loadTemplate: function(path) {
      currentDoc = path;
      selectedEl = null;
      selectedBox.visible = false;
      hoverBox.visible = false;
      window.setTimeout(function() {
        syncCanvasHtmlToDraft();
      }, 500);
    },

    updateStyle: function(prop, val) {
      if (!selectedEl) return;
      selectedEl.style[prop] = val;
      inspector[prop] = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    updateAttribute: function(attr, val) {
      if (!selectedEl) return;
      if (!val) {
        selectedEl.removeAttribute(attr);
      } else {
        selectedEl.setAttribute(attr, val);
      }
      inspector[attr] = val;
      syncCanvasHtmlToDraft();
    },

    updateClassAttribute: function(val) {
      if (!selectedEl) return;
      selectedEl.className = val;
      inspector.className = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    toggleDaisyClass: function(cls) {
      if (!selectedEl) return;
      selectedEl.classList.toggle(cls);
      inspector.className = selectedEl.className;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    updateTextContent: function(val) {
      if (!selectedEl) return;
      selectedEl.textContent = val;
      inspector.textContent = val;
      updateSelectedBox();
      syncCanvasHtmlToDraft();
    },

    refreshTree: function() {
      const root = getCanvasRoot();
      if (!root) { domTree = []; return; }
      const items = [];
      function walk(node, depth) {
        if (!node || node.nodeType !== 1) return;
        if (node.tagName.toLowerCase() === 'style' || node.tagName.toLowerCase() === 'script') return;
        let icon = 'material-symbols-light:check-box-outline-blank';
        const tag = node.tagName.toLowerCase();
        if (['h1','h2','h3','h4'].includes(tag)) icon = 'material-symbols-light:title';
        else if (tag === 'p') icon = 'material-symbols-light:notes';
        else if (tag === 'button') icon = 'material-symbols-light:smart-button';
        else if (['section','header','footer'].includes(tag)) icon = 'material-symbols-light:view-agenda';
        else if (tag === 'input' || tag === 'select') icon = 'material-symbols-light:edit';
        
        items.push({
          el: node,
          tag: tag,
          classSummary: node.classList.length > 0 ? Array.from(node.classList).slice(0, 2).join('.') : '',
          depth: depth,
          icon: icon
        });
        Array.from(node.children).forEach(function(child) {
          walk(child, depth + 1);
        });
      }
      Array.from(root.children).forEach(function(child) {
        walk(child, 0);
      });
      domTree = items;
    },

    syncCanvasHtmlToDraft: function() {
      const root = getCanvasRoot();
      if (root) {
        canvasHtmlDraft = root.innerHTML.trim();
      }
    },

    applyHtmlToCanvas: function() {
      const root = getCanvasRoot();
      if (!root) return;
      root.innerHTML = canvasHtmlDraft;
      selectedEl = null;
      selectedBox.visible = false;
      codeDrawerOpen = false;
      refreshTree();
    },

    formatCanvasHtml: function() {
      if (!canvasHtmlDraft) return;
      let formatted = '';
      let indent = '';
      const tab = '  ';
      canvasHtmlDraft.split(/>\s*</).forEach(function(element) {
        if (element.match(/^\/\w/)) {
          indent = indent.substring(tab.length);
        }
        formatted += indent + '<' + element + '>\r\n';
        if (element.match(/^<?\w[^>]*[^\/]$/) && !element.startsWith('input') && !element.startsWith('img') && !element.startsWith('br')) {
          indent += tab;
        }
      });
      canvasHtmlDraft = formatted.substring(1, formatted.length - 3);
    },

    copyCanvasHtml: function() {
      syncCanvasHtmlToDraft();
      navigator.clipboard.writeText(canvasHtmlDraft);
      copiedToast = true;
      window.setTimeout(function() { copiedToast = false; }, 2000);
    },

    generateFullExportHtml: function() {
      const root = getCanvasRoot();
      const bodyContent = root ? root.innerHTML.trim() : '';
      return '<' + '!DOCTYPE html>\n<html lang=\'en\' data-theme=\'dark\'>\n<head>\n  <meta charset=\'UTF-8\'>\n  <meta name=\'viewport\' content=\'width=device-width, initial-scale=1.0\'>\n  <title>Exported Page - Nexus-UX</title>\n  <!-- Tailwind CSS v4 & DaisyUI -->\n  <link href=\'https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css\' rel=\'stylesheet\' type=\'text/css\'>\n  <script src=\'https://cdn.tailwindcss.com\'></' + 'script>\n  <!-- Iconify Web Component -->\n  <script src=\'https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js\'></' + 'script>\n  <!-- Nexus-UX Reactive Runtime -->\n  <script type=\'module\' src=\'https://cdn.jsdelivr.net/npm/@nexus-ux/runtime@latest/dist/nexus-ux.min.js\'></' + 'script>\n</head>\n<body class=\'bg-base-100 text-base-content antialiased\'>\n' + bodyContent + '\n</body>\n</html>';
    },

    copyExportHtml: function() {
      const html = generateFullExportHtml();
      navigator.clipboard.writeText(html);
      copiedToast = true;
      window.setTimeout(function() { copiedToast = false; }, 2000);
    },

    downloadExportHtml: function() {
      const html = generateFullExportHtml();
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'nexus-page.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  }"
  data-effect="
    // Canvas Host Mutation & Event Binding
    const host = document.getElementById('builder-canvas-host');
    if (host && !host.__builder_bound) {
      host.__builder_bound = true;

      // Handle selection click inside shadow root
      host.addEventListener('click', function(e) {
        if (previewMode) return;
        const target = e.composedPath ? e.composedPath()[0] : e.target;
        if (target && target.nodeType === 1 && target !== host) {
          e.preventDefault();
          e.stopPropagation();
          selectElement(target);
        }
      }, true);

      // Handle hover highlight inside shadow root
      host.addEventListener('pointermove', function(e) {
        if (previewMode) return;
        const target = e.composedPath ? e.composedPath()[0] : e.target;
        if (target && target.nodeType === 1 && target !== host) {
          updateHoverBox(target);
        }
      }, true);

      host.addEventListener('pointerleave', function() {
        hoverBox.visible = false;
      });

      // Handle double click for inline text editing
      host.addEventListener('dblclick', function(e) {
        if (previewMode) return;
        const target = e.composedPath ? e.composedPath()[0] : e.target;
        if (target && target.nodeType === 1) {
          target.contentEditable = 'true';
          target.focus();
          target.addEventListener('blur', function onBlur() {
            target.contentEditable = 'false';
            target.removeEventListener('blur', onBlur);
            selectElement(target);
            syncCanvasHtmlToDraft();
          });
        }
      }, true);
    }

    // Keep selected box aligned on window resize or zoom change
    if (selectedEl) {
      updateSelectedBox();
    }
  ">

  <!-- 1. Top Navigation & Viewport Toolbar -->
  <div data-component="'/_pages/builder/_top-panel.html'"></div>

  <!-- 2. Middle Row: Left Library + Canvas Viewport + Right Inspector -->
  <div class="flex-1 flex gap-3 min-h-0 overflow-hidden relative">
    <!-- Left Drawer (Components / Sections / Tree) -->
    <div data-component="'/_pages/builder/_left-panel.html'" class="h-full flex shrink-0"></div>

    <!-- Center Canvas Workspace -->
    <div data-component="'/_pages/builder/_canvas.html'" class="flex-1 flex min-w-0 h-full"></div>

    <!-- Right Drawer (Properties Inspector) -->
    <div data-component="'/_pages/builder/_right-panel.html'" class="h-full flex shrink-0"></div>
  </div>

  <!-- 3. Collapsible Bottom HTML Code Drawer -->
  <div data-component="'/_pages/builder/_bottom-panel.html'"></div>

  <!-- 4. Modals (Export & Template Picker) -->
  <div data-component="'/_pages/builder/_modals.html'"></div>

</div>
