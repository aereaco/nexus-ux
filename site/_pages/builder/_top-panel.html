<!-- Nexus Visual Builder #top-panel (DaisyUI Shell Aligned) -->
<header class="h-10 px-3 bg-base-200/50 backdrop-blur-md border-b border-base-content/10 flex items-center justify-between gap-2 shrink-0 select-none z-30 text-xs" id="top-panel">

  <!-- LEFT GROUP: Logo, Project Name & Panel Toggles -->
  <div class="flex items-center gap-2">
    <!-- Nexus Builder Brand -->
    <a href="/builder" class="flex items-center gap-2 font-bold tracking-tight text-xs text-base-content hover:opacity-80 transition-opacity" title="Nexus Visual Builder">
      <div class="w-6 h-6 rounded-lg bg-primary text-primary-content flex items-center justify-center font-bold text-xs shadow-sm">
        <iconify-icon icon="material-symbols-light:dashboard-customize" class="text-base"></iconify-icon>
      </div>
      <span class="font-bold tracking-tight text-xs hidden sm:inline">Nexus Builder</span>
    </a>

    <div class="h-3.5 w-px bg-base-content/15 hidden sm:block"></div>

    <!-- Page Indicator Pill -->
    <div class="hidden md:flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-base-300/40 text-base-content/70 text-[11px] border border-base-content/10">
      <iconify-icon icon="material-symbols-light:description-outline" class="text-xs text-primary"></iconify-icon>
      <span class="font-mono truncate max-w-[140px]" data-bind="currentDoc.split('/').pop()"></span>
    </div>

    <!-- Toggle Panels -->
    <div class="flex items-center gap-0.5 ml-1">
      <button class="btn btn-xs h-7 px-2 rounded-md"
        data-class="{ 'btn-primary shadow-sm': showLeftColumn, 'btn-ghost hover:bg-base-300': !showLeftColumn }"
        data-on-click="showLeftColumn = !showLeftColumn"
        title="Toggle Left Panels">
        <iconify-icon icon="material-symbols-light:dock-to-left" class="text-sm"></iconify-icon>
      </button>

      <button class="btn btn-xs h-7 px-2 rounded-md"
        data-class="{ 'btn-primary shadow-sm': showRightColumn, 'btn-ghost hover:bg-base-300': !showRightColumn }"
        data-on-click="showRightColumn = !showRightColumn"
        title="Toggle Style Inspector">
        <iconify-icon icon="material-symbols-light:dock-to-right" class="text-sm"></iconify-icon>
      </button>
    </div>

    <!-- Undo / Redo Group -->
    <div class="join ml-1">
      <button class="btn btn-ghost btn-xs h-7 px-1.5 join-item hover:bg-base-300 text-base-content/70 hover:text-base-content" title="Undo (Ctrl+Z)" data-on-click="document.execCommand('undo')">
        <iconify-icon icon="material-symbols-light:undo" class="text-sm"></iconify-icon>
      </button>
      <button class="btn btn-ghost btn-xs h-7 px-1.5 join-item hover:bg-base-300 text-base-content/70 hover:text-base-content" title="Redo (Ctrl+Shift+Z)" data-on-click="document.execCommand('redo')">
        <iconify-icon icon="material-symbols-light:redo" class="text-sm"></iconify-icon>
      </button>
    </div>
  </div>

  <!-- CENTER GROUP: Responsive Breakpoints Bar -->
  <div class="flex items-center gap-1 bg-base-300/40 p-0.5 rounded-lg border border-base-content/10">
    <!-- Desktop (Base) Breakpoint -->
    <button class="btn btn-xs h-7 px-2.5 min-h-0 rounded-md gap-1.5 transition-all"
      data-class="{ 'btn-primary shadow-sm': viewport === 'desktop', 'btn-ghost text-base-content/70 hover:bg-base-300 hover:text-base-content': viewport !== 'desktop' }"
      data-on-click="viewport = 'desktop'"
      title="Desktop (100% Fluid)">
      <iconify-icon icon="material-symbols-light:desktop-windows" class="text-sm"></iconify-icon>
      <span class="text-[11px] hidden lg:inline">Desktop</span>
    </button>

    <!-- Tablet Breakpoint -->
    <button class="btn btn-xs h-7 px-2.5 min-h-0 rounded-md gap-1.5 transition-all"
      data-class="{ 'btn-primary shadow-sm': viewport === 'tablet', 'btn-ghost text-base-content/70 hover:bg-base-300 hover:text-base-content': viewport !== 'tablet' }"
      data-on-click="viewport = 'tablet'"
      title="Tablet (768px)">
      <iconify-icon icon="material-symbols-light:tablet-mac" class="text-sm"></iconify-icon>
      <span class="text-[11px] hidden lg:inline">Tablet</span>
      <span class="text-[9px] font-mono opacity-60 hidden xl:inline">768</span>
    </button>

    <!-- Mobile Breakpoint -->
    <button class="btn btn-xs h-7 px-2.5 min-h-0 rounded-md gap-1.5 transition-all"
      data-class="{ 'btn-primary shadow-sm': viewport === 'mobile', 'btn-ghost text-base-content/70 hover:bg-base-300 hover:text-base-content': viewport !== 'mobile' }"
      data-on-click="viewport = 'mobile'"
      title="Mobile (375px)">
      <iconify-icon icon="material-symbols-light:smartphone" class="text-sm"></iconify-icon>
      <span class="text-[11px] hidden lg:inline">Mobile</span>
      <span class="text-[9px] font-mono opacity-60 hidden xl:inline">375</span>
    </button>
  </div>

  <!-- RIGHT GROUP: Mode Switcher, Zoom, Canvas Theme & Save Split-Button -->
  <div class="flex items-center gap-2">

    <!-- Mode Switcher: Design vs Preview -->
    <div class="flex items-center bg-base-300/40 p-0.5 rounded-lg border border-base-content/10">
      <button class="btn btn-xs h-7 px-2.5 min-h-0 rounded-md gap-1"
        data-class="{ 'bg-base-100 text-base-content shadow-sm font-semibold': !previewMode, 'btn-ghost text-base-content/60 hover:text-base-content': previewMode }"
        data-on-click="previewMode = false"
        title="Design Mode">
        <iconify-icon icon="material-symbols-light:edit-outline" class="text-xs"></iconify-icon>
        <span class="text-[11px] hidden sm:inline">Design</span>
      </button>
      <button class="btn btn-xs h-7 px-2.5 min-h-0 rounded-md gap-1"
        data-class="{ 'btn-secondary text-secondary-content shadow-sm font-semibold': previewMode, 'btn-ghost text-base-content/60 hover:text-base-content': !previewMode }"
        data-on-click="previewMode = true; selectedEl = null; hoveredEl = null; selectedBox.visible = false; hoverBox.visible = false"
        title="Preview Mode">
        <iconify-icon icon="material-symbols-light:visibility-outline" class="text-xs"></iconify-icon>
        <span class="text-[11px] hidden sm:inline">Preview</span>
      </button>
    </div>

    <!-- Zoom Dropdown -->
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-xs h-7 px-2 font-mono text-[11px] gap-0.5 border border-base-content/10 rounded-md hover:bg-base-300" title="Zoom">
        <span data-bind="zoom + '%'"></span>
        <iconify-icon icon="material-symbols-light:arrow-drop-down" class="text-xs"></iconify-icon>
      </div>
      <ul tabindex="0" class="dropdown-content menu p-1.5 shadow-2xl bg-base-100 border border-base-content/10 rounded-box w-28 z-50 text-xs gap-0.5 font-mono mt-1">
        <li><button data-on-click="zoom = 50">50%</button></li>
        <li><button data-on-click="zoom = 75">75%</button></li>
        <li><button data-on-click="zoom = 100">100%</button></li>
        <li><button data-on-click="zoom = 125">125%</button></li>
      </ul>
    </div>

    <!-- Canonical DaisyUI Save / Export Split-Button -->
    <div class="join">
      <button class="btn btn-primary btn-xs join-item font-medium gap-1.5"
        data-on-click="saveCanvasDraft()" title="Save changes (Ctrl+S)">
        <iconify-icon data-bind-icon="saveStatus === 'saved' ? 'material-symbols-light:check-circle' : 'material-symbols-light:save'" class="text-sm"></iconify-icon>
        <span data-bind="saveStatus === 'saved' ? 'Saved!' : 'Save'">Save</span>
      </button>
      <div class="dropdown dropdown-end join-item">
        <div tabindex="0" role="button" class="btn btn-primary btn-xs join-item px-1" title="Save & Export Options">
          <iconify-icon icon="material-symbols-light:keyboard-arrow-down" class="text-sm"></iconify-icon>
        </div>
        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-52 p-2 shadow-sm border border-base-content/10 text-xs">
          <li>
            <button data-on-click="saveCanvasDraft()">
              <iconify-icon icon="material-symbols-light:save" class="text-sm"></iconify-icon>
              <span class="flex-1 text-left">Save Draft</span>
              <kbd class="kbd kbd-xs">Ctrl+S</kbd>
            </button>
          </li>
          <li>
            <button data-on-click="exportModalOpen = true">
              <iconify-icon icon="material-symbols-light:ios-share" class="text-sm"></iconify-icon>
              <span>Export HTML</span>
            </button>
          </li>
          <li>
            <button data-on-click="downloadExportHtml()">
              <iconify-icon icon="material-symbols-light:download" class="text-sm"></iconify-icon>
              <span>Download File</span>
            </button>
          </li>
          <li>
            <button data-on-click="bottomPanelExpanded = !bottomPanelExpanded">
              <iconify-icon icon="material-symbols-light:code" class="text-sm"></iconify-icon>
              <span>Code Editor</span>
            </button>
          </li>
          <li>
            <button data-on-click="templateModalOpen = true">
              <iconify-icon icon="material-symbols-light:folder-open" class="text-sm"></iconify-icon>
              <span>Templates</span>
            </button>
          </li>
          <div class="divider my-0.5 opacity-30"></div>
          <li>
            <button data-on-click="clearCanvas()" class="text-error">
              <iconify-icon icon="material-symbols-light:delete-sweep" class="text-sm"></iconify-icon>
              <span>Clear Canvas</span>
            </button>
          </li>
        </ul>
      </div>
    </div>

  </div>

</header>
