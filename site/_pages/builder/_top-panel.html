<head>
  <meta name="internal" content="true">
</head>
<header class="navbar bg-base-200/90 backdrop-blur-md border border-base-content/10 rounded-box px-3 py-2 shrink-0 z-30 shadow-sm gap-2">
  <!-- Brand & Template Indicator -->
  <div class="flex items-center gap-2 pr-2 border-e border-base-content/10">
    <div class="w-8 h-8 rounded-lg bg-primary/10 text-primary flex items-center justify-center font-black">
      <iconify-icon icon="material-symbols-light:dashboard-customize" class="text-xl"></iconify-icon>
    </div>
    <div class="hidden sm:block">
      <div class="flex items-center gap-1.5">
        <span class="font-black text-sm tracking-tight">Visual Builder</span>
        <span class="badge badge-xs badge-primary badge-outline font-mono">ShadowDOM</span>
      </div>
      <p class="text-[10px] opacity-60 leading-none" data-bind="currentDoc.split('/').pop() || 'Untitled'"></p>
    </div>
  </div>

  <!-- Viewport Switchers -->
  <div class="join bg-base-100 p-0.5 rounded-lg border border-base-content/10 shadow-inner">
    <button class="btn btn-xs join-item border-0"
      data-class="{ 'btn-primary shadow-sm': viewport === 'desktop', 'btn-ghost opacity-70': viewport !== 'desktop' }"
      data-on-click="viewport = 'desktop'" title="Desktop View (100%)">
      <iconify-icon icon="material-symbols-light:desktop-windows-outline" class="text-base"></iconify-icon>
      <span class="hidden md:inline text-[11px]">Desktop</span>
    </button>
    <button class="btn btn-xs join-item border-0"
      data-class="{ 'btn-primary shadow-sm': viewport === 'tablet', 'btn-ghost opacity-70': viewport !== 'tablet' }"
      data-on-click="viewport = 'tablet'" title="Tablet View (768px)">
      <iconify-icon icon="material-symbols-light:tablet-outline" class="text-base"></iconify-icon>
      <span class="hidden md:inline text-[11px]">Tablet</span>
    </button>
    <button class="btn btn-xs join-item border-0"
      data-class="{ 'btn-primary shadow-sm': viewport === 'mobile', 'btn-ghost opacity-70': viewport !== 'mobile' }"
      data-on-click="viewport = 'mobile'" title="Mobile View (375px)">
      <iconify-icon icon="material-symbols-light:smartphone-outline" class="text-base"></iconify-icon>
      <span class="hidden md:inline text-[11px]">Mobile</span>
    </button>
  </div>

  <!-- Zoom Controls -->
  <div class="hidden lg:flex items-center gap-1 bg-base-100 px-2 py-1 rounded-lg border border-base-content/10 text-xs">
    <button class="btn btn-circle btn-ghost btn-xs" data-on-click="zoom = Math.max(50, zoom - 25)" title="Zoom Out">
      <iconify-icon icon="material-symbols-light:remove" class="text-sm"></iconify-icon>
    </button>
    <span class="font-mono text-[11px] font-bold w-10 text-center cursor-pointer hover:text-primary" data-on-click="zoom = 100" data-bind="zoom + '%'" title="Reset Zoom"></span>
    <button class="btn btn-circle btn-ghost btn-xs" data-on-click="zoom = Math.min(150, zoom + 25)" title="Zoom In">
      <iconify-icon icon="material-symbols-light:add" class="text-sm"></iconify-icon>
    </button>
  </div>

  <!-- Spacer -->
  <div class="flex-1"></div>

  <!-- Action Controls -->
  <div class="flex items-center gap-1.5">
    <!-- Template Switcher Button -->
    <button class="btn btn-ghost btn-xs gap-1 border border-base-content/10" data-on-click="templateModalOpen = true" title="Templates">
      <iconify-icon icon="material-symbols-light:folder-open-outline" class="text-base"></iconify-icon>
      <span class="hidden sm:inline text-xs">Templates</span>
    </button>

    <!-- Code View Toggle -->
    <button class="btn btn-xs gap-1"
      data-class="{ 'btn-accent shadow-sm': codeDrawerOpen, 'btn-ghost border border-base-content/10': !codeDrawerOpen }"
      data-on-click="codeDrawerOpen = !codeDrawerOpen" title="View / Edit HTML Source">
      <iconify-icon icon="material-symbols-light:code" class="text-base"></iconify-icon>
      <span class="hidden sm:inline text-xs">HTML</span>
    </button>

    <!-- Clear Canvas -->
    <button class="btn btn-ghost btn-xs text-error/80 hover:text-error hover:bg-error/10 border border-base-content/10"
      data-on-click="clearCanvas()" title="Clear Canvas">
      <iconify-icon icon="material-symbols-light:delete-sweep-outline" class="text-base"></iconify-icon>
      <span class="hidden sm:inline text-xs">Clear</span>
    </button>

    <!-- Preview Toggle -->
    <button class="btn btn-xs gap-1"
      data-class="{ 'btn-warning text-warning-content': previewMode, 'btn-ghost border border-base-content/10': !previewMode }"
      data-on-click="previewMode = !previewMode; selectedEl = null; hoveredEl = null"
      title="Toggle Preview Mode">
      <iconify-icon data-bind-icon="previewMode ? 'material-symbols-light:edit-outline' : 'material-symbols-light:visibility-outline'" class="text-base"></iconify-icon>
      <span class="hidden sm:inline text-xs" data-bind="previewMode ? 'Edit' : 'Preview'"></span>
    </button>

    <!-- Export / Download Modal -->
    <button class="btn btn-primary btn-xs gap-1 shadow-md shadow-primary/20"
      data-on-click="exportModalOpen = true" title="Export HTML">
      <iconify-icon icon="material-symbols-light:download" class="text-base"></iconify-icon>
      <span class="text-xs font-bold">Export</span>
    </button>
  </div>
</header>
