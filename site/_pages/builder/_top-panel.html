<!-- Authentic VvvebJs #top-panel (35px Height) -->
<header class="h-[35px] px-2 bg-base-100 border-b border-base-content/10 flex items-center justify-between gap-1.5 shrink-0 select-none z-30 text-xs" id="top-panel">

  <!-- LEFT GROUP: Logo, Menu Toggle & Layout Toggles -->
  <div class="flex items-center gap-0.5" role="group">
    <!-- VvvebJs Double Slanted Slash Logo -->
    <a href="/builder" class="flex items-center px-1.5 py-0.5 mr-1" title="VvvebJs Builder">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="text-success stroke-current stroke-[3] stroke-linecap-round">
        <line x1="7" y1="20" x2="13" y2="4"></line>
        <line x1="13" y1="20" x2="19" y2="4"></line>
      </svg>
    </a>

    <!-- Toggle Sidebar Width -->
    <button class="btn btn-ghost btn-xs h-6 px-1.5 hover:bg-base-200"
      data-on-click="sidebarExpanded = !sidebarExpanded"
      title="Toggle sidebar width">
      <iconify-icon icon="material-symbols-light:menu" class="text-sm"></iconify-icon>
    </button>

    <!-- Toggle File Manager -->
    <button class="btn btn-xs h-6 px-1.5"
      data-class="{ 'btn-primary shadow-sm': activeSidebarTab === 'pages' && showLeftColumn, 'btn-ghost hover:bg-base-200': !(activeSidebarTab === 'pages' && showLeftColumn) }"
      data-on-click="activeSidebarTab = 'pages'; showLeftColumn = true"
      title="Toggle file manager">
      <iconify-icon icon="material-symbols-light:folder-open-outline" class="text-sm"></iconify-icon>
    </button>

    <!-- Toggle Left Column -->
    <button class="btn btn-xs h-6 px-1.5"
      data-class="{ 'btn-primary shadow-sm': showLeftColumn, 'btn-ghost hover:bg-base-200': !showLeftColumn }"
      data-on-click="showLeftColumn = !showLeftColumn"
      title="Toggle left column">
      <iconify-icon icon="material-symbols-light:dock-to-left" class="text-sm"></iconify-icon>
    </button>

    <!-- Toggle Right Column -->
    <button class="btn btn-xs h-6 px-1.5"
      data-class="{ 'btn-primary shadow-sm': showRightColumn, 'btn-ghost hover:bg-base-200': !showRightColumn }"
      data-on-click="showRightColumn = !showRightColumn"
      title="Toggle right column">
      <iconify-icon icon="material-symbols-light:dock-to-right" class="text-sm"></iconify-icon>
    </button>
  </div>

  <!-- CENTER-LEFT GROUP: Canvas Tools, Actions, Mode & Download -->
  <div class="hidden sm:flex items-center gap-1.5">
    <!-- Undo / Redo Group -->
    <div class="join">
      <button class="btn btn-ghost btn-xs h-6 px-1.5 join-item hover:bg-base-200" title="Undo (Ctrl+Z)" data-on-click="document.execCommand('undo')">
        <iconify-icon icon="material-symbols-light:undo" class="text-sm"></iconify-icon>
      </button>
      <button class="btn btn-ghost btn-xs h-6 px-1.5 join-item hover:bg-base-200" title="Redo (Ctrl+Shift+Z)" data-on-click="document.execCommand('redo')">
        <iconify-icon icon="material-symbols-light:redo" class="text-sm"></iconify-icon>
      </button>
    </div>

    <!-- Mode Tools Group -->
    <div class="flex items-center gap-0.5 bg-base-200/50 rounded p-0.5 border border-base-content/10">
      <!-- Designer Mode -->
      <button class="btn btn-xs h-5 px-1.5 min-h-0"
        data-class="{ 'bg-secondary text-secondary-content': designerMode, 'btn-ghost hover:bg-base-200': !designerMode }"
        data-on-click="designerMode = !designerMode"
        title="Designer Mode (Free dragging)">
        <iconify-icon icon="material-symbols-light:pan-tool" class="text-xs"></iconify-icon>
      </button>

      <!-- Preview Mode -->
      <button class="btn btn-xs h-5 px-1.5 min-h-0"
        data-class="{ 'bg-warning text-warning-content': previewMode, 'btn-ghost hover:bg-base-200': !previewMode }"
        data-on-click="previewMode = !previewMode; selectedEl = null; hoveredEl = null"
        title="Preview">
        <iconify-icon data-bind-icon="previewMode ? 'material-symbols-light:edit-outline' : 'material-symbols-light:visibility-outline'" class="text-xs"></iconify-icon>
      </button>

      <!-- Fullscreen -->
      <button class="btn btn-ghost btn-xs h-5 px-1.5 min-h-0 hover:bg-base-200"
        data-on-click="if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();"
        title="Fullscreen (F11)">
        <iconify-icon icon="material-symbols-light:fullscreen" class="text-xs"></iconify-icon>
      </button>

      <!-- Toggle Hidden Elements -->
      <button class="btn btn-xs h-5 px-1.5 min-h-0"
        data-class="{ 'bg-secondary text-secondary-content': showHidden, 'btn-ghost hover:bg-base-200': !showHidden }"
        data-on-click="showHidden = !showHidden"
        title="Show hidden elements">
        <iconify-icon icon="material-symbols-light:visibility-off-outline" class="text-xs"></iconify-icon>
      </button>

      <!-- Toggle Tree Navigator -->
      <button class="btn btn-xs h-5 px-1.5 min-h-0"
        data-class="{ 'bg-primary text-primary-content font-bold': activeSidebarTab === 'pages' && showTreeList && showLeftColumn, 'btn-ghost hover:bg-base-200': !(activeSidebarTab === 'pages' && showTreeList && showLeftColumn) }"
        data-on-click="activeSidebarTab = 'pages'; showTreeList = true; showLeftColumn = true; refreshTree()"
        title="Toggle navigator (Ctrl+Shift+L)">
        <iconify-icon icon="material-symbols-light:layers-outline" class="text-xs"></iconify-icon>
      </button>

      <!-- Direct Download -->
      <button class="btn btn-ghost btn-xs h-5 px-1.5 min-h-0 hover:bg-base-200"
        data-on-click="downloadExportHtml()"
        title="Download">
        <iconify-icon icon="material-symbols-light:download" class="text-xs"></iconify-icon>
      </button>
    </div>
  </div>

  <!-- RIGHT GROUP: Dark Mode, Breakpoints, Zoom & Save Split-Button -->
  <div class="flex items-center gap-1.5">

    <!-- Dark Mode Toggle Button (Canvas Editor Content Only) -->
    <button class="btn btn-ghost btn-xs h-6 px-1.5 hover:bg-base-200"
      data-on-click="toggleCanvasTheme()"
      title="Toggle Canvas Theme">
      <iconify-icon data-bind-icon="canvasTheme === 'dark' ? 'material-symbols-light:dark-mode-outline' : 'material-symbols-light:wb-sunny-outline'" class="text-sm"></iconify-icon>
    </button>

    <!-- External Preview Tab Link -->
    <a href="/_pages/builder/templates/landing.html" target="_blank" class="btn btn-ghost btn-xs h-6 px-1.5 hover:bg-base-200 hidden md:inline-flex" title="View page">
      <iconify-icon icon="material-symbols-light:open-in-new" class="text-sm"></iconify-icon>
    </a>

    <!-- Responsive Breakpoint Dropdown -->
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-xs h-6 gap-1 px-1.5 hover:bg-base-200 border border-base-content/10" title="Breakpoints">
        <iconify-icon icon="material-symbols-light:stay-current-portrait-outline" class="text-sm"></iconify-icon>
        <span class="capitalize text-[10px] hidden md:inline" data-bind="viewport"></span>
        <iconify-icon icon="material-symbols-light:arrow-drop-down" class="text-xs"></iconify-icon>
      </div>
      <ul tabindex="0" class="dropdown-content menu p-1 shadow-xl bg-base-100 border border-base-content/15 rounded-md w-48 z-50 text-xs gap-0.5">
        <li>
          <button data-class="{ 'active': viewport === 'mobile' }" data-on-click="viewport = 'mobile'">
            <iconify-icon icon="material-symbols-light:smartphone" class="text-sm"></iconify-icon>
            <span>Mobile (375px)</span>
          </button>
        </li>
        <li>
          <button data-class="{ 'active': viewport === 'tablet' }" data-on-click="viewport = 'tablet'">
            <iconify-icon icon="material-symbols-light:tablet" class="text-sm"></iconify-icon>
            <span>Tablet (768px)</span>
          </button>
        </li>
        <li>
          <button data-class="{ 'active': viewport === 'tablet-landscape' }" data-on-click="viewport = 'tablet-landscape'">
            <iconify-icon icon="material-symbols-light:tablet-mac" class="text-sm"></iconify-icon>
            <span>Tablet landscape (1024px)</span>
          </button>
        </li>
        <li>
          <button data-class="{ 'active': viewport === 'laptop' }" data-on-click="viewport = 'laptop'">
            <iconify-icon icon="material-symbols-light:laptop-chromebook" class="text-sm"></iconify-icon>
            <span>Laptop (1280px)</span>
          </button>
        </li>
        <li>
          <button data-class="{ 'active': viewport === 'desktop' }" data-on-click="viewport = 'desktop'">
            <iconify-icon icon="material-symbols-light:desktop-windows" class="text-sm"></iconify-icon>
            <span>Desktop view</span>
          </button>
        </li>
      </ul>
    </div>

    <!-- Zoom Percent Input Spinner -->
    <div class="flex items-center gap-0.5">
      <input type="number" id="zoom" min="10" max="150" step="10"
        class="input input-bordered input-xs h-6 w-12 text-center font-mono text-[11px] px-1 py-0 rounded border-base-content/20"
        data-bind-value="zoom" />
      <span class="text-[11px] font-mono opacity-70">%</span>
    </div>

    <!-- VvvebJs Authentic Blue Save Split-Button -->
    <div class="join shadow-sm">
      <button class="btn btn-xs h-6 px-2.5 join-item gap-1 font-semibold bg-[#0d6efd] text-white border-0 hover:bg-blue-700"
        data-on-click="exportModalOpen = true" title="Save changes (Ctrl+S)">
        <span>Save</span>
      </button>
      <div class="dropdown dropdown-end join-item">
        <div tabindex="0" role="button" class="btn btn-xs h-6 px-1 join-item min-h-0 bg-[#0d6efd] text-white border-0 border-l border-white/30 hover:bg-blue-700">
          <iconify-icon icon="material-symbols-light:arrow-drop-down" class="text-xs"></iconify-icon>
        </div>
        <ul tabindex="0" class="dropdown-content menu p-1 shadow-xl bg-base-100 border border-base-content/15 rounded-md w-44 z-50 text-xs gap-0.5">
          <li>
            <button data-on-click="bottomPanelExpanded = true">
              <iconify-icon icon="material-symbols-light:code" class="text-sm text-accent"></iconify-icon>
              <span>Code Editor</span>
            </button>
          </li>
          <li>
            <button data-on-click="templateModalOpen = true">
              <iconify-icon icon="material-symbols-light:folder" class="text-sm text-warning"></iconify-icon>
              <span>Switch Template</span>
            </button>
          </li>
          <li>
            <button data-on-click="exportModalOpen = true">
              <iconify-icon icon="material-symbols-light:ios-share" class="text-sm text-primary"></iconify-icon>
              <span>Export HTML</span>
            </button>
          </li>
          <div class="divider my-0.5"></div>
          <li>
            <button class="text-error" data-on-click="clearCanvas()">
              <iconify-icon icon="material-symbols-light:delete-sweep" class="text-sm"></iconify-icon>
              <span>Clear Canvas</span>
            </button>
          </li>
        </ul>
      </div>
    </div>

  </div>

</header>
