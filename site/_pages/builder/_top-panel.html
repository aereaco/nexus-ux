<head>
  <meta name="internal" content="true">
</head>
<!-- Authentic VvvebJs #top-panel -->
<header class="h-9 px-2 bg-base-100 border-b border-base-content/10 flex items-center justify-between gap-2 shrink-0 select-none z-30" id="top-panel">

  <!-- LEFT GROUP: Layout Column & Sidebar Toggles -->
  <div class="flex items-center gap-0.5" role="group">
    <!-- Toggle Sidebar Width -->
    <button class="btn btn-ghost btn-xs px-1.5 hover:bg-base-200"
      data-on-click="sidebarExpanded = !sidebarExpanded"
      title="Toggle sidebar width">
      <iconify-icon icon="material-symbols-light:menu" class="text-base"></iconify-icon>
    </button>

    <!-- Toggle File Manager -->
    <button class="btn btn-xs px-1.5"
      data-class="{ 'btn-primary shadow-sm': activeSidebarTab === 'pages' && showLeftColumn, 'btn-ghost hover:bg-base-200': !(activeSidebarTab === 'pages' && showLeftColumn) }"
      data-on-click="activeSidebarTab = 'pages'; showLeftColumn = true"
      title="Toggle file manager">
      <iconify-icon icon="material-symbols-light:folder-open-outline" class="text-base"></iconify-icon>
    </button>

    <!-- Toggle Left Column -->
    <button class="btn btn-xs px-1.5"
      data-class="{ 'btn-primary shadow-sm': showLeftColumn, 'btn-ghost hover:bg-base-200': !showLeftColumn }"
      data-on-click="showLeftColumn = !showLeftColumn"
      title="Toggle left column">
      <iconify-icon icon="material-symbols-light:dock-to-left" class="text-base"></iconify-icon>
    </button>

    <!-- Toggle Right Column -->
    <button class="btn btn-xs px-1.5"
      data-class="{ 'btn-primary shadow-sm': showRightColumn, 'btn-ghost hover:bg-base-200': !showRightColumn }"
      data-on-click="showRightColumn = !showRightColumn"
      title="Toggle right column">
      <iconify-icon icon="material-symbols-light:dock-to-right" class="text-base"></iconify-icon>
    </button>
  </div>

  <!-- CENTER-LEFT GROUP: Canvas Tools, Actions, Mode & Download -->
  <div class="hidden sm:flex items-center gap-1">
    <!-- Undo / Redo -->
    <div class="join">
      <button class="btn btn-ghost btn-xs px-1.5 join-item hover:bg-base-200" title="Undo (Ctrl+Z)" data-on-click="document.execCommand('undo')">
        <iconify-icon icon="material-symbols-light:undo" class="text-base"></iconify-icon>
      </button>
      <button class="btn btn-ghost btn-xs px-1.5 join-item hover:bg-base-200" title="Redo (Ctrl+Shift+Z)" data-on-click="document.execCommand('redo')">
        <iconify-icon icon="material-symbols-light:redo" class="text-base"></iconify-icon>
      </button>
    </div>

    <div class="divider divider-horizontal my-1 mx-0.5"></div>

    <!-- Designer Mode -->
    <button class="btn btn-xs px-1.5"
      data-class="{ 'btn-secondary text-secondary-content': designerMode, 'btn-ghost hover:bg-base-200': !designerMode }"
      data-on-click="designerMode = !designerMode"
      title="Designer Mode (Free dragging)">
      <iconify-icon icon="material-symbols-light:pan-tool" class="text-base"></iconify-icon>
    </button>

    <!-- Preview Mode -->
    <button class="btn btn-xs px-1.5"
      data-class="{ 'btn-warning text-warning-content': previewMode, 'btn-ghost hover:bg-base-200': !previewMode }"
      data-on-click="previewMode = !previewMode; selectedEl = null; hoveredEl = null"
      title="Preview Page">
      <iconify-icon data-bind-icon="previewMode ? 'material-symbols-light:edit-outline' : 'material-symbols-light:visibility-outline'" class="text-base"></iconify-icon>
    </button>

    <!-- Fullscreen -->
    <button class="btn btn-ghost btn-xs px-1.5 hover:bg-base-200"
      data-on-click="if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();"
      title="Fullscreen (F11)">
      <iconify-icon icon="material-symbols-light:fullscreen" class="text-base"></iconify-icon>
    </button>

    <!-- Toggle Hidden Elements -->
    <button class="btn btn-xs px-1.5"
      data-class="{ 'btn-secondary text-secondary-content': showHidden, 'btn-ghost hover:bg-base-200': !showHidden }"
      data-on-click="showHidden = !showHidden"
      title="Show hidden elements">
      <iconify-icon icon="material-symbols-light:visibility-off-outline" class="text-base"></iconify-icon>
    </button>

    <!-- Toggle Tree Navigator -->
    <button class="btn btn-xs px-1.5"
      data-class="{ 'btn-primary shadow-sm': activeSidebarTab === 'pages' && showTreeList && showLeftColumn, 'btn-ghost hover:bg-base-200': !(activeSidebarTab === 'pages' && showTreeList && showLeftColumn) }"
      data-on-click="activeSidebarTab = 'pages'; showTreeList = true; showLeftColumn = true; refreshTree()"
      title="Toggle navigator (Ctrl+Shift+L)">
      <iconify-icon icon="material-symbols-light:account-tree-outline" class="text-base"></iconify-icon>
    </button>

    <!-- Direct Download -->
    <button class="btn btn-ghost btn-xs px-1.5 hover:bg-base-200"
      data-on-click="downloadExportHtml()"
      title="Download HTML">
      <iconify-icon icon="material-symbols-light:download" class="text-base"></iconify-icon>
    </button>
  </div>

  <!-- RIGHT GROUP: Dark Mode, Breakpoints, Zoom & Save Split-Button -->
  <div class="flex items-center gap-1.5">

    <!-- External Preview Tab Link -->
    <a href="/_pages/builder/templates/landing.html" target="_blank" class="btn btn-ghost btn-xs px-1.5 hover:bg-base-200 hidden md:inline-flex" title="View page in new tab">
      <iconify-icon icon="material-symbols-light:open-in-new" class="text-base"></iconify-icon>
    </a>

    <!-- Responsive Breakpoint Dropdown -->
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-xs gap-1 px-1.5 hover:bg-base-200 border border-base-content/10" title="Breakpoints">
        <iconify-icon data-bind-icon="
          viewport === 'mobile' ? 'material-symbols-light:smartphone' :
          viewport === 'tablet' ? 'material-symbols-light:tablet' :
          viewport === 'tablet-landscape' ? 'material-symbols-light:tablet-mac' :
          viewport === 'laptop' ? 'material-symbols-light:laptop-chromebook' :
          'material-symbols-light:desktop-windows'" class="text-base"></iconify-icon>
        <span class="capitalize text-[11px] hidden md:inline" data-bind="viewport"></span>
        <iconify-icon icon="material-symbols-light:arrow-drop-down" class="text-xs"></iconify-icon>
      </div>
      <ul tabindex="0" class="dropdown-content menu p-1.5 shadow-xl bg-base-200 border border-base-content/10 rounded-box w-48 z-50 text-xs gap-0.5">
        <li>
          <button data-class="{ 'active': viewport === 'mobile' }" data-on-click="viewport = 'mobile'">
            <iconify-icon icon="material-symbols-light:smartphone" class="text-base"></iconify-icon>
            <span>Mobile (375px)</span>
          </button>
        </li>
        <li>
          <button data-class="{ 'active': viewport === 'tablet' }" data-on-click="viewport = 'tablet'">
            <iconify-icon icon="material-symbols-light:tablet" class="text-base"></iconify-icon>
            <span>Tablet (768px)</span>
          </button>
        </li>
        <li>
          <button data-class="{ 'active': viewport === 'tablet-landscape' }" data-on-click="viewport = 'tablet-landscape'">
            <iconify-icon icon="material-symbols-light:tablet-mac" class="text-base"></iconify-icon>
            <span>Tablet Landscape (1024px)</span>
          </button>
        </li>
        <li>
          <button data-class="{ 'active': viewport === 'laptop' }" data-on-click="viewport = 'laptop'">
            <iconify-icon icon="material-symbols-light:laptop-chromebook" class="text-base"></iconify-icon>
            <span>Laptop (1280px)</span>
          </button>
        </li>
        <li>
          <button data-class="{ 'active': viewport === 'desktop' }" data-on-click="viewport = 'desktop'">
            <iconify-icon icon="material-symbols-light:desktop-windows" class="text-base"></iconify-icon>
            <span>Desktop (Full)</span>
          </button>
        </li>
      </ul>
    </div>

    <!-- Zoom Controls -->
    <div class="flex items-center bg-base-200 rounded px-1 border border-base-content/10">
      <button class="btn btn-ghost btn-circle btn-xs h-5 w-5 min-h-0" data-on-click="zoom = Math.max(20, zoom - 10)" title="Zoom Out">-</button>
      <span class="text-[10px] font-mono w-7 text-center font-bold" data-bind="zoom + '%'"></span>
      <button class="btn btn-ghost btn-circle btn-xs h-5 w-5 min-h-0" data-on-click="zoom = Math.min(150, zoom + 10)" title="Zoom In">+</button>
    </div>

    <!-- VvvebJs Save Split-Button -->
    <div class="join shadow-sm">
      <button class="btn btn-primary btn-xs px-2 join-item gap-1 font-semibold" data-on-click="exportModalOpen = true" title="Save changes">
        <iconify-icon icon="material-symbols-light:save" class="text-base"></iconify-icon>
        <span class="hidden sm:inline">Save</span>
      </button>
      <div class="dropdown dropdown-end join-item">
        <div tabindex="0" role="button" class="btn btn-primary btn-xs px-1 min-h-0 h-full join-item">
          <iconify-icon icon="material-symbols-light:arrow-drop-down" class="text-sm"></iconify-icon>
        </div>
        <ul tabindex="0" class="dropdown-content menu p-1.5 shadow-xl bg-base-200 border border-base-content/10 rounded-box w-48 z-50 text-xs gap-0.5">
          <li>
            <button data-on-click="bottomPanelExpanded = true">
              <iconify-icon icon="material-symbols-light:code" class="text-base text-accent"></iconify-icon>
              <span>Code Editor</span>
            </button>
          </li>
          <li>
            <button data-on-click="templateModalOpen = true">
              <iconify-icon icon="material-symbols-light:folder" class="text-base text-warning"></iconify-icon>
              <span>Switch Template</span>
            </button>
          </li>
          <li>
            <button data-on-click="exportModalOpen = true">
              <iconify-icon icon="material-symbols-light:ios-share" class="text-base text-primary"></iconify-icon>
              <span>Export HTML</span>
            </button>
          </li>
          <div class="divider my-0.5"></div>
          <li>
            <button class="text-error" data-on-click="clearCanvas()">
              <iconify-icon icon="material-symbols-light:delete-sweep" class="text-base"></iconify-icon>
              <span>Clear Canvas</span>
            </button>
          </li>
        </ul>
      </div>
    </div>

  </div>

</header>
