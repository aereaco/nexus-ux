<head>
  <meta name="internal" content="true">
</head>
<!-- Authentic VvvebJs #bottom-panel with Breadcrumbs & Expandable Split Code Editor -->
<footer class="w-full flex flex-col bg-base-100 border-t border-base-content/10 select-none z-30" id="bottom-panel">

  <!-- ================= 1. DOCKED BREADCRUMBS BAR (35px) ================= -->
  <div class="h-[35px] px-3 flex items-center justify-between gap-2 text-xs bg-base-100 dark:bg-base-200/50">
    
    <!-- Breadcrumb Path Hierarchy (Dark Pill Buttons) -->
    <div class="flex items-center gap-1.5 overflow-x-auto py-0.5 no-scrollbar flex-1">
      <template data-for="(crumb, idx) in breadcrumbs">
        <div class="flex items-center gap-1 shrink-0">
          <button class="px-2 py-0.5 rounded font-mono text-[11px] transition-colors flex items-center gap-1"
            data-class="{
              'bg-primary text-primary-content font-bold shadow-xs': selectedEl === crumb.el,
              'bg-neutral text-neutral-content hover:bg-primary hover:text-primary-content': selectedEl !== crumb.el
            }"
            data-on-click="selectElement(crumb.el)">
            <span data-bind="crumb.tag"></span>
            <span data-show="crumb.id" data-bind="'#' + crumb.id" class="opacity-80"></span>
            <span data-show="crumb.classes" data-bind="'.' + crumb.classes.split(' ')[0]" class="opacity-80"></span>
          </button>
          <span data-show="idx < breadcrumbs.length - 1" class="text-base-content/40 text-[10px]">&gt;</span>
        </div>
      </template>
      <div data-show="breadcrumbs.length === 0" class="text-base-content/40 italic text-[11px]">
        Select an element to view DOM hierarchy
      </div>
    </div>

    <!-- Right Controls: Code Editor Toggle -->
    <div class="flex items-center gap-2 shrink-0">
      <button class="btn btn-ghost btn-xs h-6 px-2 min-h-0 font-mono gap-1 text-[11px] hover:bg-base-300"
        data-class="{ 'bg-base-300 text-primary font-bold': bottomPanelExpanded }"
        data-on-click="bottomPanelExpanded = !bottomPanelExpanded; if (bottomPanelExpanded) syncCanvasHtmlToDraft()"
        title="Toggle code editor (Ctrl + E)">
        <span>&lt;/&gt; Code editor</span>
        <iconify-icon data-bind-icon="bottomPanelExpanded ? 'material-symbols-light:keyboard-arrow-down' : 'material-symbols-light:keyboard-arrow-up'" class="text-xs"></iconify-icon>
      </button>
    </div>

  </div>

  <!-- ================= 2. EXPANDABLE 50% SPLIT CODE EDITOR ================= -->
  <div class="h-72 w-full bg-[#1e1e1e] text-gray-200 flex flex-col border-t border-base-content/20 transition-all duration-300"
    data-show="bottomPanelExpanded">
    
    <!-- Code Editor Header Tabs -->
    <div class="h-8 px-2 bg-[#252526] border-b border-white/10 flex items-center justify-between shrink-0 text-xs">
      
      <!-- Subtabs: [ </> Html ] [ & Css ] -->
      <div class="flex h-full items-center">
        <button class="h-full px-3 flex items-center gap-1.5 font-mono text-[11px] border-r border-white/10 transition-colors"
          data-class="{ 'bg-[#1e1e1e] text-white font-bold border-t-2 border-t-[#0d6efd]': codeTab === 'html', 'text-gray-400 hover:text-white': codeTab !== 'html' }"
          data-on-click="codeTab = 'html'">
          <span class="text-[#0d6efd] font-bold">&lt;/&gt;</span>
          <span>Html</span>
        </button>
        <button class="h-full px-3 flex items-center gap-1.5 font-mono text-[11px] border-r border-white/10 transition-colors"
          data-class="{ 'bg-[#1e1e1e] text-white font-bold border-t-2 border-t-[#0d6efd]': codeTab === 'css', 'text-gray-400 hover:text-white': codeTab !== 'css' }"
          data-on-click="codeTab = 'css'">
          <span class="text-warning font-bold">#</span>
          <span>Css</span>
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <label class="flex items-center gap-1.5 cursor-pointer text-[10px] text-gray-400 hover:text-white">
          <input type="checkbox" class="checkbox checkbox-xs checkbox-primary" data-bind-checked="runJsOnEdit" />
          <span>Run JS on edit</span>
        </label>

        <button class="btn btn-ghost btn-xs h-6 px-2 min-h-0 text-gray-300 hover:text-white hover:bg-white/10 text-[11px] gap-1"
          data-on-click="applyDraftToCanvas()"
          title="Apply Changes to Canvas">
          <iconify-icon icon="material-symbols-light:check" class="text-success text-sm"></iconify-icon>
          <span>Apply</span>
        </button>

        <button class="btn btn-ghost btn-xs h-6 w-6 min-h-0 p-0 text-gray-400 hover:text-white hover:bg-white/10"
          data-on-click="bottomPanelExpanded = false"
          title="Close Code Editor">
          ✕
        </button>
      </div>
    </div>

    <!-- Code Editor Content Area -->
    <div class="flex-1 flex min-h-0 relative">
      
      <!-- HTML Editor Pane -->
      <div class="w-full h-full flex" data-show="codeTab === 'html'">
        <div class="w-10 bg-[#1e1e1e] border-r border-white/5 text-gray-600 font-mono text-[10px] py-2 text-right pr-2 select-none leading-5">
          1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14
        </div>
        <textarea class="flex-1 w-full h-full bg-[#1e1e1e] text-gray-200 font-mono text-xs p-2 leading-5 resize-none outline-none border-0 focus:ring-0 selection:bg-blue-600"
          spellcheck="false"
          data-bind-value="canvasHtmlDraft"
          data-on-input="canvasHtmlDraft = $evt.target.value; if (runJsOnEdit) applyDraftToCanvas()"></textarea>
      </div>

      <!-- CSS Editor Pane -->
      <div class="w-full h-full flex" data-show="codeTab === 'css'">
        <div class="w-10 bg-[#1e1e1e] border-r border-white/5 text-gray-600 font-mono text-[10px] py-2 text-right pr-2 select-none leading-5">
          1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10
        </div>
        <textarea class="flex-1 w-full h-full bg-[#1e1e1e] text-yellow-100 font-mono text-xs p-2 leading-5 resize-none outline-none border-0 focus:ring-0 selection:bg-blue-600"
          spellcheck="false"
          data-bind-value="canvasCssDraft"
          data-on-input="canvasCssDraft = $evt.target.value"></textarea>
      </div>

    </div>

  </div>

</footer>
