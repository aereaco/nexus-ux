<!-- Collapsible Bottom Code Drawer -->
<div class="fixed inset-x-4 bottom-4 z-50 transition-all duration-300 transform shadow-2xl"
  data-class="{ 'translate-y-0 opacity-100': codeDrawerOpen, 'translate-y-[120%] opacity-0 pointer-events-none': !codeDrawerOpen }">
  <div class="bg-base-300/95 backdrop-blur-xl border border-base-content/15 rounded-2xl p-4 max-w-6xl mx-auto flex flex-col gap-3 shadow-2xl">
    
    <!-- Code Drawer Header -->
    <div class="flex items-center justify-between border-b border-base-content/10 pb-2">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-accent/10 text-accent flex items-center justify-center">
          <iconify-icon icon="material-symbols-light:code" class="text-lg"></iconify-icon>
        </div>
        <div>
          <div class="font-bold text-xs flex items-center gap-2">
            <span>Canvas HTML Source</span>
            <span class="badge badge-accent badge-xs font-mono">Live Sync</span>
          </div>
          <p class="text-[10px] opacity-60">Edit the markup directly and click Apply to update the visual canvas.</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Copy to clipboard -->
        <button class="btn btn-ghost btn-xs gap-1" data-on-click="copyCanvasHtml()">
          <iconify-icon icon="material-symbols-light:content-copy" class="text-sm"></iconify-icon>
          <span class="text-[11px]" data-bind="copiedToast ? 'Copied!' : 'Copy'"></span>
        </button>

        <!-- Format HTML -->
        <button class="btn btn-ghost btn-xs gap-1" data-on-click="formatCanvasHtml()">
          <iconify-icon icon="material-symbols-light:auto-fix-high" class="text-sm"></iconify-icon>
          <span class="text-[11px]">Format</span>
        </button>

        <!-- Apply to Canvas -->
        <button class="btn btn-primary btn-xs gap-1 shadow-md shadow-primary/20" data-on-click="applyHtmlToCanvas()">
          <iconify-icon icon="material-symbols-light:check" class="text-sm"></iconify-icon>
          <span class="text-[11px] font-bold">Apply Changes</span>
        </button>

        <!-- Close Drawer -->
        <button class="btn btn-circle btn-ghost btn-xs" data-on-click="codeDrawerOpen = false">
          ✕
        </button>
      </div>
    </div>

    <!-- Code Editor Body -->
    <div class="relative">
      <textarea class="textarea textarea-bordered w-full font-mono text-xs bg-base-100 leading-relaxed h-64 selection:bg-accent selection:text-accent-content rounded-xl border-base-content/15 p-3 resize-none"
        spellcheck="false"
        data-bind="canvasHtmlDraft"></textarea>
    </div>

    <!-- Drawer Footer Stats -->
    <div class="flex items-center justify-between text-[11px] text-base-content/50 font-mono px-1">
      <div class="flex items-center gap-3">
        <span>Characters: <strong data-bind="canvasHtmlDraft ? canvasHtmlDraft.length : 0"></strong></span>
        <span>Lines: <strong data-bind="canvasHtmlDraft ? canvasHtmlDraft.split('\n').length : 0"></strong></span>
      </div>
      <div class="flex items-center gap-1 text-success">
        <span class="w-2 h-2 rounded-full bg-success"></span>
        <span>Shadow DOM Synchronized</span>
      </div>
    </div>

  </div>
</div>
