<head>
  <meta name="internal" content="true">
</head>
<!-- Authentic VvvebJs #right-panel Properties Inspector -->
<aside class="w-72 lg:w-80 h-full flex flex-col bg-base-100 border-l border-base-content/10 overflow-hidden select-none text-xs" id="right-panel">

  <!-- Inspector Navigation Tabs (#properties-tabs) -->
  <div class="tabs tabs-boxed bg-base-200/60 p-1 m-2 rounded-lg shrink-0">
    <button class="tab tab-xs flex-1"
      data-class="{ 'tab-active font-bold': propertiesSubTab === 'content' }"
      data-on-click="propertiesSubTab = 'content'">
      <iconify-icon icon="material-symbols-light:edit-note" class="mr-1 text-sm"></iconify-icon>
      Content
    </button>
    <button class="tab tab-xs flex-1"
      data-class="{ 'tab-active font-bold': propertiesSubTab === 'style' }"
      data-on-click="propertiesSubTab = 'style'">
      <iconify-icon icon="material-symbols-light:palette" class="mr-1 text-sm"></iconify-icon>
      Style
    </button>
    <button class="tab tab-xs flex-1"
      data-class="{ 'tab-active font-bold': propertiesSubTab === 'advanced' }"
      data-on-click="propertiesSubTab = 'advanced'">
      <iconify-icon icon="material-symbols-light:settings" class="mr-1 text-sm"></iconify-icon>
      Advanced
    </button>
  </div>

  <!-- "No Element Selected" Empty State Alert -->
  <div class="p-4" data-show="!selectedEl">
    <div class="alert bg-base-200 border border-base-content/10 rounded-xl p-4 flex flex-col items-center text-center gap-2">
      <iconify-icon icon="material-symbols-light:touch-app" class="text-3xl text-primary opacity-60"></iconify-icon>
      <div>
        <strong class="font-bold text-xs">No selected element!</strong>
        <p class="text-[11px] opacity-60 mt-0.5">Click on any element in the canvas to edit its properties.</p>
      </div>
    </div>
  </div>

  <!-- Active Element Inspector Body -->
  <div class="flex-1 flex flex-col min-h-0 overflow-y-auto px-3 pb-6" data-show="selectedEl">
    
    <!-- Element Tag Badge & Quick Header -->
    <div class="py-2 border-b border-base-content/10 mb-3 flex items-center justify-between">
      <div class="flex items-center gap-1.5">
        <span class="badge badge-primary badge-sm font-mono font-bold uppercase" data-bind="inspector.tag"></span>
        <span class="text-[10px] opacity-60 truncate font-mono" data-bind="'#' + inspector.id" data-show="inspector.id"></span>
      </div>
      <div class="flex items-center gap-1">
        <button class="btn btn-ghost btn-circle btn-xs h-6 w-6 min-h-0" data-on-click="selectParent()" title="Select Parent">
          <iconify-icon icon="material-symbols-light:arrow-upward-alt" class="text-xs"></iconify-icon>
        </button>
        <button class="btn btn-ghost btn-circle btn-xs h-6 w-6 min-h-0" data-on-click="duplicateElement()" title="Duplicate">
          <iconify-icon icon="material-symbols-light:content-copy-outline" class="text-xs"></iconify-icon>
        </button>
        <button class="btn btn-ghost btn-circle btn-xs h-6 w-6 min-h-0 text-error" data-on-click="deleteElement()" title="Delete">
          <iconify-icon icon="material-symbols-light:delete-outline" class="text-xs"></iconify-icon>
        </button>
      </div>
    </div>

    <!-- ================= 1. CONTENT TAB ================= -->
    <div class="space-y-3" data-show="propertiesSubTab === 'content'">
      <!-- Text Content Editor (for text leaf nodes) -->
      <div class="form-control" data-show="inspector.isTextLeaf">
        <label class="label py-1"><span class="label-text text-xs font-semibold">Text Content</span></label>
        <textarea class="textarea textarea-bordered textarea-xs font-mono h-20 rounded-lg p-2"
          data-bind="inspector.textContent"
          data-on-input="updateTextContent($evt.target.value)"></textarea>
      </div>

      <!-- Classes Input -->
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs font-semibold">Class Names</span></label>
        <input type="text" class="input input-bordered input-xs font-mono rounded-lg"
          data-bind="inspector.className"
          data-on-input="updateClassAttribute($evt.target.value)" />
      </div>

      <!-- Link URL (for <a> tags) -->
      <div class="form-control" data-show="inspector.tag === 'a'">
        <label class="label py-1"><span class="label-text text-xs font-semibold">Link (href)</span></label>
        <input type="text" class="input input-bordered input-xs rounded-lg font-mono"
          data-bind="inspector.href"
          data-on-input="updateAttribute('href', $evt.target.value)" />
      </div>

      <!-- Image Source (for <img> tags) -->
      <div class="form-control" data-show="inspector.tag === 'img'">
        <label class="label py-1"><span class="label-text text-xs font-semibold">Image URL (src)</span></label>
        <input type="text" class="input input-bordered input-xs rounded-lg font-mono"
          data-bind="inspector.src"
          data-on-input="updateAttribute('src', $evt.target.value)" />
      </div>

      <!-- Element ID -->
      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs font-semibold">Element ID</span></label>
        <input type="text" class="input input-bordered input-xs font-mono rounded-lg"
          data-bind="inspector.id"
          data-on-input="updateAttribute('id', $evt.target.value)" />
      </div>
    </div>

    <!-- ================= 2. STYLE TAB ================= -->
    <div class="space-y-4" data-show="propertiesSubTab === 'style'">
      
      <!-- Pseudo-State Selector (VvvebJs State Selector) -->
      <div class="flex items-center justify-between gap-2 p-2 bg-base-200/60 rounded-lg border border-base-content/10">
        <span class="text-[11px] font-semibold text-base-content/70">Pseudo State</span>
        <select class="select select-bordered select-xs w-36 rounded-md"
          data-bind="styleState">
          <option value="">Default</option>
          <option value="hover">:hover</option>
          <option value="active">:active</option>
          <option value="focus">:focus</option>
          <option value="nth-of-type(2n)">:nth-of-type(2n)</option>
        </select>
      </div>

      <!-- Accordion 1: Typography -->
      <div class="collapse collapse-arrow bg-base-200/40 border border-base-content/10 rounded-xl">
        <input type="checkbox" checked="checked" />
        <div class="collapse-title text-xs font-bold py-2.5">Typography</div>
        <div class="collapse-content space-y-2 text-xs pt-1">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="label py-0.5"><span class="label-text text-[10px] opacity-70">Font Size</span></label>
              <select class="select select-bordered select-xs w-full rounded"
                data-bind="inspector.fontSize"
                data-on-change="updateStyle('fontSize', $evt.target.value)">
                <option value="">Default</option>
                <option value="12px">12px</option>
                <option value="14px">14px</option>
                <option value="16px">16px</option>
                <option value="18px">18px</option>
                <option value="20px">20px</option>
                <option value="24px">24px</option>
                <option value="32px">32px</option>
                <option value="48px">48px</option>
              </select>
            </div>
            <div>
              <label class="label py-0.5"><span class="label-text text-[10px] opacity-70">Font Weight</span></label>
              <select class="select select-bordered select-xs w-full rounded"
                data-bind="inspector.fontWeight"
                data-on-change="updateStyle('fontWeight', $evt.target.value)">
                <option value="">Default</option>
                <option value="300">Light (300)</option>
                <option value="400">Regular (400)</option>
                <option value="600">Semibold (600)</option>
                <option value="700">Bold (700)</option>
                <option value="800">Extrabold (800)</option>
              </select>
            </div>
          </div>

          <div>
            <label class="label py-0.5"><span class="label-text text-[10px] opacity-70">Alignment</span></label>
            <div class="join w-full">
              <button class="btn btn-outline btn-xs join-item flex-1"
                data-class="{ 'btn-active bg-primary/20 text-primary': inspector.textAlign === 'left' }"
                data-on-click="updateStyle('textAlign', 'left')">
                <iconify-icon icon="material-symbols-light:format-align-left"></iconify-icon>
              </button>
              <button class="btn btn-outline btn-xs join-item flex-1"
                data-class="{ 'btn-active bg-primary/20 text-primary': inspector.textAlign === 'center' }"
                data-on-click="updateStyle('textAlign', 'center')">
                <iconify-icon icon="material-symbols-light:format-align-center"></iconify-icon>
              </button>
              <button class="btn btn-outline btn-xs join-item flex-1"
                data-class="{ 'btn-active bg-primary/20 text-primary': inspector.textAlign === 'right' }"
                data-on-click="updateStyle('textAlign', 'right')">
                <iconify-icon icon="material-symbols-light:format-align-right"></iconify-icon>
              </button>
              <button class="btn btn-outline btn-xs join-item flex-1"
                data-class="{ 'btn-active bg-primary/20 text-primary': inspector.textAlign === 'justify' }"
                data-on-click="updateStyle('textAlign', 'justify')">
                <iconify-icon icon="material-symbols-light:format-align-justify"></iconify-icon>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Accordion 2: Layout & Spacing -->
      <div class="collapse collapse-arrow bg-base-200/40 border border-base-content/10 rounded-xl">
        <input type="checkbox" checked="checked" />
        <div class="collapse-title text-xs font-bold py-2.5">Layout & Spacing</div>
        <div class="collapse-content space-y-2 text-xs pt-1">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="label py-0.5"><span class="label-text text-[10px] opacity-70">Display</span></label>
              <select class="select select-bordered select-xs w-full rounded"
                data-bind="inspector.display"
                data-on-change="updateStyle('display', $evt.target.value)">
                <option value="">Default</option>
                <option value="block">Block</option>
                <option value="flex">Flex</option>
                <option value="grid">Grid</option>
                <option value="inline-block">Inline-Block</option>
                <option value="none">Hidden (none)</option>
              </select>
            </div>
            <div>
              <label class="label py-0.5"><span class="label-text text-[10px] opacity-70">Gap</span></label>
              <select class="select select-bordered select-xs w-full rounded"
                data-bind="inspector.gap"
                data-on-change="updateStyle('gap', $evt.target.value)">
                <option value="">Default</option>
                <option value="0.5rem">Small (8px)</option>
                <option value="1rem">Medium (16px)</option>
                <option value="1.5rem">Large (24px)</option>
                <option value="2rem">XL (32px)</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="label py-0.5"><span class="label-text text-[10px] opacity-70">Padding</span></label>
              <select class="select select-bordered select-xs w-full rounded"
                data-bind="inspector.padding"
                data-on-change="updateStyle('padding', $evt.target.value)">
                <option value="">None</option>
                <option value="0.5rem">0.5rem (8px)</option>
                <option value="1rem">1.0rem (16px)</option>
                <option value="1.5rem">1.5rem (24px)</option>
                <option value="2rem">2.0rem (32px)</option>
              </select>
            </div>
            <div>
              <label class="label py-0.5"><span class="label-text text-[10px] opacity-70">Margin Bottom</span></label>
              <select class="select select-bordered select-xs w-full rounded"
                data-bind="inspector.marginBottom"
                data-on-change="updateStyle('marginBottom', $evt.target.value)">
                <option value="">None</option>
                <option value="0.5rem">0.5rem (8px)</option>
                <option value="1rem">1.0rem (16px)</option>
                <option value="1.5rem">1.5rem (24px)</option>
                <option value="2rem">2.0rem (32px)</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Accordion 3: Background & Borders -->
      <div class="collapse collapse-arrow bg-base-200/40 border border-base-content/10 rounded-xl">
        <input type="checkbox" />
        <div class="collapse-title text-xs font-bold py-2.5">Background & Borders</div>
        <div class="collapse-content space-y-2 text-xs pt-1">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="label py-0.5"><span class="label-text text-[10px] opacity-70">Corner Radius</span></label>
              <select class="select select-bordered select-xs w-full rounded"
                data-bind="inspector.borderRadius"
                data-on-change="updateStyle('borderRadius', $evt.target.value)">
                <option value="">Default</option>
                <option value="0px">None (0px)</option>
                <option value="0.375rem">Small (6px)</option>
                <option value="0.5rem">Medium (8px)</option>
                <option value="1rem">Large (16px)</option>
                <option value="9999px">Pill / Full</option>
              </select>
            </div>
            <div>
              <label class="label py-0.5"><span class="label-text text-[10px] opacity-70">Opacity</span></label>
              <select class="select select-bordered select-xs w-full rounded"
                data-bind="inspector.opacity"
                data-on-change="updateStyle('opacity', $evt.target.value)">
                <option value="1">100%</option>
                <option value="0.8">80%</option>
                <option value="0.6">60%</option>
                <option value="0.4">40%</option>
                <option value="0.2">20%</option>
              </select>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- ================= 3. ADVANCED TAB (Nexus-UX Directives) ================= -->
    <div class="space-y-3" data-show="propertiesSubTab === 'advanced'">
      
      <div class="p-2.5 bg-primary/10 rounded-xl border border-primary/20 text-[11px] text-primary">
        <strong>Nexus-UX Reactive Directives</strong>
        <p class="text-[10px] opacity-80 mt-0.5">Directives evaluate live inside the reactive ownership graph!</p>
      </div>

      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs font-mono font-semibold">data-signal</span></label>
        <input type="text" placeholder="{ count: 0 }"
          class="input input-bordered input-xs font-mono rounded-lg"
          data-bind="inspector.dataSignal"
          data-on-input="updateAttribute('data-signal', $evt.target.value)" />
      </div>

      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs font-mono font-semibold">data-bind</span></label>
        <input type="text" placeholder="user.name"
          class="input input-bordered input-xs font-mono rounded-lg"
          data-bind="inspector.dataBind"
          data-on-input="updateAttribute('data-bind', $evt.target.value)" />
      </div>

      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs font-mono font-semibold">data-show</span></label>
        <input type="text" placeholder="isOpen"
          class="input input-bordered input-xs font-mono rounded-lg"
          data-bind="inspector.dataShow"
          data-on-input="updateAttribute('data-show', $evt.target.value)" />
      </div>

      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs font-mono font-semibold">data-on-click</span></label>
        <input type="text" placeholder="count++"
          class="input input-bordered input-xs font-mono rounded-lg"
          data-bind="inspector.dataOnClick"
          data-on-input="updateAttribute('data-on-click', $evt.target.value)" />
      </div>

      <div class="form-control">
        <label class="label py-1"><span class="label-text text-xs font-mono font-semibold">data-for</span></label>
        <input type="text" placeholder="item in items"
          class="input input-bordered input-xs font-mono rounded-lg"
          data-bind="inspector.dataFor"
          data-on-input="updateAttribute('data-for', $evt.target.value)" />
      </div>

    </div>

  </div>

</aside>
