<!-- Authentic VvvebJs #right-panel Properties Inspector with Complete Field Suite -->
<aside class="w-64 sm:w-72 lg:w-80 h-full flex flex-col bg-base-100 border-l border-base-content/10 overflow-hidden select-none text-xs" id="right-panel">

  <!-- Inspector Navigation Tabs: Content | Style | Advanced -->
  <div class="flex border-b border-base-content/15 bg-base-200/40 shrink-0">
    <button class="flex-1 py-1.5 text-center text-xs font-medium border-b-2 transition-colors flex items-center justify-center gap-1"
      data-class="{ 'border-primary text-primary font-bold bg-base-100': propertiesSubTab === 'content', 'border-transparent text-base-content/70 hover:text-base-content': propertiesSubTab !== 'content' }"
      data-on-click="propertiesSubTab = 'content'">
      <iconify-icon icon="material-symbols-light:folder-outline" class="text-xs"></iconify-icon>
      <span>Content</span>
    </button>
    <button class="flex-1 py-1.5 text-center text-xs font-medium border-b-2 transition-colors flex items-center justify-center gap-1"
      data-class="{ 'border-primary text-primary font-bold bg-base-100': propertiesSubTab === 'style', 'border-transparent text-base-content/70 hover:text-base-content': propertiesSubTab !== 'style' }"
      data-on-click="propertiesSubTab = 'style'">
      <iconify-icon icon="material-symbols-light:palette-outline" class="text-xs"></iconify-icon>
      <span>Style</span>
    </button>
    <button class="flex-1 py-1.5 text-center text-xs font-medium border-b-2 transition-colors flex items-center justify-center gap-1"
      data-class="{ 'border-primary text-primary font-bold bg-base-100': propertiesSubTab === 'advanced', 'border-transparent text-base-content/70 hover:text-base-content': propertiesSubTab !== 'advanced' }"
      data-on-click="propertiesSubTab = 'advanced'">
      <iconify-icon icon="material-symbols-light:settings-outline" class="text-xs"></iconify-icon>
      <span>Advanced</span>
    </button>
  </div>

  <!-- State: When No Element Is Selected -->
  <div class="p-3" data-show="!hasSelection">
    <div class="alert bg-base-200/60 border border-base-content/10 rounded-md p-3 flex items-start justify-between">
      <div>
        <div class="font-bold text-xs text-base-content">No selected element!</div>
        <div class="text-[11px] text-base-content/60 mt-0.5">Click on an element in the canvas to inspect and edit its properties.</div>
      </div>
      <button class="btn btn-ghost btn-xs h-5 w-5 min-h-0 p-0 text-base-content/40 hover:text-base-content">✕</button>
    </div>
  </div>

  <!-- State: When An Element Is Selected -->
  <div class="flex-1 overflow-y-auto" data-show="hasSelection">
    
    <!-- ================= 1. CONTENT TAB ================= -->
    <div class="p-2 space-y-3" data-show="propertiesSubTab === 'content'">
      
      <!-- Tag-Aware Section: Heading Controls -->
      <div class="border border-base-content/10 rounded bg-base-100 p-2.5 space-y-2"
        data-show="['H1','H2','H3','H4','H5','H6'].includes(inspector.tag)">
        <div class="flex items-center justify-between text-[11px] font-bold text-base-content/80">
          <span>Heading</span>
          <iconify-icon icon="material-symbols-light:keyboard-arrow-down" class="text-sm"></iconify-icon>
        </div>
        
        <div class="space-y-1">
          <label class="text-[10px] text-base-content/60 font-medium">Size</label>
          <select class="select select-bordered select-xs w-full h-7 rounded text-xs"
            data-on-change="changeTag($evt.target.value.toLowerCase())">
            <option value="H1" data-bind-selected="inspector.tag === 'H1'">Heading 1</option>
            <option value="H2" data-bind-selected="inspector.tag === 'H2'">Heading 2</option>
            <option value="H3" data-bind-selected="inspector.tag === 'H3'">Heading 3</option>
            <option value="H4" data-bind-selected="inspector.tag === 'H4'">Heading 4</option>
            <option value="H5" data-bind-selected="inspector.tag === 'H5'">Heading 5</option>
            <option value="H6" data-bind-selected="inspector.tag === 'H6'">Heading 6</option>
          </select>
        </div>

        <div class="space-y-1">
          <label class="text-[10px] text-base-content/60 font-medium">Text Content</label>
          <textarea class="textarea textarea-bordered textarea-xs w-full font-sans text-xs rounded leading-tight"
            rows="3"
            data-bind-value="inspector.textContent"
            data-on-input="updateInspectorText($evt.target.value)"></textarea>
        </div>
      </div>

      <!-- Tag-Aware Section: Link Controls -->
      <div class="border border-base-content/10 rounded bg-base-100 p-2.5 space-y-2"
        data-show="inspector.tag === 'A'">
        <div class="flex items-center justify-between text-[11px] font-bold text-base-content/80">
          <span>Link (Anchor)</span>
          <iconify-icon icon="material-symbols-light:keyboard-arrow-down" class="text-sm"></iconify-icon>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] text-base-content/60 font-medium">Href URL</label>
          <input type="text" class="input input-bordered input-xs w-full h-7 rounded"
            data-bind-value="inspector.href"
            data-on-input="setAttr('href', $evt.target.value)" />
        </div>
        <div class="space-y-1">
          <label class="text-[10px] text-base-content/60 font-medium">Target</label>
          <select class="select select-bordered select-xs w-full h-7 rounded"
            data-on-change="setAttr('target', $evt.target.value)">
            <option value="_self">Same window (_self)</option>
            <option value="_blank">New tab (_blank)</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] text-base-content/60 font-medium">Text</label>
          <textarea class="textarea textarea-bordered textarea-xs w-full font-sans text-xs rounded"
            rows="2"
            data-bind-value="inspector.textContent"
            data-on-input="updateInspectorText($evt.target.value)"></textarea>
        </div>
      </div>

      <!-- Tag-Aware Section: Image Controls -->
      <div class="border border-base-content/10 rounded bg-base-100 p-2.5 space-y-2"
        data-show="inspector.tag === 'IMG'">
        <div class="flex items-center justify-between text-[11px] font-bold text-base-content/80">
          <span>Image</span>
          <iconify-icon icon="material-symbols-light:keyboard-arrow-down" class="text-sm"></iconify-icon>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] text-base-content/60 font-medium">Image Source (URL)</label>
          <input type="text" class="input input-bordered input-xs w-full h-7 rounded"
            data-bind-value="inspector.src"
            data-on-input="setAttr('src', $evt.target.value)" />
        </div>
        <div class="space-y-1">
          <label class="text-[10px] text-base-content/60 font-medium">Alt Text</label>
          <input type="text" class="input input-bordered input-xs w-full h-7 rounded"
            data-on-input="setAttr('alt', $evt.target.value)" />
        </div>
      </div>

      <!-- Tag-Aware Section: Generic Leaf Text -->
      <div class="border border-base-content/10 rounded bg-base-100 p-2.5 space-y-2"
        data-show="inspector.isTextLeaf && !['H1','H2','H3','H4','H5','H6','A','IMG'].includes(inspector.tag)">
        <div class="flex items-center justify-between text-[11px] font-bold text-base-content/80">
          <span>Text Leaf</span>
          <iconify-icon icon="material-symbols-light:keyboard-arrow-down" class="text-sm"></iconify-icon>
        </div>
        <textarea class="textarea textarea-bordered textarea-xs w-full font-sans text-xs rounded leading-tight"
          rows="3"
          data-bind-value="inspector.textContent"
          data-on-input="updateInspectorText($evt.target.value)"></textarea>
      </div>

      <!-- General Accordion (ID, Title, Classes) -->
      <div class="border border-base-content/10 rounded bg-base-100 p-2.5 space-y-2.5">
        <div class="flex items-center justify-between text-[11px] font-bold text-base-content/80">
          <span>General</span>
          <iconify-icon icon="material-symbols-light:keyboard-arrow-down" class="text-sm"></iconify-icon>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-base-content/60 font-medium block mb-1">Id</label>
            <input type="text" class="input input-bordered input-xs w-full h-7 rounded"
              placeholder="element-id"
              data-bind-value="inspector.id"
              data-on-input="updateInspectorId($evt.target.value)" />
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 font-medium block mb-1">Title</label>
            <input type="text" class="input input-bordered input-xs w-full h-7 rounded"
              placeholder="title tooltip"
              data-on-input="setAttr('title', $evt.target.value)" />
          </div>
        </div>

        <div>
          <label class="text-[10px] text-base-content/60 font-medium block mb-1">Class</label>
          <input type="text" class="input input-bordered input-xs w-full h-7 rounded font-mono text-[11px]"
            data-bind-value="inspector.className"
            data-on-input="updateInspectorClasses($evt.target.value)" />
        </div>
      </div>

    </div>

    <!-- ================= 2. STYLE TAB (All 9 VvvebJs Sections) ================= -->
    <div class="p-2 space-y-2.5" data-show="propertiesSubTab === 'style'">
      
      <!-- Pseudo-State Selector -->
      <div>
        <select class="select select-bordered select-xs w-full h-7 rounded text-xs"
          data-bind-value="styleState">
          <option value="">- State -</option>
          <option value="hover">hover</option>
          <option value="active">active</option>
          <option value="focus">focus</option>
          <option value="nth-of-type(2n)">nth-of-type(2n)</option>
        </select>
      </div>

      <!-- 1. DISPLAY ACCORDION -->
      <div class="border border-base-content/10 rounded bg-base-100 p-2.5 space-y-2">
        <div class="flex items-center justify-between text-[11px] font-bold text-base-content/80">
          <span>Display</span>
          <iconify-icon icon="material-symbols-light:keyboard-arrow-down" class="text-sm"></iconify-icon>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Display</label>
            <select class="select select-bordered select-xs w-full h-6 min-h-0 text-[11px] rounded"
              data-on-change="setStyle('display', $evt.target.value)">
              <option value="block">Block</option>
              <option value="inline">Inline</option>
              <option value="inline-block">Inline Block</option>
              <option value="flex">Flex</option>
              <option value="inline-flex">Inline Flex</option>
              <option value="grid">Grid</option>
              <option value="inline-grid">Inline Grid</option>
              <option value="table">Table</option>
              <option value="table-row">Table Row</option>
              <option value="list-item">List Item</option>
              <option value="inherit">Inherit</option>
              <option value="initial">Initial</option>
              <option value="none">none</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Position</label>
            <select class="select select-bordered select-xs w-full h-6 min-h-0 text-[11px] rounded"
              data-on-change="setStyle('position', $evt.target.value)">
              <option value="static">Static</option>
              <option value="fixed">Fixed</option>
              <option value="relative">Relative</option>
              <option value="absolute">Absolute</option>
            </select>
          </div>
        </div>

        <!-- Coordinates: Top, Left, Bottom, Right -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Top</label>
            <input type="text" placeholder="auto" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="setStyle('top', $evt.target.value)" />
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Left</label>
            <input type="text" placeholder="auto" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="setStyle('left', $evt.target.value)" />
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Bottom</label>
            <input type="text" placeholder="auto" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="setStyle('bottom', $evt.target.value)" />
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Right</label>
            <input type="text" placeholder="auto" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="setStyle('right', $evt.target.value)" />
          </div>
        </div>

        <!-- Float 3-Segmented Buttons -->
        <div>
          <label class="text-[10px] text-base-content/60 block mb-1">Float</label>
          <div class="join w-full">
            <button class="btn btn-xs h-6 min-h-0 join-item flex-1 btn-outline border-base-content/20 font-normal" data-on-click="setStyle('float', 'none')">✕</button>
            <button class="btn btn-xs h-6 min-h-0 join-item flex-1 btn-outline border-base-content/20 font-normal" data-on-click="setStyle('float', 'left')">Left</button>
            <button class="btn btn-xs h-6 min-h-0 join-item flex-1 btn-outline border-base-content/20 font-normal" data-on-click="setStyle('float', 'right')">Right</button>
          </div>
        </div>

        <!-- Opacity Slider -->
        <div>
          <div class="flex items-center justify-between text-[10px] text-base-content/60 mb-0.5">
            <span>Opacity</span>
            <span class="font-mono">1</span>
          </div>
          <input type="range" min="0" max="1" step="0.05" value="1" class="range range-xs range-primary"
            data-on-input="setStyle('opacity', $evt.target.value)" />
        </div>

        <!-- Colors -->
        <div class="flex items-center justify-between pt-1">
          <span class="text-[10px] text-base-content/60">Background</span>
          <input type="color" class="w-6 h-6 rounded cursor-pointer border border-base-content/20 bg-transparent"
            data-on-input="setStyle('backgroundColor', $evt.target.value)" />
        </div>
        <div class="flex items-center justify-between">
          <span class="text-[10px] text-base-content/60">Text Color</span>
          <input type="color" class="w-6 h-6 rounded cursor-pointer border border-base-content/20 bg-transparent"
            data-on-input="setStyle('color', $evt.target.value)" />
        </div>
      </div>

      <!-- 2. TYPOGRAPHY ACCORDION -->
      <div class="border border-base-content/10 rounded bg-base-100 p-2.5 space-y-2">
        <div class="flex items-center justify-between text-[11px] font-bold text-base-content/80">
          <span>Typography</span>
          <iconify-icon icon="material-symbols-light:keyboard-arrow-down" class="text-sm"></iconify-icon>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Font size</label>
            <div class="flex items-center">
              <input type="number" class="input input-bordered input-xs w-full h-6 min-h-0 text-[11px] rounded-r-none font-mono"
                data-on-input="if (selectedEl) { selectedEl.style.fontSize = $evt.target.value + 'px'; syncCanvasHtmlToDraft(); }" />
              <span class="bg-base-200 border border-l-0 border-base-content/20 px-1.5 h-6 text-[10px] flex items-center rounded-r">px</span>
            </div>
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Font weight</label>
            <select class="select select-bordered select-xs w-full h-6 min-h-0 text-[11px] rounded"
              data-on-change="if (selectedEl) { selectedEl.style.fontWeight = $evt.target.value; syncCanvasHtmlToDraft(); }">
              <option value="">Default</option>
              <option value="100">Thin (100)</option>
              <option value="200">Extra-Light (200)</option>
              <option value="300">Light (300)</option>
              <option value="400">Normal (400)</option>
              <option value="500">Medium (500)</option>
              <option value="600">Semi-Bold (600)</option>
              <option value="700">Bold (700)</option>
              <option value="800">Extra-Bold (800)</option>
              <option value="900">Ultra-Bold (900)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[10px] text-base-content/60 block mb-0.5">Font family</label>
          <select class="select select-bordered select-xs w-full h-6 min-h-0 text-[11px] rounded"
            data-on-change="if (selectedEl) { selectedEl.style.fontFamily = $evt.target.value; syncCanvasHtmlToDraft(); }">
            <option value="">Default</option>
            <option value="Arial, Helvetica, sans-serif">Arial</option>
            <option value="'Helvetica Neue', Helvetica, sans-serif">Helvetica Neue</option>
            <option value="'Times New Roman', Times, serif">Times New Roman</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Courier New', Courier, monospace">Courier New</option>
            <option value="Verdana, Geneva, sans-serif">Verdana</option>
            <option value="Tahoma, Geneva, sans-serif">Tahoma</option>
            <option value="system-ui, sans-serif">System Sans</option>
          </select>
        </div>

        <!-- 5-Button Text Align Segments -->
        <div>
          <label class="text-[10px] text-base-content/60 block mb-1">Text align</label>
          <div class="join w-full">
            <button class="btn btn-xs h-6 min-h-0 join-item flex-1 btn-outline border-base-content/20" title="None" data-on-click="if (selectedEl) { selectedEl.style.textAlign = ''; syncCanvasHtmlToDraft(); }">✕</button>
            <button class="btn btn-xs h-6 min-h-0 join-item flex-1 btn-outline border-base-content/20" title="Left" data-on-click="if (selectedEl) { selectedEl.style.textAlign = 'left'; syncCanvasHtmlToDraft(); }">
              <iconify-icon icon="material-symbols-light:format-align-left"></iconify-icon>
            </button>
            <button class="btn btn-xs h-6 min-h-0 join-item flex-1 btn-outline border-base-content/20" title="Center" data-on-click="if (selectedEl) { selectedEl.style.textAlign = 'center'; syncCanvasHtmlToDraft(); }">
              <iconify-icon icon="material-symbols-light:format-align-center"></iconify-icon>
            </button>
            <button class="btn btn-xs h-6 min-h-0 join-item flex-1 btn-outline border-base-content/20" title="Right" data-on-click="if (selectedEl) { selectedEl.style.textAlign = 'right'; syncCanvasHtmlToDraft(); }">
              <iconify-icon icon="material-symbols-light:format-align-right"></iconify-icon>
            </button>
            <button class="btn btn-xs h-6 min-h-0 join-item flex-1 btn-outline border-base-content/20" title="Justify" data-on-click="if (selectedEl) { selectedEl.style.textAlign = 'justify'; syncCanvasHtmlToDraft(); }">
              <iconify-icon icon="material-symbols-light:format-align-justify"></iconify-icon>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Line height</label>
            <input type="text" placeholder="1.5" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="if (selectedEl) { selectedEl.style.lineHeight = $evt.target.value; syncCanvasHtmlToDraft(); }" />
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Letter spacing</label>
            <input type="text" placeholder="normal" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="if (selectedEl) { selectedEl.style.letterSpacing = $evt.target.value; syncCanvasHtmlToDraft(); }" />
          </div>
        </div>

        <div>
          <label class="text-[10px] text-base-content/60 block mb-0.5">Decoration Style</label>
          <select class="select select-bordered select-xs w-full h-6 min-h-0 text-[11px] rounded"
            data-on-change="if (selectedEl) { selectedEl.style.textDecorationStyle = $evt.target.value; syncCanvasHtmlToDraft(); }">
            <option value="">Default</option>
            <option value="solid">Solid</option>
            <option value="wavy">Wavy</option>
            <option value="dotted">Dotted</option>
            <option value="dashed">Dashed</option>
            <option value="double">Double</option>
          </select>
        </div>
      </div>

      <!-- 3. SIZE & DIMENSIONS ACCORDION -->
      <div class="border border-base-content/10 rounded bg-base-100 p-2.5 space-y-2">
        <div class="flex items-center justify-between text-[11px] font-bold text-base-content/80">
          <span>Size</span>
          <iconify-icon icon="material-symbols-light:keyboard-arrow-down" class="text-sm"></iconify-icon>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Width</label>
            <input type="text" placeholder="auto" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="if (selectedEl) { selectedEl.style.width = $evt.target.value; syncCanvasHtmlToDraft(); }" />
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Height</label>
            <input type="text" placeholder="auto" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="if (selectedEl) { selectedEl.style.height = $evt.target.value; syncCanvasHtmlToDraft(); }" />
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Min Width</label>
            <input type="text" placeholder="auto" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="if (selectedEl) { selectedEl.style.minWidth = $evt.target.value; syncCanvasHtmlToDraft(); }" />
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Min Height</label>
            <input type="text" placeholder="auto" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="if (selectedEl) { selectedEl.style.minHeight = $evt.target.value; syncCanvasHtmlToDraft(); }" />
          </div>
        </div>
      </div>

      <!-- 4. MARGIN ACCORDION -->
      <div class="border border-base-content/10 rounded bg-base-100 p-2.5 space-y-2">
        <div class="flex items-center justify-between text-[11px] font-bold text-base-content/80">
          <span>Margin</span>
          <iconify-icon icon="material-symbols-light:keyboard-arrow-down" class="text-sm"></iconify-icon>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Top</label>
            <input type="text" placeholder="0px" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="if (selectedEl) { selectedEl.style.marginTop = $evt.target.value; syncCanvasHtmlToDraft(); }" />
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Right</label>
            <input type="text" placeholder="0px" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="if (selectedEl) { selectedEl.style.marginRight = $evt.target.value; syncCanvasHtmlToDraft(); }" />
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Bottom</label>
            <input type="text" placeholder="0px" class="input input-bordered input-xs w-full h-6 text-[11px]"
              data-on-input="if (selectedEl) { selectedEl.style.marginBottom = $evt.target.value; syncCanvasHtmlToDraft(); }" />
          </div>
          <div>
            <label class="text-[10px] text-base-content/60 block mb-0.5">Left</label>
            <input type="text" placeholder="0px" class="input input-bordered input-xs w-full h-6 text-[11px]"
