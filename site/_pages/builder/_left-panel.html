<head>
  <meta name="internal" content="true">
</head>
<aside class="flex flex-col w-72 lg:w-80 bg-base-200/60 backdrop-blur-md border border-base-content/10 rounded-box shrink-0 overflow-hidden transition-all duration-300 shadow-sm"
  data-show="!previewMode">
  <!-- Left Panel Header Tabs -->
  <div class="tabs tabs-boxed bg-base-300/60 p-1 m-2 rounded-xl gap-1">
    <button class="tab tab-xs flex-1 transition-all"
      data-class="{ 'tab-active font-bold text-primary shadow-sm': activeTab === 'components' }"
      data-on-click="activeTab = 'components'">
      <iconify-icon icon="material-symbols-light:widgets-outline" class="text-sm me-1"></iconify-icon>
      UI Blocks
    </button>
    <button class="tab tab-xs flex-1 transition-all"
      data-class="{ 'tab-active font-bold text-secondary shadow-sm': activeTab === 'sections' }"
      data-on-click="activeTab = 'sections'">
      <iconify-icon icon="material-symbols-light:view-agenda-outline" class="text-sm me-1"></iconify-icon>
      Sections
    </button>
    <button class="tab tab-xs flex-1 transition-all"
      data-class="{ 'tab-active font-bold text-accent shadow-sm': activeTab === 'nexus' }"
      data-on-click="activeTab = 'nexus'">
      <iconify-icon icon="material-symbols-light:bolt" class="text-sm me-1"></iconify-icon>
      Reactive
    </button>
    <button class="tab tab-xs flex-1 transition-all"
      data-class="{ 'tab-active font-bold text-info shadow-sm': activeTab === 'tree' }"
      data-on-click="activeTab = 'tree'; refreshTree()">
      <iconify-icon icon="material-symbols-light:account-tree-outline" class="text-sm me-1"></iconify-icon>
      Tree
    </button>
  </div>

  <!-- Search Filter for Palette -->
  <div class="px-2 pb-2" data-show="activeTab !== 'tree'">
    <label class="input input-xs input-bordered flex items-center gap-2 bg-base-100 rounded-lg">
      <iconify-icon icon="material-symbols-light:search" class="text-base-content/40 text-sm"></iconify-icon>
      <input type="text" class="grow text-xs placeholder:text-base-content/40" placeholder="Filter blocks..."
        data-bind="searchFilter" />
      <button class="btn btn-ghost btn-circle btn-xs text-[10px]" data-show="searchFilter" data-on-click="searchFilter = ''">✕</button>
    </label>
  </div>

  <!-- Scrollable Panel Body -->
  <div class="flex-1 overflow-y-auto px-2 pb-4 space-y-4">

    <!-- ================= TAB 1: UI BLOCKS (DaisyUI Components) ================= -->
    <div data-show="activeTab === 'components'" class="space-y-3">
      <!-- Layout & Containers -->
      <div>
        <div class="text-[10px] uppercase font-bold tracking-wider text-base-content/40 px-1 mb-1">Layout &amp; Grid</div>
        <div class="grid grid-cols-2 gap-1.5">
          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-container')"
            data-show="!searchFilter || 'container box wrapper'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:check-box-outline-blank" class="text-primary text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Container</div>
              <div class="text-[9px] opacity-50 truncate">Centered wrapper</div>
            </div>
          </button>

          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-grid2')"
            data-show="!searchFilter || 'grid columns 2 col'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:view-column-2-outline" class="text-primary text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">2 Columns</div>
              <div class="text-[9px] opacity-50 truncate">Grid 1:1</div>
            </div>
          </button>

          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-grid3')"
            data-show="!searchFilter || 'grid columns 3 col'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:grid-view" class="text-primary text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">3 Columns</div>
              <div class="text-[9px] opacity-50 truncate">Grid 1:1:1</div>
            </div>
          </button>

          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-flexRow')"
            data-show="!searchFilter || 'flex row inline'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:view-week-outline" class="text-primary text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Flex Row</div>
              <div class="text-[9px] opacity-50 truncate">Horizontal flex</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Core Components -->
      <div>
        <div class="text-[10px] uppercase font-bold tracking-wider text-base-content/40 px-1 mb-1">Core UI</div>
        <div class="grid grid-cols-2 gap-1.5">
          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-card')"
            data-show="!searchFilter || 'card box panel'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:crop-portrait" class="text-secondary text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Card</div>
              <div class="text-[9px] opacity-50 truncate">DaisyUI Card</div>
            </div>
          </button>

          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-buttonPrimary')"
            data-show="!searchFilter || 'button btn cta'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:smart-button" class="text-secondary text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Button</div>
              <div class="text-[9px] opacity-50 truncate">Primary CTA</div>
            </div>
          </button>

          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-badge')"
            data-show="!searchFilter || 'badge tag pill'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:label-outline" class="text-secondary text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Badge</div>
              <div class="text-[9px] opacity-50 truncate">Status pill</div>
            </div>
          </button>

          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-alert')"
            data-show="!searchFilter || 'alert notice notification banner'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:info-outline" class="text-secondary text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Alert</div>
              <div class="text-[9px] opacity-50 truncate">Notice box</div>
            </div>
          </button>

          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-stat')"
            data-show="!searchFilter || 'stat metric number counter'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:monitoring" class="text-secondary text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Stat Block</div>
              <div class="text-[9px] opacity-50 truncate">KPI metric</div>
            </div>
          </button>

          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-accordion')"
            data-show="!searchFilter || 'accordion collapse faq expand'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:expand-more" class="text-secondary text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Accordion</div>
              <div class="text-[9px] opacity-50 truncate">Collapsible</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Form Controls -->
      <div>
        <div class="text-[10px] uppercase font-bold tracking-wider text-base-content/40 px-1 mb-1">Forms &amp; Inputs</div>
        <div class="grid grid-cols-2 gap-1.5">
          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-inputText')"
            data-show="!searchFilter || 'input text field form'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:edit-note" class="text-accent text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Text Input</div>
              <div class="text-[9px] opacity-50 truncate">Label &amp; input</div>
            </div>
          </button>

          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-select')"
            data-show="!searchFilter || 'select dropdown menu'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:arrow-drop-down-circle" class="text-accent text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Select Dropdown</div>
              <div class="text-[9px] opacity-50 truncate">Options menu</div>
            </div>
          </button>

          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-toggle')"
            data-show="!searchFilter || 'toggle switch boolean'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:toggle-on" class="text-accent text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Toggle Switch</div>
              <div class="text-[9px] opacity-50 truncate">On/off switch</div>
            </div>
          </button>

          <button class="btn btn-ghost btn-xs justify-start gap-2 bg-base-100 border border-base-content/5 hover:border-primary/40 hover:bg-base-300/50 py-2 h-auto text-left"
            data-on-click="insertSnippet('snip-textarea')"
            data-show="!searchFilter || 'textarea text multiline'.includes(searchFilter.toLowerCase())">
            <iconify-icon icon="material-symbols-light:notes" class="text-accent text-base shrink-0"></iconify-icon>
            <div class="truncate">
              <div class="font-bold text-[11px]">Text Area</div>
              <div class="text-[9px] opacity-50 truncate">Multiline note</div>
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- ================= TAB 2: SECTIONS ================= -->
    <div data-show="activeTab === 'sections'" class="space-y-2">
      <button class="w-full text-left p-2.5 rounded-xl bg-base-100 border border-base-content/5 hover:border-secondary/50 hover:bg-base-300/40 transition-all flex items-center gap-3"
        data-on-click="insertSnippet('snip-sectionHero')"
        data-show="!searchFilter || 'hero header banner'.includes(searchFilter.toLowerCase())">
        <div class="w-10 h-10 rounded-lg bg-secondary/10 text-secondary flex items-center justify-center shrink-0">
          <iconify-icon icon="material-symbols-light:title" class="text-2xl"></iconify-icon>
        </div>
        <div class="flex-1 truncate">
          <div class="font-bold text-xs">Hero Section</div>
          <div class="text-[10px] opacity-50">Heading, subtitle &amp; CTA buttons</div>
        </div>
      </button>

      <button class="w-full text-left p-2.5 rounded-xl bg-base-100 border border-base-content/5 hover:border-secondary/50 hover:bg-base-300/40 transition-all flex items-center gap-3"
        data-on-click="insertSnippet('snip-sectionFeatures')"
        data-show="!searchFilter || 'features grid cards 3'.includes(searchFilter.toLowerCase())">
        <div class="w-10 h-10 rounded-lg bg-secondary/10 text-secondary flex items-center justify-center shrink-0">
          <iconify-icon icon="material-symbols-light:view-quilt" class="text-2xl"></iconify-icon>
        </div>
        <div class="flex-1 truncate">
          <div class="font-bold text-xs">Features Grid</div>
          <div class="text-[10px] opacity-50">3-column benefit cards</div>
        </div>
      </button>

      <button class="w-full text-left p-2.5 rounded-xl bg-base-100 border border-base-content/5 hover:border-secondary/50 hover:bg-base-300/40 transition-all flex items-center gap-3"
        data-on-click="insertSnippet('snip-sectionPricing')"
        data-show="!searchFilter || 'pricing tier cards subscription'.includes(searchFilter.toLowerCase())">
        <div class="w-10 h-10 rounded-lg bg-secondary/10 text-secondary flex items-center justify-center shrink-0">
          <iconify-icon icon="material-symbols-light:payments-outline" class="text-2xl"></iconify-icon>
        </div>
        <div class="flex-1 truncate">
          <div class="font-bold text-xs">Pricing Section</div>
          <div class="text-[10px] opacity-50">Tier comparison cards</div>
        </div>
      </button>

      <button class="w-full text-left p-2.5 rounded-xl bg-base-100 border border-base-content/5 hover:border-secondary/50 hover:bg-base-300/40 transition-all flex items-center gap-3"
        data-on-click="insertSnippet('snip-sectionCTA')"
        data-show="!searchFilter || 'cta call to action banner'.includes(searchFilter.toLowerCase())">
        <div class="w-10 h-10 rounded-lg bg-secondary/10 text-secondary flex items-center justify-center shrink-0">
          <iconify-icon icon="material-symbols-light:campaign-outline" class="text-2xl"></iconify-icon>
        </div>
        <div class="flex-1 truncate">
          <div class="font-bold text-xs">Call To Action</div>
          <div class="text-[10px] opacity-50">Conversion banner with button</div>
        </div>
      </button>

      <button class="w-full text-left p-2.5 rounded-xl bg-base-100 border border-base-content/5 hover:border-secondary/50 hover:bg-base-300/40 transition-all flex items-center gap-3"
        data-on-click="insertSnippet('snip-sectionFooter')"
        data-show="!searchFilter || 'footer copyright links navigation'.includes(searchFilter.toLowerCase())">
        <div class="w-10 h-10 rounded-lg bg-secondary/10 text-secondary flex items-center justify-center shrink-0">
          <iconify-icon icon="material-symbols-light:bottom-panel-open" class="text-2xl"></iconify-icon>
        </div>
        <div class="flex-1 truncate">
          <div class="font-bold text-xs">Multi-column Footer</div>
          <div class="text-[10px] opacity-50">Links, brand &amp; legal copy</div>
        </div>
      </button>
    </div>

    <!-- ================= TAB 3: REACTIVE NEXUS BLOCKS ================= -->
    <div data-show="activeTab === 'nexus'" class="space-y-2">
      <div class="alert alert-info text-[11px] p-2.5 bg-info/10 border-info/20 text-info-content mb-2 flex items-start gap-2">
        <iconify-icon icon="material-symbols-light:info-outline" class="text-lg text-info shrink-0 mt-0.5"></iconify-icon>
        <span>These blocks include live <code>data-signal</code>, <code>data-bind</code>, and <code>data-on</code> directives that run reactively!</span>
      </div>

      <button class="w-full text-left p-2.5 rounded-xl bg-base-100 border border-base-content/5 hover:border-accent/50 hover:bg-base-300/40 transition-all flex items-center gap-3"
        data-on-click="insertSnippet('snip-nexusCounter')">
        <div class="w-10 h-10 rounded-lg bg-accent/10 text-accent flex items-center justify-center shrink-0">
          <iconify-icon icon="material-symbols-light:add-circle" class="text-2xl"></iconify-icon>
        </div>
        <div class="flex-1 truncate">
          <div class="font-bold text-xs">Reactive Counter</div>
          <div class="text-[10px] opacity-50 font-mono text-accent">data-signal="{ count: 0 }"</div>
        </div>
      </button>

      <button class="w-full text-left p-2.5 rounded-xl bg-base-100 border border-base-content/5 hover:border-accent/50 hover:bg-base-300/40 transition-all flex items-center gap-3"
        data-on-click="insertSnippet('snip-nexusFilterList')">
        <div class="w-10 h-10 rounded-lg bg-accent/10 text-accent flex items-center justify-center shrink-0">
          <iconify-icon icon="material-symbols-light:filter-alt" class="text-2xl"></iconify-icon>
        </div>
        <div class="flex-1 truncate">
          <div class="font-bold text-xs">Live Search List</div>
          <div class="text-[10px] opacity-50 font-mono text-accent">data-bind + data-for</div>
        </div>
      </button>

      <button class="w-full text-left p-2.5 rounded-xl bg-base-100 border border-base-content/5 hover:border-accent/50 hover:bg-base-300/40 transition-all flex items-center gap-3"
        data-on-click="insertSnippet('snip-nexusTabs')">
        <div class="w-10 h-10 rounded-lg bg-accent/10 text-accent flex items-center justify-center shrink-0">
          <iconify-icon icon="material-symbols-light:tab" class="text-2xl"></iconify-icon>
        </div>
        <div class="flex-1 truncate">
          <div class="font-bold text-xs">Reactive Tabs View</div>
          <div class="text-[10px] opacity-50 font-mono text-accent">data-show="activeTab === N"</div>
        </div>
      </button>
    </div>

    <!-- ================= TAB 4: DOM TREE NAVIGATOR ================= -->
    <div data-show="activeTab === 'tree'" class="space-y-1">
      <div class="flex items-center justify-between px-1 pb-1">
        <span class="text-[10px] uppercase font-bold text-base-content/40 tracking-wider">DOM Hierarchy</span>
        <button class="btn btn-ghost btn-xs text-primary gap-1" data-on-click="refreshTree()">
          <iconify-icon icon="material-symbols-light:refresh" class="text-sm"></iconify-icon>
          <span class="text-[10px]">Sync</span>
        </button>
      </div>

      <div class="space-y-0.5 max-h-[500px] overflow-y-auto pr-1">
        <template data-for="item in domTree">
          <div class="flex items-center gap-1.5 px-2 py-1 rounded hover:bg-base-300/60 cursor-pointer text-xs font-mono transition-colors"
            data-class="{ 'bg-primary/20 text-primary font-bold': selectedEl && selectedEl === item.el }"
            data-style="{ paddingLeft: (item.depth * 12 + 8) + 'px' }"
            data-on-click="selectElement(item.el)">
            <iconify-icon data-bind-icon="item.icon" class="opacity-60 text-xs shrink-0"></iconify-icon>
            <span data-bind="item.tag" class="truncate"></span>
            <span data-show="item.classSummary" data-bind="'.' + item.classSummary" class="text-[10px] opacity-40 truncate"></span>
          </div>
        </template>
        <div data-show="!domTree || domTree.length === 0" class="text-center py-8 opacity-40 text-xs font-sans">
          Click Sync or load canvas to view DOM nodes.
        </div>
      </div>
    </div>

  </div>

  <!-- HIDDEN TEMPLATES FOR INJECTION (Zero Quote Escaping Fragility) -->
  <div class="hidden">
    <template id="snip-container">
      <div class="max-w-6xl mx-auto w-full p-6 border border-dashed border-base-content/20 rounded-2xl">
        <h3 class="text-xl font-bold mb-2">New Container</h3>
        <p class="text-sm text-base-content/60">Add content here...</p>
      </div>
    </template>

    <template id="snip-grid2">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 my-4">
        <div class="p-6 bg-base-200/50 rounded-xl border border-base-content/5">
          <h4 class="font-bold">Column 1</h4>
          <p class="text-xs text-base-content/60">Content block</p>
        </div>
        <div class="p-6 bg-base-200/50 rounded-xl border border-base-content/5">
          <h4 class="font-bold">Column 2</h4>
          <p class="text-xs text-base-content/60">Content block</p>
        </div>
      </div>
    </template>

    <template id="snip-grid3">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 my-4">
        <div class="p-4 bg-base-200/50 rounded-xl border border-base-content/5">
          <h4 class="font-bold text-sm">Card 1</h4>
        </div>
        <div class="p-4 bg-base-200/50 rounded-xl border border-base-content/5">
          <h4 class="font-bold text-sm">Card 2</h4>
        </div>
        <div class="p-4 bg-base-200/50 rounded-xl border border-base-content/5">
          <h4 class="font-bold text-sm">Card 3</h4>
        </div>
      </div>
    </template>

    <template id="snip-flexRow">
      <div class="flex flex-wrap items-center gap-3 p-3 bg-base-200/30 rounded-xl">
        <button class="btn btn-sm btn-primary">Button</button>
        <button class="btn btn-sm btn-ghost">Cancel</button>
      </div>
    </template>

    <template id="snip-card">
      <div class="card bg-base-200 border border-base-content/10 shadow-md my-4">
        <div class="card-body p-6">
          <h3 class="card-title text-base font-bold">Card Title</h3>
          <p class="text-xs text-base-content/70">A flexible content card with action buttons.</p>
          <div class="card-actions justify-end mt-2">
            <button class="btn btn-primary btn-xs">Confirm</button>
          </div>
        </div>
      </div>
    </template>

    <template id="snip-buttonPrimary">
      <button class="btn btn-primary btn-sm my-2">Click Me</button>
    </template>

    <template id="snip-badge">
      <span class="badge badge-primary badge-sm my-1">New Feature</span>
    </template>

    <template id="snip-alert">
      <div class="alert alert-info shadow-sm my-3 p-3 text-xs flex items-center gap-2">
        <iconify-icon icon="material-symbols-light:info" class="text-lg"></iconify-icon>
        <span>System update successfully deployed.</span>
      </div>
    </template>

    <template id="snip-stat">
      <div class="stat bg-base-200/60 rounded-xl border border-base-content/10 p-4">
        <div class="stat-title text-xs opacity-60">Total Conversions</div>
        <div class="stat-value text-primary text-2xl font-black">14,280</div>
        <div class="stat-desc text-[10px]">+18% this month</div>
      </div>
    </template>

    <template id="snip-accordion">
      <div class="collapse collapse-arrow bg-base-200 border border-base-content/10 rounded-xl my-2">
        <input type="checkbox" />
        <div class="collapse-title text-sm font-bold">Frequently Asked Question</div>
        <div class="collapse-content text-xs text-base-content/70">
          <p>Here is the detailed answer explaining the topic in depth.</p>
        </div>
      </div>
    </template>

    <template id="snip-inputText">
