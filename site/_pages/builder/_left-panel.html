<!-- Authentic VvvebJs #left-panel with Complete Components, Blocks & Recursive Navigator -->
<aside class="w-64 sm:w-72 lg:w-80 h-full flex flex-col bg-base-100 border-r border-base-content/10 overflow-hidden select-none text-xs" id="left-panel">

  <!-- ================= TAB 1: PAGES & NAVIGATOR ================= -->
  <div class="flex-1 flex flex-col min-h-0 overflow-hidden" data-show="activeSidebarTab === 'pages'">
    
    <!-- File Manager Section Header -->
    <div class="p-2 border-b border-base-content/10 flex items-center justify-between gap-1.5 bg-base-200/40">
      <div class="relative flex-1">
        <input type="search" placeholder="Pages"
          class="input input-bordered input-xs w-full pr-5 rounded font-sans text-xs h-6"
          data-bind-value="searchFilter" />
      </div>
      <div class="flex items-center gap-1">
        <button class="btn btn-outline btn-xs h-6 px-2 min-h-0 rounded text-[11px] gap-1 font-normal hover:bg-base-300" title="New page (Ctrl + Shift + P)" data-on-click="clearCanvas()">
          <span>Add page</span>
          <iconify-icon icon="material-symbols-light:add" class="text-xs"></iconify-icon>
        </button>
        <button class="btn btn-outline btn-xs h-6 w-6 min-h-0 p-0 rounded hover:bg-base-300" title="New section (Ctrl + Shift + S)" data-on-click="addSectionBoxOpen = true">
          <iconify-icon icon="material-symbols-light:add" class="text-xs"></iconify-icon>
        </button>
      </div>
    </div>

    <!-- Pages List -->
    <div class="overflow-y-auto max-h-48 p-1 border-b border-base-content/10 flex flex-col gap-0.5">
      <div class="group flex items-center justify-between px-2 py-1 rounded cursor-pointer transition-colors"
        data-class="{ 'bg-primary/15 text-primary font-bold': currentDoc.includes('landing'), 'hover:bg-base-200 text-base-content/80': !currentDoc.includes('landing') }"
        data-on-click="loadTemplate('/_pages/builder/templates/landing.html')">
        <div class="flex items-center gap-2 truncate">
          <iconify-icon icon="material-symbols-light:description-outline" class="text-sm shrink-0"></iconify-icon>
          <span class="truncate">Home page</span>
        </div>
        <div class="hidden group-hover:flex items-center gap-1 shrink-0 text-base-content/50">
          <button class="hover:text-error" title="Delete" data-on-click:stop=""><iconify-icon icon="material-symbols-light:delete-outline" class="text-xs"></iconify-icon></button>
          <button class="hover:text-primary" title="Open" data-on-click:stop="window.open(currentDoc)"><iconify-icon icon="material-symbols-light:open-in-new" class="text-xs"></iconify-icon></button>
          <button class="hover:text-primary" title="Duplicate" data-on-click:stop=""><iconify-icon icon="material-symbols-light:content-copy" class="text-xs"></iconify-icon></button>
        </div>
      </div>

      <div class="group flex items-center justify-between px-2 py-1 rounded cursor-pointer transition-colors"
        data-class="{ 'bg-primary/15 text-primary font-bold': currentDoc.includes('blank'), 'hover:bg-base-200 text-base-content/80': !currentDoc.includes('blank') }"
        data-on-click="loadTemplate('/_pages/builder/templates/blank.html')">
        <div class="flex items-center gap-2 truncate">
          <iconify-icon icon="material-symbols-light:draft-outline" class="text-sm shrink-0"></iconify-icon>
          <span class="truncate">Blank page</span>
        </div>
        <div class="hidden group-hover:flex items-center gap-1 shrink-0 text-base-content/50">
          <button class="hover:text-error" title="Delete" data-on-click:stop=""><iconify-icon icon="material-symbols-light:delete-outline" class="text-xs"></iconify-icon></button>
          <button class="hover:text-primary" title="Duplicate" data-on-click:stop=""><iconify-icon icon="material-symbols-light:content-copy" class="text-xs"></iconify-icon></button>
        </div>
      </div>

      <div class="flex items-center gap-2 px-2 py-1 rounded hover:bg-base-200 text-base-content/70 cursor-pointer">
        <iconify-icon icon="material-symbols-light:description-outline" class="text-sm shrink-0"></iconify-icon>
        <span class="truncate">Contact us page</span>
      </div>
      <div class="flex items-center gap-2 px-2 py-1 rounded hover:bg-base-200 text-base-content/70 cursor-pointer">
        <iconify-icon icon="material-symbols-light:description-outline" class="text-sm shrink-0"></iconify-icon>
        <span class="truncate">Index landing</span>
      </div>
    </div>

    <!-- DOM Tree Navigator Section (Docked at bottom of left panel) -->
    <div class="flex-1 flex flex-col min-h-0 overflow-hidden" data-show="showTreeList">
      <div class="px-2.5 py-1 bg-base-200/60 border-b border-base-content/10 flex items-center justify-between text-[11px] font-medium">
        <div class="flex items-center gap-1.5">
          <iconify-icon icon="material-symbols-light:account-tree-outline" class="text-xs opacity-70"></iconify-icon>
          <span>Navigator</span>
        </div>
        <div class="flex items-center gap-1 text-base-content/60">
          <button class="hover:text-base-content px-0.5 flex items-center" title="Collapse" data-on-click="showTreeList = false">―</button>
          <button class="hover:text-base-content px-0.5 flex items-center" title="Refresh DOM Navigator" data-on-click="refreshTree()">
            <iconify-icon icon="material-symbols-light:refresh" class="text-xs"></iconify-icon>
          </button>
          <button class="hover:text-base-content px-0.5 flex items-center" title="Close" data-on-click="showTreeList = false">✕</button>
        </div>
      </div>

      <!-- Live Tree List Items -->
      <div class="flex-1 overflow-y-auto p-1 flex flex-col gap-0.5 font-mono text-[11px]">
        <template data-for="item in domTree">
          <div class="flex items-center gap-1.5 px-2 py-1 rounded cursor-pointer transition-colors"
            data-style="{ paddingLeft: (item.depth * 12 + 6) + 'px' }"
            data-class="{ 'bg-primary text-primary-content font-bold shadow-sm': selectedEl === item.el, 'hover:bg-base-200 text-base-content/80': selectedEl !== item.el }"
            data-on-click="selectElement(item.el)">
            <iconify-icon data-bind-icon="item.icon" class="text-xs shrink-0 opacity-80"></iconify-icon>
            <span data-bind="item.tag"></span>
            <span class="text-[10px] opacity-60 truncate" data-bind="item.classSummary" data-show="item.classSummary"></span>
          </div>
        </template>
        <div data-show="domTree.length === 0" class="text-center py-6 text-base-content/40 italic">
          Click refresh to inspect DOM hierarchy
        </div>
      </div>
    </div>

  </div>

  <!-- ================= TAB 2: COMPONENTS & BLOCKS ================= -->
  <div class="flex-1 flex flex-col min-h-0 overflow-hidden" data-show="activeSidebarTab === 'components'">
    
    <!-- Subtabs: [ Components ] [ Blocks ] -->
    <div class="flex border-b border-base-content/15 bg-base-200/40">
      <button class="flex-1 py-1.5 text-center text-xs font-medium border-b-2 transition-colors"
        data-class="{ 'border-primary text-primary font-bold bg-base-100': componentsSubTab === 'components', 'border-transparent text-base-content/70 hover:text-base-content': componentsSubTab !== 'components' }"
        data-on-click="componentsSubTab = 'components'">
        <iconify-icon icon="material-symbols-light:crop-square" class="mr-1 text-xs"></iconify-icon>
        Components
      </button>
      <button class="flex-1 py-1.5 text-center text-xs font-medium border-b-2 transition-colors"
        data-class="{ 'border-primary text-primary font-bold bg-base-100': componentsSubTab === 'blocks', 'border-transparent text-base-content/70 hover:text-base-content': componentsSubTab !== 'blocks' }"
        data-on-click="componentsSubTab = 'blocks'">
        <iconify-icon icon="material-symbols-light:content-copy" class="mr-1 text-xs"></iconify-icon>
        Blocks
      </button>
    </div>

        <input type="text" placeholder="Search components"

          data-bind-value="searchFilter" />
        <button class="absolute right-1.5 top-1 text-base-content/40 hover:text-base-content text-xs"

      </div>
      <button class="btn btn-ghost btn-xs h-6 w-6 min-h-0 p-0 text-base-content/50 hover:text-base-content">―</button>
    </div>

      <!-- Group 1: Base -->

        <div class="grid grid-cols-2 gap-2">
          
          <!-- Heading -->

            <span class="text-2xl font-serif font-black mb-1 group-hover:text-primary">H</span>

            <span class="text-[11px] text-base-content/80 group-hover:text-primary">Horizontal Rule</span>

          <!-- Form -->
          <button class="h-20 flex flex-col items-center justify-center p-2 rounded bg-base-100 border border-base-content/15 hover:border-primary hover:shadow-sm transition-all group"

          <!-- Input -->
          <button class="h-20 flex flex-col items-center justify-center p-2 rounded bg-base-100 border border-base-content/15 hover:border-primary hover:shadow-sm transition-all group"

            <span class="text-[11px] text-base-content/80 group-hover:text-primary">Input</span>
          </button>

          <!-- Text Area -->
          <button class="h-20 flex flex-col items-center justify-center p-2 rounded bg-base-100 border border-base-content/15 hover:border-primary hover:shadow-sm transition-all group"

            <div class="px-2 py-0.5 border border-current rounded text-[10px] font-mono mb-1 group-hover:text-primary">I</div>

          <!-- Select Input -->
          <button class="h-20 flex flex-col items-center justify-center p-2 rounded bg-base-100 border border-base-content/15 hover:border-primary hover:shadow-sm transition-all group"

          <button class="h-20 flex flex-col items-center justify-center p-2 rounded bg-base-100 border border-base-content/15 hover:border-primary hover:shadow-sm transition-all group"

          <!-- Radio Button -->

          <!-- Link -->
          <button class="h-20 flex flex-col items-center justify-center p-2 rounded bg-base-100 border border-base-content/15 hover:border-primary hover:shadow-sm transition-all group"

            <iconify-icon icon="material-symbols-light:link" class="text-2xl mb-1 group-hover:text-primary"></iconify-icon>
            <span class="text-[11px] text-base-content/80 group-hover:text-primary">Link</span>
          </button>

          <!-- Html Button -->
          <button class="h-20 flex flex-col items-center justify-center p-2 rounded bg-base-100 border border-base-content/15 hover:border-primary hover:shadow-sm transition-all group"
            data-on-click="insertSnippet('snip-button')">
            <div class="px-2 py-0.5 rounded-full border border-current text-[8px] font-bold uppercase mb-1 group-hover:text-primary">Button</div>
            <span class="text-[11px] text-base-content/80 group-hover:text-primary">Html Button</span>
          </button>

          <!-- Paragraph -->
          <button class="h-20 flex flex-col items-center justify-center p-2 rounded bg-base-100 border border-base-content/15 hover:border-primary hover:shadow-sm transition-all group"

            <span class="text-2xl font-serif mb-1 group-hover:text-primary">¶</span>
            <span class="text-[11px] text-base-content/80 group-hover:text-primary">Paragraph</span>

          <!-- Blockquote -->
          <button class="h-20 flex flex-col items-center justify-center p-2 rounded bg-base-100 border border-base-content/15 hover:border-primary hover:shadow-sm transition-all group"
            data-on-click="insertSnippet('snip-quote')">

            <span class="text-[11px] text-base-content/80 group-hover:text-primary">Blockquote</span>
          </button>

          <!-- List -->
          <button class="h-20 flex flex-col items-center justify-center p-2 rounded bg-base-100 border border-base-content/15 hover:border-primary hover:shadow-sm transition-all group"

          <!-- Table -->
          <button class="h-20 flex flex-col items-center justify-center p-2 rounded bg-base-100 border border-base-content/15 hover:border-primary hover:shadow-sm transition-all group"

            <span class="text-[11px] text-base-content/80 group-hover:text-primary">Preformatted</span>

            <span class="text-[11px] text-base-content/80 group-hover:text-primary">Video</span>
          </button>

        </div>

          <!-- Card -->

            <span class="text-[11px] text-base-content/80 group-hover:text-primary">Card</span>
          </button>

            <span class="text-[11px] text-base-content/80 group-hover:text-primary">Alert</span>

    <!-- Blocks Subtab (Pre-configured Layout Modules) -->

      <div class="text-[11px] font-bold text-base-content/70 px-1 mb-2">Layout Blocks</div>
      
      <button class="w-full text-left p-2.5 rounded bg-base-100 border border-base-content/15 hover:border-primary transition-colors flex items-center justify-between"
