<head>
  <meta name="internal" content="true">
</head>
<!-- Authentic VvvebJs #canvas Workspace with in-canvas Overlays -->
<main class="flex-1 min-w-0 h-full bg-base-300/40 p-3 sm:p-6 flex flex-col items-center overflow-auto relative select-none"
  id="canvas">

  <!-- Viewport Framing Container (#iframe-wrapper) -->
  <div class="transition-all duration-300 relative bg-base-100 shadow-2xl overflow-visible shrink-0"
    data-class="{
      'w-full max-w-full rounded-lg': viewport === 'desktop',
      'w-[1200px] max-w-[1200px] rounded-xl border-4 border-base-content/20 my-2': viewport === 'laptop',
      'w-[1024px] max-w-[1024px] rounded-xl border-4 border-base-content/20 my-2': viewport === 'tablet-landscape',
      'w-[768px] max-w-[768px] rounded-2xl border-4 border-base-content/20 my-4': viewport === 'tablet',
      'w-[375px] max-w-[375px] rounded-3xl border-8 border-base-content/25 my-4': viewport === 'mobile'
    }"
    data-style="{
      transform: 'scale(' + (zoom / 100) + ')',
      transformOrigin: 'top center'
    }">

    <!-- Mobile Device Camera / Speaker Notch -->
    <div class="h-4 bg-base-content/15 rounded-t-2xl flex items-center justify-center gap-1.5"
      data-show="viewport === 'mobile'">
      <div class="w-12 h-2 rounded-full bg-base-content/30"></div>
      <div class="w-2 h-2 rounded-full bg-base-content/30"></div>
    </div>

    <!-- The Encapsulated Shadow DOM Canvas Host (#builder-canvas-host) -->
    <div id="builder-canvas-host"
      class="min-h-[85vh] w-full bg-base-100 overflow-y-auto overflow-x-hidden relative"
      data-component="{ path: currentDoc, shadowrootmode: 'open' }"
      data-effect="
        const host = $el;
        if (!host.__builder_bound) {
          host.__builder_bound = true;

          // Handle selection click inside shadow root
          host.addEventListener('click', function(e) {
            if (previewMode) return;
            const target = e.composedPath ? e.composedPath()[0] : e.target;
            if (target && target.nodeType === 1 && target !== host) {
              e.preventDefault();
              e.stopPropagation();
              selectElement(target);
            }
          }, true);

          // Handle hover highlight inside shadow root
          host.addEventListener('pointermove', function(e) {
            if (previewMode) return;
            const target = e.composedPath ? e.composedPath()[0] : e.target;
            if (target && target.nodeType === 1 && target !== host) {
              updateHoverBox(target);
            }
          }, true);

          host.addEventListener('pointerleave', function() {
            hoverBox.visible = false;
          });

          // Handle double click for inline text editing
          host.addEventListener('dblclick', function(e) {
            if (previewMode) return;
            const target = e.composedPath ? e.composedPath()[0] : e.target;
            if (target && target.nodeType === 1) {
              target.contentEditable = 'true';
              target.focus();
              target.addEventListener('blur', function onBlur() {
                target.contentEditable = 'false';
                target.removeEventListener('blur', onBlur);
                selectElement(target);
                syncCanvasHtmlToDraft();
              });
            }
          }, true);
        }

        if (selectedEl) {
          updateSelectedBox();
        }
      ">
    </div>

    <!-- ================= 1. HOVER HIGHLIGHT BOX (#highlight-box) ================= -->
    <div id="highlight-box"
      class="absolute pointer-events-none border border-dashed border-info z-30 transition-all duration-75"
      data-show="!previewMode && hoverBox.visible && (!selectedEl || hoveredEl !== selectedEl)"
      data-style="{
        top: hoverBox.top + 'px',
        left: hoverBox.left + 'px',
        width: hoverBox.width + 'px',
        height: hoverBox.height + 'px'
      }">
      
      <!-- Highlight Name Pill -->
      <div class="absolute -top-5 start-0 bg-info text-info-content text-[9px] font-mono font-bold px-1.5 py-0.5 rounded shadow-sm flex items-center gap-1">
        <span data-bind="hoverBox.tag"></span>
      </div>

      <!-- Section Actions: (+) Add Element Button -->
      <div class="absolute -bottom-3 end-2 pointer-events-auto">
        <button class="btn btn-circle btn-info btn-xs h-5 w-5 min-h-0 text-info-content shadow-md hover:scale-110 transition-transform"
          data-on-click="selectElement(hoveredEl); addSectionBoxOpen = true"
          title="Add Section / Component">
          <iconify-icon icon="material-symbols-light:add" class="text-xs"></iconify-icon>
        </button>
      </div>
    </div>

    <!-- ================= 2. SELECTION BOX & FLOATING TOOLBARS (#select-box) ================= -->
    <div id="select-box"
      class="absolute pointer-events-none border-2 border-primary z-40 transition-all duration-75"
      data-show="!previewMode && selectedBox.visible"
      data-style="{
        top: selectedBox.top + 'px',
        left: selectedBox.left + 'px',
        width: selectedBox.width + 'px',
        height: selectedBox.height + 'px'
      }">

      <!-- A. FLOATING WYSIWYG EDITOR (#wysiwyg-editor) - Appears above text nodes -->
      <div id="wysiwyg-editor"
        class="absolute -top-11 start-0 bg-base-100 text-base-content rounded-lg p-1 shadow-2xl border border-base-content/15 flex items-center gap-1 pointer-events-auto z-50 overflow-visible"
        data-show="selectedBox.isText">
        
        <!-- Bold, Italic, Underline, Strike -->
        <div class="flex items-center gap-0.5 border-r border-base-content/10 pr-1">
          <button class="btn btn-ghost btn-xs h-6 w-6 min-h-0 p-0 hover:bg-base-200" data-on-click="formatInline('bold')" title="Bold">
            <iconify-icon icon="material-symbols-light:format-bold" class="text-sm"></iconify-icon>
          </button>
          <button class="btn btn-ghost btn-xs h-6 w-6 min-h-0 p-0 hover:bg-base-200" data-on-click="formatInline('italic')" title="Italic">
            <iconify-icon icon="material-symbols-light:format-italic" class="text-sm"></iconify-icon>
          </button>
          <button class="btn btn-ghost btn-xs h-6 w-6 min-h-0 p-0 hover:bg-base-200" data-on-click="formatInline('underline')" title="Underline">
            <iconify-icon icon="material-symbols-light:format-underlined" class="text-sm"></iconify-icon>
          </button>
          <button class="btn btn-ghost btn-xs h-6 w-6 min-h-0 p-0 hover:bg-base-200" data-on-click="formatInline('strike')" title="Strikethrough">
            <iconify-icon icon="material-symbols-light:strikethrough-s" class="text-sm"></iconify-icon>
          </button>
        </div>

        <!-- Text Align Dropdown -->
        <div class="dropdown">
          <div tabindex="0" role="button" class="btn btn-ghost btn-xs h-6 w-6 min-h-0 p-0 hover:bg-base-200" title="Text Align">
            <iconify-icon icon="material-symbols-light:format-align-left" class="text-sm"></iconify-icon>
          </div>
          <ul tabindex="0" class="dropdown-content menu p-1 shadow-xl bg-base-200 border border-base-content/10 rounded-box w-28 z-50 text-xs">
            <li><button data-on-click="formatInline('align', 'left')">Left</button></li>
            <li><button data-on-click="formatInline('align', 'center')">Center</button></li>
            <li><button data-on-click="formatInline('align', 'right')">Right</button></li>
            <li><button data-on-click="formatInline('align', 'justify')">Justify</button></li>
          </ul>
        </div>

        <!-- Color Pickers -->
        <div class="flex items-center gap-1 border-x border-base-content/10 px-1">
          <input type="color" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent"
            data-on-input="formatInline('color', $evt.target.value)"
            title="Text Color" />
          <input type="color" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent"
            data-on-input="formatInline('bgColor', $evt.target.value)"
            title="Background Color" />
        </div>

        <!-- Font Size Select -->
        <select class="select select-bordered select-xs h-6 min-h-0 text-[10px] px-1 py-0 rounded"
          data-on-change="formatInline('fontSize', $evt.target.value)">
          <option value="">Size</option>
          <option value="12px">12px</option>
          <option value="14px">14px</option>
          <option value="16px">16px</option>
          <option value="18px">18px</option>
          <option value="20px">20px</option>
          <option value="24px">24px</option>
          <option value="32px">32px</option>
          <option value="48px">48px</option>
        </select>

        <!-- Font Family Select -->
        <select class="select select-bordered select-xs h-6 min-h-0 text-[10px] px-1 py-0 rounded"
          data-on-change="formatInline('fontFamily', $evt.target.value)">
          <option value="">Font</option>
          <option value="system-ui, sans-serif">Sans</option>
          <option value="Georgia, serif">Serif</option>
          <option value="monospace">Mono</option>
        </select>
      </div>

      <!-- B. Element Tag Badge -->
      <div class="absolute -top-5 start-0 bg-primary text-primary-content text-[9px] font-mono font-bold px-1.5 py-0.5 rounded shadow-sm pointer-events-auto flex items-center gap-1"
        data-show="!selectedBox.isText">
        <span data-bind="selectedBox.tag"></span>
        <span data-show="selectedBox.id" data-bind="'#' + selectedBox.id" class="opacity-80"></span>
      </div>

      <!-- C. Quick Action Toolbar (#select-actions) -->
      <div id="select-actions"
        class="absolute -top-7 end-0 bg-base-200/95 backdrop-blur-md text-base-content rounded-lg p-0.5 shadow-xl border border-base-content/15 flex items-center gap-0.5 pointer-events-auto z-50">
        
        <!-- Drag Handle Indicator -->
        <button class="btn btn-ghost btn-circle btn-xs h-6 w-6 min-h-0 cursor-grab" title="Drag element">
          <iconify-icon icon="material-symbols-light:drag-pan" class="text-xs opacity-60"></iconify-icon>
        </button>

        <!-- Select Parent -->
        <button class="btn btn-ghost btn-circle btn-xs h-6 w-6 min-h-0 hover:bg-base-300" data-on-click="selectParent()" title="Select Parent Element">
          <iconify-icon icon="material-symbols-light:arrow-upward-alt" class="text-xs"></iconify-icon>
        </button>

        <!-- Move Up -->
        <button class="btn btn-ghost btn-circle btn-xs h-6 w-6 min-h-0 hover:bg-base-300" data-on-click="moveElementUp()" title="Move Up">
          <iconify-icon icon="material-symbols-light:arrow-upward" class="text-xs"></iconify-icon>
        </button>

        <!-- Move Down -->
        <button class="btn btn-ghost btn-circle btn-xs h-6 w-6 min-h-0 hover:bg-base-300" data-on-click="moveElementDown()" title="Move Down">
          <iconify-icon icon="material-symbols-light:arrow-downward" class="text-xs"></iconify-icon>
        </button>

        <!-- Edit HTML Code -->
        <button class="btn btn-ghost btn-circle btn-xs h-6 w-6 min-h-0 hover:bg-base-300" data-on-click="bottomPanelExpanded = true; codeTab = 'html'" title="Edit HTML">
          <iconify-icon icon="material-symbols-light:code" class="text-xs"></iconify-icon>
        </button>

        <!-- Duplicate Element -->
        <button class="btn btn-ghost btn-circle btn-xs h-6 w-6 min-h-0 hover:bg-base-300" data-on-click="duplicateElement()" title="Duplicate Element">
          <iconify-icon icon="material-symbols-light:content-copy-outline" class="text-xs"></iconify-icon>
        </button>

        <!-- Delete Element -->
        <button class="btn btn-ghost btn-circle btn-xs h-6 w-6 min-h-0 text-error hover:bg-error/15" data-on-click="deleteElement()" title="Delete Element">
          <iconify-icon icon="material-symbols-light:delete-outline" class="text-xs"></iconify-icon>
        </button>
      </div>

      <!-- D. 8-Point Resize Handles -->
      <div class="absolute -top-1.5 -left-1.5 w-3 h-3 bg-white border-2 border-primary rounded-sm pointer-events-auto cursor-nwse-resize shadow-sm"></div>
      <div class="absolute -top-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-white border-2 border-primary rounded-sm pointer-events-auto cursor-ns-resize shadow-sm"></div>
      <div class="absolute -top-1.5 -right-1.5 w-3 h-3 bg-white border-2 border-primary rounded-sm pointer-events-auto cursor-nesw-resize shadow-sm"></div>
      <div class="absolute top-1/2 -translate-y-1/2 -left-1.5 w-3 h-3 bg-white border-2 border-primary rounded-sm pointer-events-auto cursor-ew-resize shadow-sm"></div>
      <div class="absolute top-1/2 -translate-y-1/2 -right-1.5 w-3 h-3 bg-white border-2 border-primary rounded-sm pointer-events-auto cursor-ew-resize shadow-sm"></div>
      <div class="absolute -bottom-1.5 -left-1.5 w-3 h-3 bg-white border-2 border-primary rounded-sm pointer-events-auto cursor-nesw-resize shadow-sm"></div>
      <div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-white border-2 border-primary rounded-sm pointer-events-auto cursor-ns-resize shadow-sm"></div>
      <div class="absolute -bottom-1.5 -right-1.5 w-3 h-3 bg-white border-2 border-primary rounded-sm pointer-events-auto cursor-nwse-resize shadow-sm"></div>

    </div>

    <!-- ================= 3. CONTEXTUAL ADD SECTION DRAWER (#add-section-box) ================= -->
    <div id="add-section-box"
      class="absolute inset-x-8 top-16 bg-base-200/95 backdrop-blur-xl border border-base-content/15 rounded-2xl shadow-2xl p-4 z-50 transition-all duration-200"
      data-show="addSectionBoxOpen">
      
      <!-- Drawer Header & Placement Mode -->
      <div class="flex items-center justify-between border-b border-base-content/10 pb-3 mb-3">
        <div class="flex items-center gap-3">
          <span class="font-bold text-sm">Add Component / Section</span>
          <div class="flex items-center gap-2 bg-base-100 px-2 py-1 rounded-lg border border-base-content/10">
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="add-mode" value="after" class="radio radio-xs radio-primary"
                data-on-change="addSectionMode = 'after'" checked="checked" />
              <span class="text-[11px] font-semibold">After</span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="add-mode" value="inside" class="radio radio-xs radio-primary"
                data-on-change="addSectionMode = 'inside'" />
              <span class="text-[11px] font-semibold">Inside</span>
            </label>
          </div>
        </div>

        <button class="btn btn-circle btn-ghost btn-xs" data-on-click="addSectionBoxOpen = false">✕</button>
      </div>

      <!-- Quick Section Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <button class="btn btn-outline btn-xs py-3 h-auto flex flex-col items-center gap-1 bg-base-100" data-on-click="insertSnippet('snip-hero')">
          <iconify-icon icon="material-symbols-light:view-agenda" class="text-primary text-xl"></iconify-icon>
          <span class="font-bold text-xs">Hero Section</span>
        </button>
        <button class="btn btn-outline btn-xs py-3 h-auto flex flex-col items-center gap-1 bg-base-100" data-on-click="insertSnippet('snip-features')">
          <iconify-icon icon="material-symbols-light:featured-play-list" class="text-secondary text-xl"></iconify-icon>
          <span class="font-bold text-xs">Features Grid</span>
        </button>
        <button class="btn btn-outline btn-xs py-3 h-auto flex flex-col items-center gap-1 bg-base-100" data-on-click="insertSnippet('snip-pricing')">
          <iconify-icon icon="material-symbols-light:payments" class="text-accent text-xl"></iconify-icon>
          <span class="font-bold text-xs">Pricing Table</span>
        </button>
        <button class="btn btn-outline btn-xs py-3 h-auto flex flex-col items-center gap-1 bg-base-100" data-on-click="insertSnippet('snip-cta')">
          <iconify-icon icon="material-symbols-light:campaign" class="text-warning text-xl"></iconify-icon>
          <span class="font-bold text-xs">CTA Banner</span>
        </button>
      </div>

    </div>

  </div>

</main>
